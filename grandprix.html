        const x = (i * 97 + t * 260) % w, y = (i * 53 + t * 900) % h;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 3, y + 9); ctx.stroke();
      }
    }

    // 車
    const ord = orderAt(t);
    const pit = pitSpan();
    let pitSlot = 0;
    for (let i = ord.length - 1; i >= 0; i--) {
      const o = ord[i], e = o.e;
      if (!o.out && pit && inPit(e, t)) {
        // ピット作業中はガレージ前に停めて、作業中と分かるようにする
        const idx = (pit.from + 6 + (pitSlot++ % 5) * 7) % poly.n;
        const nm = normalAt(idx);
        const px = nm.x + nm.nx * pit.side * 20, py = nm.y + nm.ny * pit.side * 20;
        const ang = Math.atan2(nm.dy, nm.dx);
        drawCar(px, py, ang, e.color, e.isPlayer, false, e.gen || 0, 0);
        // 作業中のクルーと、残り時間
        const li = lapInfo(e, t);
        const pt = (e.pitTime || [])[li.lap - 1] || 1;
        const left = Math.max(0, li.lapTime - li.into);
        // 作業の進み具合 0..1。これで手順のどこにいるかを決める
        const prog = Math.max(0, Math.min(1, 1 - left / Math.max(0.1, pt)));
        drawPitCrew(px, py, ang, e, prog, t, tyreNow(e, t));
        ctx.save();
        ctx.translate(px, py - 13);
        ctx.fillStyle = '#fff34d'; ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 2;
        ctx.fillRect(-13, -7, 26, 12); ctx.strokeRect(-13, -7, 26, 12);
        ctx.fillStyle = '#4a2f1a'; ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('PIT ' + left.toFixed(1), 0, 2);
        ctx.restore();
        continue;
      }
      const pt2 = placeInLap(e, o.p);
      const vel = pt2.v == null ? 1 : pt2.v;
      emit(e, pt2, vel, o.out, wet);
      drawCar(pt2.x, pt2.y, pt2.ang, e.color, e.isPlayer, o.out, e.gen || 0, vel, pt2.steer);
    }
    GP.fx.drawParticles(ctx);
    ctx.restore();

    // 光・被写界深度・色調をまとめて乗せる
    ctx = out;
    if (buf) {
      // ネオンや照明は、明るさだけでは足りないので光源として別に足す
      if (emissive.length) {
        GP.fx.addLight(function (lg) {
          lg.save();
          camTransform(lg);
          for (let i = 0; i < emissive.length; i++) {
            const em = emissive[i];
            lg.fillStyle = em.c;
            lg.fillRect(em.x, em.y, em.w, em.h);
          }
          lg.restore();
        });
      }
      // カメラが寄っているときほど、周りをぼかしてジオラマらしく見せる
      const dof = Math.max(0, Math.min(1, (cam.z - 1) / 1.5));
      GP.fx.composite(out, {
        focus: { x: w / 2, y: h / 2 },
        focusR: w * (0.46 - dof * 0.14),
        dof: dof,
        bloom: night ? 1.15 : (wet ? 0.85 : 0.72),
        warm: night ? 1.1 : 0.85,
        vignette: 0.9,
        night: night
      });
    }
    drawOverlay(t);
  }

  /* ---------- 走行にともなう粒子 ----------
     火花はコーナー立ち上がりの底打ち、砂ぼこりはコースアウト、
     水しぶきは雨のときの後輪から。走っている車だけが出す。        */
  function emit(e, pt, vel, out, wet) {
    if (out) {
      if (Math.random() < 0.35) GP.fx.spawn(pt.x, pt.y, 'dust', Math.random() * 6.283, 0.6);
      return;
    }
    const back = pt.ang + Math.PI;
    if (wet && Math.random() < 0.5) {
      GP.fx.spawn(pt.x - Math.cos(pt.ang) * 7, pt.y - Math.sin(pt.ang) * 7, 'spray', back, 0.5 + vel);
    }
    // 速度が乗った状態＝路面を強く押しつけている所で火花が散る
    if (vel > 0.88 && Math.random() < 0.16) {
      GP.fx.spawn(pt.x - Math.cos(pt.ang) * 8, pt.y - Math.sin(pt.ang) * 8, 'spark', back, 1);
    }
  }

  /* ---------- 画面に重ねる情報 ---------- */
  function drawOverlay(t) {
    const w = cv.width;
    // いま何を映しているか
    if (cam.label) {
      ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
      const tw = ctx.measureText(cam.label).width + 14;
      ctx.fillStyle = 'rgba(40,24,10,.78)';
      ctx.fillRect(8, 8, tw, 20);
      ctx.fillStyle = '#ffeec4';
      ctx.fillText(cam.label, 15, 22);
    }
    // 最終ラップ
    const leader = orderAt(t).filter(o => !o.out)[0];
    if (leader) {
      const lap = Math.min(res.laps, Math.floor(leader.p) + 1);
      if (lap >= res.laps) {
        const a = 0.65 + Math.sin(t * 4) * 0.35;
        ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = 'rgba(40,24,10,.7)';
        ctx.fillRect(w / 2 - 82, 6, 164, 28);
        ctx.fillStyle = 'rgba(255,243,77,' + a.toFixed(2) + ')';
        ctx.fillText('FINAL LAP', w / 2, 28);
      }
    }
  }

  /* ---------- マシンのドット絵 ----------
     上から見たF1の形をそのまま組む。寸法は実車比（全長5.6m×全幅2.0m）を
     1m≒5.5px で置いたもの。世代が上がるほど部品が増えていく。
     前方が +x、車体の右が +y。光は車体の前左（-y側）から当たっている前提。   */
  function drawCar(x, y, ang, color, isPlayer, out, gen, vel, steer) {
    gen = Math.max(0, Math.min(5, gen | 0));
    vel = vel == null ? 1 : vel;
    steer = steer || 0;

    const dark = shade(color, -0.16);      // 影になる面
    const lite = shade(color, 0.18);       // 光が当たる面
    const CARBON = '#22232a', CARBON2 = '#3a3c45', TYRE = '#15161a';

    // 世代ごとの寸法。新しいほど長く低く、ウイングが大きくなる
    const nose  = 15.0 + gen * 0.45;                // ノーズの先端
    const fwX   = nose - 2.6;                       // フロントウイング（前輪より前）
    const fwH   = 7.2 + gen * 0.26;                 // フロントウイングの半幅（車体最大幅）
    const rwX   = -12.0 - gen * 0.28;               // リアウイングの位置
    const rwH   = 5.6 + gen * 0.24;                 // リアウイングの半幅
    const podH  = 3.2 + (gen >= 3 ? 0.4 : 0);       // サイドポッドの張り出し
    const trk   = 5.1 + gen * 0.06;                 // タイヤ中心までの距離
    const tyL   = 5.0 + gen * 0.16, tyH = 1.95;     // タイヤの長さ／半分の太さ
    const frontAx = 8.2, rearAx = -7.4;             // 前後の車軸
    const S = 0.80;                                 // 路面幅との釣り合いを取る全体倍率

    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.rotate(ang);
    ctx.scale(S, S);
    ctx.globalAlpha = out ? 0.3 : 1;

    const r = (rx, ry, rw, rh, c) => { ctx.fillStyle = c; ctx.fillRect(rx, ry, rw, rh); };

    if (!out && vel > 0.82) {
      // 高速域はスピードラインを引いて伸びを見せる
      ctx.strokeStyle = 'rgba(255,255,255,' + ((vel - 0.82) * 2.0).toFixed(2) + ')';
      ctx.lineWidth = 1;
      const tail = 7 + (vel - 0.82) * 52;
      ctx.beginPath();
      ctx.moveTo(rwX - 1, -2.4); ctx.lineTo(rwX - 1 - tail, -2.4);
      ctx.moveTo(rwX - 1, 2.4);  ctx.lineTo(rwX - 1 - tail, 2.4);
      ctx.stroke();
    }

    // ---- 影（車体の下だけに、光と反対へ少しずらして落とす）----
    r(rwX + 1.5, -1.8, nose - rwX - 2, 5.0, 'rgba(0,0,0,.30)');

    // ---- タイヤ（後輪は固定、前輪は切れ角ぶん回す）----
    const tyre = (tx, ty, rot) => {
      ctx.save();
      ctx.translate(tx, ty);
      if (rot) ctx.rotate(rot);
      r(-tyL / 2, -tyH, tyL, tyH * 2, TYRE);
      r(-tyL / 2, -tyH, tyL, 0.9, '#4e515c');                        // 上面の照り
      r(-tyL / 2, tyH - 0.6, tyL, 0.6, '#0c0d10');                   // 下側の締まり
      if (gen >= 2) r(-1.1, -tyH + 0.5, 2.2, tyH * 2 - 1.0, '#5c606c');  // ホイール
      else r(-0.9, -tyH + 0.6, 1.8, tyH * 2 - 1.2, '#3d404a');
      ctx.restore();
    };
    tyre(rearAx, -trk, 0);  tyre(rearAx, trk, 0);
    tyre(frontAx, -trk, steer); tyre(frontAx, trk, steer);

    // ---- サスペンションアーム（車体とタイヤをつなぐ）----
    r(rearAx - 0.5, -trk + 1.4, 1.1, trk - 3.0, CARBON2);
    r(rearAx - 0.5, 1.6, 1.1, trk - 3.0, CARBON2);
    r(frontAx - 0.5, -trk + 1.4, 1.1, trk - 2.6, CARBON2);
    r(frontAx - 0.5, 1.2, 1.1, trk - 2.6, CARBON2);

    // ---- フロア／バージボード（第3世代以降）----
    if (gen >= 3) {
      r(rearAx, -podH - 0.8, frontAx - rearAx - 2, 0.8, CARBON2);
      r(rearAx, podH, frontAx - rearAx - 2, 0.8, CARBON2);
    }

    // ---- サイドポッド ----
    r(-5.5, -podH, 9.5, podH - 1.7, dark);
    r(-5.5, 1.7, 9.5, podH - 1.7, dark);
    r(-5.5, -podH, 9.5, 0.8, lite);                     // 上端の照り
    if (gen >= 2) {                                      // 冷却の吸気口
      r(3.4, -podH + 0.4, 1.3, podH - 2.1, CARBON);
      r(3.4, 1.7, 1.3, podH - 2.1, CARBON);
    }

    // ---- 車体 ----
    // 後ろへ向かって絞り込む（コークボトル）。段ごとに幅を変えて形を出す。
    const seg = (x0, x1, half, c) => {
      r(x0, -half, x1 - x0, half * 2, c);
      r(x0, -half, x1 - x0, Math.max(0.7, half * 0.42), lite);   // 光の当たる上面
      r(x0, half - Math.max(0.6, half * 0.34), x1 - x0, Math.max(0.6, half * 0.34), dark);
    };
    seg(rwX + 2.0, -6.0, 1.5, color);       // リアデッキ（いちばん細い）
    seg(-6.0, -1.8, 2.4, color);            // エンジンカバー（いちばん太い）
    seg(-1.8, 3.4, 2.0, color);             // コクピット
    seg(3.4, nose - 3.0, 1.3, color);       // ノーズ
    seg(nose - 3.0, nose, 0.85, color);     // 先端
    // 中央のストライプ。小さくてもチームを見分けやすくする
    r(rwX + 2.0, -0.45, nose - rwX - 2.0, 0.9, shade(color, 0.30));

    // ---- コクピットと乗員 ----
    r(-0.6, -1.4, 3.6, 2.8, CARBON);                    // 開口部
    r(0.2, -0.9, 2.0, 1.8, shade(color, 0.36));         // ヘルメット
    r(0.2, -0.9, 2.0, 0.7, '#f4f4f4');                  // ヘルメットの照り
    if (gen >= 5) {                                      // ハロ
      r(3.1, -1.9, 0.8, 3.8, '#61646e');
      r(-0.8, -2.0, 4.0, 0.7, '#61646e');
      r(-0.8, 1.3, 4.0, 0.7, '#61646e');
    }
    if (gen >= 4) r(rwX + 3, -0.4, 6.5, 0.9, '#eeeeee');  // エンジンカバーのフィン

    // ---- リアウイング ----
    r(rwX + 1.2, -1.8, 1.5, 3.6, '#2c2e34');            // ディフューザー
    r(rwX, -rwH, 2.6, rwH * 2, CARBON);
    r(rwX, -rwH, 2.6, 0.9, CARBON2);
    if (gen >= 1) {                                      // 翼端板
      r(rwX - 0.5, -rwH - 1.1, 3.8, 1.1, dark);
      r(rwX - 0.5, rwH, 3.8, 1.1, dark);
    }
    if (gen >= 4) r(rwX + 2.2, -rwH + 0.7, 1.0, rwH * 2 - 1.4, CARBON2);  // DRSの上段

    // ---- フロントウイング ----
    r(fwX, -fwH, 2.4, fwH * 2, CARBON);
    r(fwX, -fwH, 2.4, 0.9, CARBON2);
    if (gen >= 1) {
      r(fwX - 0.4, -fwH - 1.1, 3.2, 1.1, dark);          // 翼端板
      r(fwX - 0.4, fwH, 3.2, 1.1, dark);
    }
    if (gen >= 2) r(fwX + 1.9, -fwH + 0.9, 0.9, fwH * 2 - 1.8, CARBON2);  // 2段目

    // ---- ブレーキランプ ----
    if (!out && vel < 0.52) {
      const a = (0.55 + (0.52 - vel)).toFixed(2);
      r(rwX + 1.0, -1.4, 1.2, 2.8, 'rgba(255,60,40,' + a + ')');
      if (!standalone) GP.fx.addLight(function (lg) {
        lg.save(); camTransform(lg); lg.translate(x, y); lg.rotate(ang);
        lg.fillStyle = 'rgba(255,70,50,.95)';
        lg.fillRect(rwX + 1.0, -1.4, 1.2, 2.8);
        lg.restore();
      });
    }
    ctx.restore();

    if (isPlayer && !out) {
      // 自チームは矢印マーカー付き
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y) - 16);
      const bob = Math.sin(vt * 6) * 1.5;
      ctx.fillStyle = '#fff34d'; ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 8 + bob); ctx.lineTo(-5, 1 + bob); ctx.lineTo(5, 1 + bob); ctx.closePath();
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }

  /* ---------- ピット作業 ----------
     実際の手順どおりに進める。
       0.00-0.18  車が停まり、ジャッキが入る
       0.18-0.45  ホイールガンでナットを外し、古いタイヤを引き抜く
       0.45-0.72  新しいタイヤを差し込んで締める
       0.72-0.90  ジャッキを下ろす
       0.90-1.00  ロリポップが上がり、発進を待つ
     クルーはチームカラーのつなぎを着ている。                        */
  function drawPitCrew(px, py, ang, e, prog, t, tyre) {
    const col = e.color;
    const dark = shade(col, -0.18);
    const SUIT = col, HELM = shade(col, 0.28), SKIN = '#e8b98e';
    const jackUp = prog > 0.16 && prog < 0.86;          // 車が持ち上がっている区間
    const off = prog < 0.45 ? Math.min(1, (prog - 0.18) / 0.27)     // 旧タイヤを外す進み
              : 0;
    const on = prog >= 0.45 && prog < 0.72 ? (prog - 0.45) / 0.27 : (prog >= 0.72 ? 1 : 0);

    ctx.save();
    ctx.translate(px, py);
    ctx.rotate(ang);

    // 持ち上がっているあいだは、車の下に隙間の影を落とす。
    // 車体そのものは drawCar が先に描いているので、ここで覆わないよう細くする。
    if (jackUp) {
      ctx.fillStyle = 'rgba(0,0,0,.34)';
      ctx.fillRect(-8, 2.6, 18, 1.8);
    }

    const person = (x, y, face, busy) => {
      const bob = busy ? Math.sin(t * 22 + x * 3 + y) * 0.9 : 0;
      ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.fillRect(x - 2.4, y + 2.6, 5, 1.6);
      ctx.fillStyle = dark;  ctx.fillRect(x - 2.4, y - 2.4 + bob, 5, 5.2);   // つなぎ
      ctx.fillStyle = SUIT;  ctx.fillRect(x - 2.4, y - 2.4 + bob, 5, 2.4);
      ctx.fillStyle = SKIN;  ctx.fillRect(x - 1, y + 0.4 + bob, 2, 1.4);     // 手
      ctx.fillStyle = HELM;  ctx.fillRect(x - 2, y - 4.6 + bob, 4.2, 2.4);   // ヘルメット
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(x - 2, y - 4.6 + bob, 4.2, 0.8);
      if (face) {                                                            // ホイールガン
        ctx.fillStyle = '#2b2e36';
        ctx.fillRect(x + face * 2.2, y - 0.6 + bob, 2.6 * face, 1.6);
        if (prog > 0.18 && prog < 0.72) {                                    // 回転の火花
          ctx.fillStyle = 'rgba(255,210,120,' + (0.4 + Math.random() * 0.5).toFixed(2) + ')';
          ctx.fillRect(x + face * 4.6, y - 1.4 + bob + Math.random() * 3, 1.2, 1.2);
        }
      }
    };

    // 4輪それぞれに、ガン担当とタイヤ担当が付く
    const CORNERS = [[7.4, -6.6, -1], [7.4, 6.6, -1], [-6.6, -6.6, 1], [-6.6, 6.6, 1]];
    CORNERS.forEach((c2, i) => {
      const [cx, cy, face] = c2;
      const sy = cy < 0 ? -1 : 1;
      // 外したタイヤを地面に置く／新品を運んでくる
      const tc = tyre ? (GP.data.TYRES[tyre] || {}).color : null;
      if (off > 0) {                                    // 外した古いタイヤ
        ctx.fillStyle = '#17181c';
        ctx.fillRect(cx - 2, cy + sy * (4 + off * 5), 4, 2.6);
      }
      if (on > 0 && on < 1) {                           // 運んでくる新品
        ctx.fillStyle = '#17181c';
        ctx.fillRect(cx - 2, cy + sy * (9 - on * 5), 4, 2.6);
        if (tc) { ctx.fillStyle = tc; ctx.fillRect(cx - 2, cy + sy * (9 - on * 5), 4, 0.9); }
      }
      person(cx, cy + sy * 4.4, face, prog > 0.18 && prog < 0.72);     // ガン担当
      person(cx + face * 3.4, cy + sy * 7.6, 0, prog < 0.72);          // タイヤ担当
    });

    // 前後のジャッキ担当
    ctx.fillStyle = '#3a3d46';
    if (jackUp) {
      ctx.fillRect(12.5, -1.6, 4.5, 3.2);      // 前ジャッキ
      ctx.fillRect(-13, -1.6, 4.5, 3.2);       // 後ジャッキ
    }
    person(16.5, 0, 0, false);
    person(-16, 0, 0, false);

    // ロリポップ（発進の合図）。最後に上がって緑になる
    const goSign = prog >= 0.9;
    ctx.save();
    ctx.translate(0, -12 - (goSign ? 5 : 0));
    ctx.fillStyle = '#6a6a72'; ctx.fillRect(-0.7, 0, 1.4, 9);
    ctx.fillStyle = goSign ? '#3fd44a' : '#e8402c';
    ctx.beginPath(); ctx.arc(0, -1.5, 3.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.arc(-1, -2.6, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    if (goSign) {
      if (!standalone) GP.fx.addLight(function (lg) {
        lg.save(); camTransform(lg); lg.translate(px, py); lg.rotate(ang);
        lg.fillStyle = '#3fd44a';
        lg.beginPath(); lg.arc(0, -18.5, 3.4, 0, Math.PI * 2); lg.fill();
        lg.restore();
      });
    }
    ctx.restore();
  }

  /* ---------- ループ ---------- */
  function tick(ts) {
    if (!running) return;
    const dt = Math.min(0.05, (ts - lastTs) / 1000 || 0.016);
    lastTs = ts;
    GP.fx.stepParticles(dt);
    if (lights < 1) {
      lights = Math.min(1, lights + dt / 2.4);
      draw(0); drawLights(lights); updateHud();
      raf = requestAnimationFrame(tick);
      return;
    }
    // speed は「レース全体を何秒で見せるか」。実時間に対する倍率をそこから出す
    vt += dt * (duration / speed);
    if (vt >= duration) {
      vt = duration; draw(vt); updateHud(); flushEvents(true);
      // チェッカーフラッグの演出をひと呼吸だけ見せる
      if (chequer < 1) {
        chequer = Math.min(1, chequer + dt / 1.6);
        drawChequer(chequer);
        raf = requestAnimationFrame(tick);
        return;
      }
      running = false; finish(); return;
    }
    draw(vt);
    updateHud();
    raf = requestAnimationFrame(tick);
  }

  /* ---------- HUD（順位・ラップ・実況）---------- */
  function updateHud() {
    const ord = orderAt(vt);
    const leader = ord[0];
    const lap = Math.min(res.laps, Math.floor(leader.p) + 1);
    document.getElementById('rvLap').textContent = 'LAP ' + lap + ' / ' + res.laps;

    const box = document.getElementById('rvOrder');
    let html = '';
    ord.forEach((o, i) => {
      const e = o.e;
      const gapNum = leader.p - o.p;
      const pitting = !o.out && inPit(e, vt);
      const gap = o.out ? 'DNF' : pitting ? 'PIT' : (i === 0 ? '先頭' : '-' + (gapNum * res.track.base).toFixed(1) + 's');
      const ty = tyreNow(e, vt);
      let chip = '<span class="rv-ty">–</span>';
      if (ty) {
        const td = GP.data.TYRES.find(x => x.key === ty.key) || GP.data.TYRES[1];
        const worn = ty.age > td.life ? ' worn' : ty.age > td.life * 0.75 ? ' old' : '';
        chip = '<span class="rv-ty' + worn + '" style="background:' + td.color + ';color:' + td.text +
          '" title="' + td.name + '／' + ty.age + '周使用（寿命' + td.life + '周）">' + td.short +
          '<em>' + ty.age + '</em></span>';
      }
      html += '<div class="rv-row' + (e.isPlayer ? ' me' : '') + (o.out ? ' out' : '') + (pitting ? ' pitting' : '') + '">' +
        '<span class="rv-pos">' + (i + 1) + '</span>' +
        '<span class="rv-chip" style="background:' + e.color + '"></span>' +
        '<span class="rv-name">' + e.driver.name + '</span>' +
        chip +
        '<span class="rv-gap">' + gap + '</span></div>';
    });
    box.innerHTML = html;
    advanceSectors(vt);
    renderSectors();
    flushEvents(false);
  }

  function flushEvents(all) {
    const lapNow = vt / (res.track.base) + 1;
    const log = document.getElementById('rvLog');
    while (shownEvents < res.events.length) {
      const ev = res.events[shownEvents];
      if (!all && ev.lap > lapNow) break;
      if (!all) {
        if (ev.type === 'pass') GP.sound.play('pass', 140);
        else if (ev.type === 'pit') GP.sound.play('pit', 140);
        else if (ev.type === 'dnf') GP.sound.play('dnf', 300);
      }
      const div = document.createElement('div');
      div.className = 'rv-ev rv-' + ev.type;
      div.textContent = 'L' + ev.lap + ' ' + ev.text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      shownEvents++;
    }
  }

  /* =========================================================
     区間タイム
     各車の各セクター完了時刻を並べておき、再生の進行に合わせて
     セッション最速（紫）と自己ベスト（緑）を更新していく
     ========================================================= */
  let secTimeline = [], secPtr = 0, liveBest = [Infinity, Infinity, Infinity], liveCar = {};

  function buildSectorTimeline() {
    secTimeline = []; secPtr = 0;
    liveBest = [Infinity, Infinity, Infinity]; liveCar = {};
    res.entries.forEach(e => {
      liveCar[e.id] = { best: [Infinity, Infinity, Infinity], cur: [null, null, null],
                        at: [0, 0, 0], lastLap: null, lap: 0 };
      const laps = e.dnf && e.dnfLap > 0 ? e.dnfLap - 1 : e.sectors.length;
      for (let l = 0; l < laps; l++) {
        const sec = e.sectors[l];
        if (!sec) continue;
        const lapStart = l === 0 ? 0 : e.cum[l - 1];
        let acc = lapStart;
        for (let k = 0; k < 3; k++) {
          acc += sec[k];
          secTimeline.push({ t: acc, id: e.id, lap: l + 1, k: k, v: sec[k], lapTime: k === 2 ? e.lapTimes[l] : 0 });
        }
      }
    });
    secTimeline.sort((a, b) => a.t - b.t);
  }

  function advanceSectors(t) {
    while (secPtr < secTimeline.length && secTimeline[secPtr].t <= t) {
      const s = secTimeline[secPtr++];
      const c = liveCar[s.id];
      if (!c) continue;
      // 前周のタイムは消さずに残し、今周のぶんだけ上書きしていく
      c.cur[s.k] = s.v;
      c.at[s.k] = s.lap;
      c.lap = s.lap;
      // 1周目はスタート進行ぶんで大きくブレるのでベスト判定から外す
      if (s.lap > 1) {
        if (s.v < c.best[s.k]) c.best[s.k] = s.v;
        if (s.v < liveBest[s.k]) liveBest[s.k] = s.v;
      }
      if (s.k === 2) c.lastLap = s.lapTime;
    }
  }

  function fmtSec(v) {
    if (v == null) return '--.---';
    return v.toFixed(3);
  }
  function fmtLap(v) {
    if (v == null) return '--:--.---';
    const m = Math.floor(v / 60), r = v - m * 60;
    return m + ':' + (r < 10 ? '0' : '') + r.toFixed(3);
  }

  function renderSectors() {
    const box = document.getElementById('rvSectors');
    if (!box) return;
    const mine = res.entries.filter(e => e.isPlayer);
    let h = '';
    mine.forEach(e => {
      const c = liveCar[e.id];
      const ty = tyreNow(e, vt);
      let tychip = '';
      if (ty) {
        const td = GP.data.TYRES.find(x => x.key === ty.key) || GP.data.TYRES[1];
        const leftPct = Math.max(0, Math.min(100, (1 - ty.age / td.life) * 100));
        const cls = leftPct < 12 ? ' worn' : leftPct < 35 ? ' old' : '';
        tychip = '<span class="sc-ty' + cls + '" title="' + td.name + '／' + ty.age + '周使用（寿命の目安 ' + td.life + '周）">' +
          '<b style="background:' + td.color + ';color:' + td.text + '">' + td.short + '</b>' +
          '<i><u style="width:' + leftPct.toFixed(0) + '%;background:' + td.color + '"></u></i>' +
          '<em>' + ty.age + '周</em></span>';
      }
      // バッテリー残量
      const li2 = lapInfo(e, vt);
      const er = (e.lapErs || [])[li2.lap - 1] || (e.lapErs || [])[0];
      let erchip = '<span class="sc-ers"></span>';
      if (er) {
        const pct = Math.max(0, Math.min(100, er.level / er.cap * 100));
        const cls = pct < 20 ? ' low' : pct < 45 ? ' mid' : '';
        erchip = '<span class="sc-ers' + cls + '" title="バッテリー ' + er.level + ' / ' + er.cap + '">' +
          '🔋<i><u style="width:' + pct.toFixed(0) + '%"></u></i></span>';
      }
      h += '<div class="sc-row"><span class="sc-nm">' +
        '<i style="background:' + e.color + '"></i>' + e.driver.name + '</span>' + tychip + erchip;
      for (let k = 0; k < 3; k++) {
        const v = c.cur[k];
        let cls = '';
        if (v != null && liveBest[k] !== Infinity) {
          if (v <= liveBest[k] + 1e-9) cls = ' purple';
          else if (c.best[k] !== Infinity && v <= c.best[k] + 1e-9) cls = ' green';
        }
        // 今周に出したタイムかどうかで濃さを変える
        if (v != null && c.at[k] !== c.lap) cls += ' old';
        h += '<span class="sc-t' + cls + '">' + fmtSec(v) + '</span>';
      }
      h += '<span class="sc-lap">' + fmtLap(c.lastLap) + '</span></div>';
    });
    h += '<div class="sc-row best"><span class="sc-nm">セッション最速</span><span class="sc-ty"></span><span class="sc-ers"></span>' +
      [0, 1, 2].map(k => '<span class="sc-t purple">' +
        (liveBest[k] === Infinity ? '--.---' : fmtSec(liveBest[k])) + '</span>').join('') +
      '<span class="sc-lap"></span></div>';
    box.innerHTML = h;
  }

  function finish() { if (onEnd) { const f = onEnd; onEnd = null; f(); } }

  /* ---------- 公開API ---------- */
  function start(canvas, result, endCb) {
    cv = canvas; ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    res = result; onEnd = endCb;
    poly = buildPoly(res.track.path, cv.width, cv.height, 34);
    res.entries.forEach(e => { e._prof = e.prof; });
    buildSectorTimeline();
    trackArt = buildTrackArt();
    GP.fx.init(cv.width, cv.height);
    cam = { x: cv.width / 2, y: cv.height / 2, z: 1, tx: cv.width / 2, ty: cv.height / 2, tz: 1,
            mode: 'auto', focusId: null, label: '' };
    duration = Math.max(1, Math.max.apply(null, res.entries.map(e => e.cum[e.cum.length - 1])));
    vt = 0; shownEvents = 0; lightBeeps = 0; running = true; lastTs = performance.now(); speed = 95; lights = 0; chequer = 0;
    document.getElementById('rvLog').innerHTML = '';
    raf = requestAnimationFrame(tick);
  }
  function setSpeed(s) { speed = s; }
  /* 実時間モード。レースの所要時間そのものを再生時間にする＝等速 */
  function setRealtime() { speed = duration; return duration; }
  function raceDuration() { return duration; }
  function skip() {
    running = false; lights = 1; chequer = 1;
    if (raf) cancelAnimationFrame(raf);
    vt = duration;
    draw(vt); updateHud(); flushEvents(true); finish();
  }

  /* ---------- チェッカーフラッグ ---------- */
  function drawChequer(p) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const w = cv.width, h = cv.height;
    ctx.fillStyle = 'rgba(20,12,6,' + (0.35 * Math.min(1, p * 3)).toFixed(2) + ')';
    ctx.fillRect(0, 0, w, h);
    // 旗が振られる
    const sway = Math.sin(p * 22) * 6;
    const cx = w / 2, cy = h / 2 - 10;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(sway * Math.PI / 180);
    const sq = 11;
    for (let r = 0; r < 5; r++) for (let c2 = 0; c2 < 7; c2++) {
      ctx.fillStyle = ((r + c2) % 2) ? '#2b1c0e' : '#fffdf3';
      ctx.fillRect(-7 * sq / 2 + c2 * sq, -5 * sq / 2 + r * sq + Math.sin(p * 18 + c2) * 2, sq, sq);
    }
    ctx.restore();
    ctx.fillStyle = '#7a6a52'; ctx.fillRect(cx - 7 * sq / 2 - 4, cy - 5 * sq / 2, 4, 5 * sq + 22);
    if (p > 0.35) {
      ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 4;
      ctx.strokeText('FINISH!', cx, cy + 5 * sq / 2 + 40);
      ctx.fillStyle = '#fff34d';
      ctx.fillText('FINISH!', cx, cy + 5 * sq / 2 + 40);
    }
  }

  /* ---------- スタートシグナル ---------- */
  let lightBeeps = 0;
  function drawLights(p) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const w = cv.width;
    const cxl = w / 2, cy = 46;
    const on = Math.min(5, Math.floor(p * 6.2));      // 5つ順に点灯
    const out = p > 0.86;                              // 一斉消灯＝スタート
    if (!out && on > lightBeeps) { lightBeeps = on; GP.sound.play('light'); }
    if (out && lightBeeps < 6) { lightBeeps = 6; GP.sound.play('go'); }
    ctx.fillStyle = 'rgba(20,12,6,.82)';
    ctx.fillRect(cxl - 72, cy - 20, 144, 40);
    ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 3;
    ctx.strokeRect(cxl - 72, cy - 20, 144, 40);
    for (let i = 0; i < 5; i++) {
      const x = cxl - 56 + i * 28;
      ctx.fillStyle = '#241a12';
      ctx.fillRect(x - 10, cy - 12, 20, 24);
      const lit = !out && i < on;
      ctx.fillStyle = lit ? '#ff2a1a' : '#3a2a22';
      ctx.beginPath(); ctx.arc(x, cy, 7, 0, Math.PI * 2); ctx.fill();
      if (lit) {
        ctx.fillStyle = 'rgba(255,80,50,.35)';
        ctx.beginPath(); ctx.arc(x, cy, 11, 0, Math.PI * 2); ctx.fill();
      }
    }
    if (out) {
      ctx.fillStyle = '#fff34d';
      ctx.font = 'bold 26px sans-serif'; ctx.textAlign = 'center';
      ctx.strokeStyle = '#4a2f1a'; ctx.lineWidth = 4;
      ctx.strokeText('GO!', cxl, cy + 46);
      ctx.fillText('GO!', cxl, cy + 46);
    }
  }
  function stop() { running = false; if (raf) cancelAnimationFrame(raf); onEnd = null; }

  /* レース以外の画面でもマシンを描けるようにする。
     drawCar はこのモジュール内の ctx に描くので、一時的に差し替える。 */
  function paintCar(target, x, y, ang, color, gen, vel) {
    const keep = ctx;
    ctx = target; standalone = true;
    try { drawCar(x, y, ang, color, false, false, gen, vel == null ? 0.7 : vel, 0); }
    finally { ctx = keep; standalone = false; }
  }

  /* コース形状の平滑化をミニコース図と共有する */
  function smoothPath(path, w, h, pad) { return buildPoly(path, w, h, pad).pts; }

  return { start, setSpeed, setRealtime, raceDuration, skip, stop, setCamMode, paintCar,
           _drawCar: drawCar, _drawPitCrew: drawPitCrew };
})();

</script>
<script>
/* ===== src/base.js ===== */
/* =========================================================
   チームの本拠地
   施設レベルで建物が実際に大きく・立派になり、
   ファン数とタイトル数で敷地の賑わいが変わる。
   ========================================================= */
window.GP = window.GP || {};

GP.base = (function () {
  'use strict';

  const W = 600, H = 340;

  /* 建物の区画。x,y は左下（正面）を基準にする */
  const PLOTS = [
    { key: 'pit',     x: 12,  y: 238, label: 'ピット設備' },
    { key: 'factory', x: 98,  y: 246, label: 'ファクトリー' },
    { key: 'tunnel',  x: 186, y: 238, label: '風洞' },
    { key: 'sim',     x: 298, y: 246, label: 'シミュレーター' },
    { key: 'youth',   x: 386, y: 240, label: 'ユース' },
    { key: 'market',  x: 466, y: 234, label: 'マーケ室' }
  ];

  let hitBoxes = [];
  let dusk = false;          // HD-2Dスキンのときは夕景で描く
  let off = false;           // オフ期間（建物は閉まり、人が敷地に出ている）

  /* 歩ける範囲。建物の手前の敷地を左右に移動する。
     建物より奥へは行けないので、キャラは常に建物より手前に描けばよい。 */
  const WALK = { x0: 18, x1: W - 18, y0: 262, y1: 318 };

  /* オフ期間に敷地へ出ている人。x は立っている位置 */
  const OFF_SPOTS = [
    { key: 'off:drv0',  x: 90  },
    { key: 'off:drv1',  x: 150 },
    { key: 'off:staff', x: 250 },
    { key: 'off:youth', x: 360 },
    { key: 'off:mgr',   x: 450 },
    { key: 'off:next',  x: 545 }     // 来季への出発
  ];

  /* その x に入口がある建物を返す（建物の真下に立つと入れる）*/
  function doorOf(x, y, g2) {
    // オフ期間は建物が閉まっていて、代わりに人が相手になる
    if (g2 && g2.offseason) {
      let best = null, bd = 1e9;
      OFF_SPOTS.forEach(s2 => {
        const d = Math.abs(x - s2.x);
        if (d < 26 && d < bd) { bd = d; best = { key: s2.key, x: s2.x }; }
      });
      return best;
    }
    let best = null, bd = 1e9;
    PLOTS.forEach(p => {
      const s = tierOf(g2.facilities[p.key] || 1);
      const cx = p.x + s.w / 2;
      const d = Math.abs(x - cx);
      if (d < 22 && d < bd) { bd = d; best = { key: p.key, x: cx, y: p.y }; }
    });
    return best;
  }

  /* 入口の位置（キャラをそこへ歩かせるのに使う）*/
  function doorPos(key, g2) {
    if (key && key.indexOf('off:') === 0) {
      const s2 = OFF_SPOTS.find(q => q.key === key);
      return s2 ? { x: s2.x, y: WALK.y1 - 6 } : null;
    }
    const p = PLOTS.find(q => q.key === key);
    if (!p) return null;
    const s = tierOf(g2.facilities[key] || 1);
    return { x: p.x + s.w / 2, y: WALK.y0 + 6 };
  }

  function clampWalk(x, y) {
    return { x: Math.max(WALK.x0, Math.min(WALK.x1, x)),
             y: Math.max(WALK.y0, Math.min(WALK.y1, y)) };
  }

  /* ---------- 歩く人 ----------
     チームプリンシパル（プレイヤー）。12×20くらいの大きさで、
     向き4方向 × 歩行3コマ。足の運びを左右で入れ替えて歩いて見せる。   */
  const ACTOR_SCALE = 1.4;      // 建物と並べたときに見える大きさ

  function drawActor(g, a) {
    const x = Math.round(a.x), y = Math.round(a.y);   // y は足元
    const dir = a.dir || 'down';
    const fr = a.moving ? (a.frame | 0) % 4 : 0;      // 0,1,2,3 → 立ち,右足,立ち,左足
    const step = fr === 1 ? 1 : (fr === 3 ? -1 : 0);
    const col = a.color || '#e04a3f';
    const mix = (hex, amt) => {
      const n = parseInt(hex.slice(1), 16);
      const c = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
      return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
    };
    const colD = mix(col, -0.16), colL = mix(col, 0.16);
    const SKIN = '#f0c49a', SKIN_D = '#d8a479', HAIR = '#3a2718';
    const r = (rx, ry, rw, rh, c) => { g.fillStyle = c; g.fillRect(x + rx, y + ry, rw, rh); };

    // 影（倍率をかける前の座標で描く）
    g.fillStyle = 'rgba(0,0,0,.32)';
    g.beginPath(); g.ellipse(x, y - 1, 6 * ACTOR_SCALE, 2.6 * ACTOR_SCALE, 0, 0, Math.PI * 2); g.fill();

    g.save();
    g.translate(x, y);
    g.scale(ACTOR_SCALE, ACTOR_SCALE);
    g.translate(-x, -y);

    // 脚（歩くと前後にずれる）
    r(-4, -7, 3, 7, '#2c3140');
    r(1, -7, 3, 7, '#2c3140');
    if (step) { r(-4, -7 + step, 3, 7, '#2c3140'); r(1, -7 - step, 3, 7, '#343a4c'); }
    r(-5, -1, 4, 2, '#1a1d26');            // 靴
    r(1, -1, 4, 2, '#1a1d26');

    // 胴（チームカラーのジャケット）
    r(-5, -16, 10, 9, colD);
    r(-4, -16, 8, 9, col);
    r(-4, -16, 8, 2, colL);                // 肩の照り
    r(-1, -15, 2, 8, mix(col, -0.28));     // 前合わせ
    // 腕
    const sw = a.moving ? step : 0;
    r(-6, -15 + sw, 2, 7, colD);
    r(4, -15 - sw, 2, 7, colD);
    r(-6, -9 + sw, 2, 2, SKIN);            // 手
    r(4, -9 - sw, 2, 2, SKIN);

    // 頭
    r(-4, -24, 8, 8, SKIN);
    r(2, -24, 2, 8, SKIN_D);               // 右側は影
    if (dir === 'up') {
      r(-4, -25, 8, 6, HAIR);              // 後ろ姿は髪だけ
    } else if (dir === 'left') {
      r(-4, -25, 8, 4, HAIR);
      r(-5, -24, 1, 4, HAIR);              // 顔の向きに合わせて髪を寄せる
      r(-3, -21, 2, 2, '#2a2028');         // 横顔の目
    } else if (dir === 'right') {
      r(-4, -25, 8, 4, HAIR);
      r(4, -24, 1, 4, HAIR);
      r(1, -21, 2, 2, '#2a2028');
    } else {
      r(-4, -25, 8, 4, HAIR);              // 前髪
      r(-4, -24, 1, 3, HAIR); r(3, -24, 1, 3, HAIR);
      r(-3, -21, 2, 2, '#2a2028');         // 目
      r(1, -21, 2, 2, '#2a2028');
      r(-1, -18, 2, 1, '#a8564a');         // 口
    }
    // 首元
    r(-2, -17, 4, 1, SKIN_D);
    g.restore();
  }



  /* レベルから建物の大きさと段階を決める */
  function tierOf(lv) {
    return { t: Math.min(4, Math.floor((lv - 1) / 2.5)), w: 40 + lv * 3.6, h: 26 + lv * 3.6 };
  }

  function seeded(n) {
    let h = (n * 2654435761) >>> 0;
    return function () { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  }

  /* ---------- 部品 ---------- */
  /* 建物の箱。輪郭・壁の陰影・屋根・地面際の締まりまでを一度に描く。
     ここを厚くすると、どの施設もまとめて立体的になる。               */
  function box(g, x, y, w, h, fill, top) {
    g.fillStyle = '#3a2413';                                  // 輪郭
    g.fillRect(x - 2, y - h - 2, w + 4, h + 4);
    g.fillStyle = fill;                                       // 壁
    g.fillRect(x, y - h, w, h);
    // 左から光が当たっている想定。左を明るく、右を暗く
    g.fillStyle = 'rgba(255,246,220,.18)';
    g.fillRect(x, y - h, Math.max(2, w * 0.26), h);
    g.fillStyle = 'rgba(40,24,10,.20)';
    g.fillRect(x + w - Math.max(2, w * 0.22), y - h, Math.max(2, w * 0.22), h);
    // 地面際は影で締める
    g.fillStyle = 'rgba(40,24,10,.30)';
    g.fillRect(x, y - 3, w, 3);
    // 屋根はチームカラーの帯。庇を少し張り出させて、縁に光を入れる
    const rh = Math.max(4, h * 0.20);
    g.fillStyle = top;
    g.fillRect(x, y - h, w, rh);
    g.fillStyle = 'rgba(255,255,255,.28)';
    g.fillRect(x, y - h, w, 1.4);                             // 屋根の縁の照り
    g.fillStyle = 'rgba(40,24,10,.35)';
    g.fillRect(x, y - h + rh - 1.2, w, 1.2);                  // 帯の下の影
    g.fillStyle = '#3a2413';
    g.fillRect(x - 2.5, y - h - 2.5, w + 5, 2.5);             // 庇
    g.fillStyle = shadeHex(top, 0.22);
    g.fillRect(x - 2.5, y - h - 2.5, w + 5, 1.2);
  }

  /* 色を明るく／暗くする */
  function shadeHex(hex, amt) {
    if (!hex || hex[0] !== '#') return hex;
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    return 'rgb(' + f((n >> 16) & 255) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
  }

  function windows(g, x, y, w, h, cols, rows, lit) {
    const mw = Math.max(4, (w - 8) / cols - 3), mh = Math.max(4, (h - 12) / rows - 3);
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++) {
      const wx = x + 5 + c * (mw + 3), wy = y - h + 9 + r * (mh + 3);
      g.fillStyle = 'rgba(50,36,20,.55)';                     // 窓枠
      g.fillRect(wx - 1, wy - 1, mw + 2, mh + 2);
      // 日が落ちていれば、どの窓にも明かりが入る。ところどころ消しておく
      const on = (lit || dusk) && ((c * 3 + r * 5) % 7) !== 0;
      g.fillStyle = on ? 'rgba(255,238,170,.95)'
                       : (dusk ? 'rgba(70,86,110,.85)' : 'rgba(150,200,230,.85)');
      g.fillRect(wx, wy, mw, mh);
      g.fillStyle = on ? 'rgba(255,252,225,.85)' : 'rgba(255,255,255,.30)';
      g.fillRect(wx, wy, mw, Math.max(1, mh * 0.3));          // ガラスの照り
      g.fillStyle = 'rgba(255,255,255,.22)';                  // 窓台
      g.fillRect(wx - 1, wy + mh + 1, mw + 2, 1);
    }
  }

  function sign(g, x, y, text, color) {
    g.font = 'bold 9px sans-serif'; g.textAlign = 'center';
    const w = g.measureText(text).width + 10;
    // 端の施設でも文字が切れないよう、看板を画面内に収める
    x = Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, x));
    g.fillStyle = '#3a2413'; g.fillRect(x - w / 2 - 1, y - 1, w + 2, 13);
    g.fillStyle = color; g.fillRect(x - w / 2, y, w, 11);
    g.fillStyle = '#fff8e3'; g.fillText(text, x, y + 8);
  }

  /* ---------- 各施設 ---------- */
  function drawFactory(g, p, lv, color) {
    const s = tierOf(lv);
    box(g, p.x, p.y, s.w, s.h, '#cdb894', color);
    windows(g, p.x, p.y, s.w, s.h, Math.min(5, 2 + s.t), Math.min(3, 1 + Math.floor(s.t / 2)), false);
    // 煙突（レベルが上がるほど増える）
    const stacks = Math.min(4, Math.floor(lv / 2.2));
    for (let i = 0; i < stacks; i++) {
      const cx = p.x + 10 + i * 12;
      g.fillStyle = '#8f7a5c'; g.fillRect(cx, p.y - s.h - 14, 6, 14);
      g.fillStyle = '#e8e0cc';
      g.fillRect(cx + 1, p.y - s.h - 20, 4, 4);
      g.fillRect(cx + 2, p.y - s.h - 25, 5, 4);
    }
    // シャッター
    g.fillStyle = '#6d7078'; g.fillRect(p.x + s.w * 0.32, p.y - 16, s.w * 0.36, 16);
    for (let yy = p.y - 15; yy < p.y; yy += 3) { g.fillStyle = '#878b94'; g.fillRect(p.x + s.w * 0.32, yy, s.w * 0.36, 1); }
    return { x: p.x - 2, y: p.y - s.h - 2, w: s.w + 4, h: s.h + 4 };
  }

  function drawTunnel(g, p, lv, color) {
    const s = tierOf(lv);
    box(g, p.x, p.y, s.w, s.h * 0.8, '#b8c4cc', color);
    // 送風管
    const r = 9 + lv * 1.1;
    g.fillStyle = '#3a2413';
    g.beginPath(); g.arc(p.x + s.w + r - 4, p.y - s.h * 0.45, r + 2, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#9aa6b0';
    g.beginPath(); g.arc(p.x + s.w + r - 4, p.y - s.h * 0.45, r, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#6b7680';
    g.beginPath(); g.arc(p.x + s.w + r - 4, p.y - s.h * 0.45, r * 0.5, 0, Math.PI * 2); g.fill();
    // ファンの羽根
    g.strokeStyle = '#dfe6ec'; g.lineWidth = 2;
    for (let a = 0; a < 4; a++) {
      const t = a * Math.PI / 2 + lv * 0.3;
      g.beginPath();
      g.moveTo(p.x + s.w + r - 4, p.y - s.h * 0.45);
      g.lineTo(p.x + s.w + r - 4 + Math.cos(t) * r * 0.8, p.y - s.h * 0.45 + Math.sin(t) * r * 0.8);
      g.stroke();
    }
    windows(g, p.x, p.y, s.w, s.h * 0.8, 3, 1, false);
    return { x: p.x - 2, y: p.y - s.h * 0.8 - 2, w: s.w + r * 2 + 4, h: s.h * 0.8 + 4 };
  }

  function drawSim(g, p, lv, color) {
    const s = tierOf(lv);
    box(g, p.x, p.y, s.w, s.h, '#c4c0d4', color);
    // ドーム屋根
    g.fillStyle = '#3a2413';
    g.beginPath(); g.ellipse(p.x + s.w / 2, p.y - s.h, s.w / 2 + 2, 12 + lv, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#8f88b8';
    g.beginPath(); g.ellipse(p.x + s.w / 2, p.y - s.h, s.w / 2, 10 + lv, 0, Math.PI, 0); g.fill();
    g.fillStyle = 'rgba(255,255,255,.35)';
    g.beginPath(); g.ellipse(p.x + s.w * 0.35, p.y - s.h - 3, s.w * 0.16, 4 + lv * 0.4, 0, Math.PI, 0); g.fill();
    // モニターの光
    windows(g, p.x, p.y, s.w, s.h, Math.min(4, 2 + s.t), 2, true);
    return { x: p.x - 2, y: p.y - s.h - 14 - lv, w: s.w + 4, h: s.h + 16 + lv };
  }

  function drawMarket(g, p, lv, color) {
    const s = tierOf(lv);
    const h = s.h * 1.15;
    box(g, p.x, p.y, s.w * 0.8, h, '#d8cbb0', color);
    windows(g, p.x, p.y, s.w * 0.8, h, 3, Math.min(4, 2 + s.t), true);
    // 看板（レベルで大きくなる）
    const bw = 20 + lv * 3.4, bh = 12 + lv * 1.6;
    g.fillStyle = '#3a2413'; g.fillRect(p.x - 2, p.y - h - bh - 8, bw + 4, bh + 4);
    g.fillStyle = color; g.fillRect(p.x, p.y - h - bh - 6, bw, bh);
    g.fillStyle = 'rgba(255,255,255,.7)';
    for (let i = 0; i < 3; i++) g.fillRect(p.x + 4, p.y - h - bh - 2 + i * 4, bw - 8, 2);
    g.fillStyle = '#8f7a5c';
    g.fillRect(p.x + 3, p.y - h - 8, 3, 8); g.fillRect(p.x + bw - 6, p.y - h - 8, 3, 8);
    return { x: p.x - 2, y: p.y - h - bh - 10, w: s.w * 0.8 + 4, h: h + bh + 12 };
  }

  function drawPit(g, p, lv, color) {
    const s = tierOf(lv);
    const bays = Math.min(3, 1 + Math.floor(lv / 4));
    const bw = 22, w = bays * bw + 8;
    box(g, p.x, p.y, w, s.h * 0.72, '#c8c2b4', color);
    for (let i = 0; i < bays; i++) {
      const bx = p.x + 4 + i * bw;
      g.fillStyle = '#5f636b'; g.fillRect(bx + 2, p.y - s.h * 0.62, bw - 6, s.h * 0.62);
      g.fillStyle = '#7c828c';
      for (let yy = 0; yy < s.h * 0.62; yy += 3) g.fillRect(bx + 2, p.y - s.h * 0.62 + yy, bw - 6, 1);
      g.fillStyle = color; g.fillRect(bx + 2, p.y - s.h * 0.62, bw - 6, 3);
    }
    return { x: p.x - 2, y: p.y - s.h * 0.72 - 2, w: w + 4, h: s.h * 0.72 + 4 };
  }

  function drawYouth(g, p, lv, color) {
    const s = tierOf(lv);
    const w = s.w * 0.82, h = s.h * 0.9;
    box(g, p.x, p.y, w, h, '#e0d0a8', color);
    windows(g, p.x, p.y, w, h, 3, Math.min(3, 1 + Math.floor(lv / 4)), true);
    // 時計塔（レベルで伸びる）
    const th = 8 + lv * 1.8;
    g.fillStyle = '#3a2413'; g.fillRect(p.x + w / 2 - 7, p.y - h - th - 2, 14, th + 2);
    g.fillStyle = '#d8c8a0'; g.fillRect(p.x + w / 2 - 6, p.y - h - th, 12, th);
    g.fillStyle = color; g.fillRect(p.x + w / 2 - 7, p.y - h - th - 4, 14, 4);
    g.fillStyle = '#fff8e3';
    g.beginPath(); g.arc(p.x + w / 2, p.y - h - th * 0.55, 4, 0, Math.PI * 2); g.fill();
    g.strokeStyle = '#3a2413'; g.lineWidth = 1;
    g.beginPath(); g.moveTo(p.x + w / 2, p.y - h - th * 0.55);
    g.lineTo(p.x + w / 2 + 2, p.y - h - th * 0.55 - 2); g.stroke();
    // 練習用カート（在籍する若手のぶん）
    const karts = Math.min(4, 1 + Math.floor(lv / 3));
    for (let i = 0; i < karts; i++) {
      const kx = p.x + 2 + i * 12, ky = p.y + 14;
      g.fillStyle = '#3a2413'; g.fillRect(kx - 1, ky - 1, 10, 7);
      g.fillStyle = ['#e04a3f', '#3a7ad9', '#4ea63f', '#f0a020'][i % 4];
      g.fillRect(kx, ky, 8, 5);
      g.fillStyle = '#1a1a1a'; g.fillRect(kx, ky + 4, 2, 2); g.fillRect(kx + 6, ky + 4, 2, 2);
    }
    return { x: p.x - 2, y: p.y - h - th - 6, w: w + 4, h: h + th + 8 };
  }

  const DRAW = { factory: drawFactory, tunnel: drawTunnel, sim: drawSim,
                 market: drawMarket, pit: drawPit, youth: drawYouth };

  /* ---------- 賑わい（ファン数・タイトル）---------- */
  function drawCrowd(g, fans, titles, color, rnd) {
    // 来場者
    const people = Math.min(46, Math.floor(Math.log10(Math.max(10, fans)) * 12) - 8);
    for (let i = 0; i < people; i++) {
      const x = 20 + rnd() * (W - 40), y = 262 + rnd() * 62;
      g.fillStyle = ['#e04a3f', '#3a7ad9', '#4ea63f', '#f0a020', '#b06fd0'][Math.floor(rnd() * 5)];
      g.fillRect(x, y, 3, 4);
      g.fillStyle = '#f2c9a0'; g.fillRect(x, y - 3, 3, 3);
    }
    // 駐車場の車
    const cars = Math.min(10, Math.floor(fans / 2500));
    for (let i = 0; i < cars; i++) {
      const x = 24 + (i % 5) * 24, y = 292 + Math.floor(i / 5) * 16;
      g.fillStyle = '#3a2413'; g.fillRect(x - 1, y - 1, 18, 10);
      g.fillStyle = ['#c85040', '#4070c0', '#50a050', '#d0a030'][i % 4];
      g.fillRect(x, y, 16, 8);
      g.fillStyle = '#bcd8e8'; g.fillRect(x + 4, y + 1, 8, 3);
    }
    // トロフィー像
    for (let i = 0; i < Math.min(6, titles); i++) {
      const x = 320 + i * 24, y = 320;
      g.fillStyle = '#8f7a5c'; g.fillRect(x, y, 12, 8);
      g.fillStyle = '#f0c040'; g.fillRect(x + 3, y - 10, 6, 10);
      g.fillRect(x + 1, y - 13, 10, 3);
      g.fillStyle = '#fff0a0'; g.fillRect(x + 4, y - 9, 2, 7);
    }
  }

  /* ---------- 全体 ---------- */
  function layer() {
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    return { c: c, g: g };
  }

  /* ---------- 背景のキャッシュ ----------
     人が歩くと毎フレーム描き直すことになるが、背景は変わらない。
     一度描いたものを取っておき、キャラだけを上に重ねる。            */
  let cache = null, cacheKey = '';

  function keyOf(g2, sel) {
    return [document.body.getAttribute('data-skin'), sel || '', g2.offseason ? 'off' : '',
            Math.floor(g2.fans), g2.season, g2.titles.teams, g2.titles.drivers, g2.color,
            PLOTS.map(p => g2.facilities[p.key]).join('-')].join('|');
  }

  /* 背景（キャラなし）を得る。中身が変わっていなければ作り直さない */
  function scene(g2, sel) {
    const k = keyOf(g2, sel);
    if (cache && cacheKey === k) return cache;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    render(c, g2, sel);
    cache = c; cacheKey = k;
    return cache;
  }

  function invalidate() { cache = null; cacheKey = ''; }

  /* 背景＋歩いている人を、表の画面へ描く */
  function drawWith(cv, g2, sel, actor) {
    const out = cv.getContext('2d');
    out.imageSmoothingEnabled = false;
    out.setTransform(1, 0, 0, 1, 0, 0);
    out.clearRect(0, 0, W, H);
    out.drawImage(scene(g2, sel), 0, 0);
    if (actor) drawActor(out, actor);
  }

  function render(cv, g2, sel) {
    dusk = document.body.getAttribute('data-skin') === 'hd';
    off = !!g2.offseason;
    const out = cv.getContext('2d');
    out.imageSmoothingEnabled = false;
    // 夕景では、いったん裏画面に描いてから光と色を乗せる
    if (dusk) GP.fx.init(W, H);
    const ctx = dusk ? GP.fx.begin() : out;
    ctx.imageSmoothingEnabled = false;
    hitBoxes = [];
    const D = GP.data;
    const rnd = seeded(Math.floor(g2.fans) + g2.season * 7 + g2.titles.teams * 13);

    // 芝（夕景では日が落ちた色にする）
    ctx.fillStyle = dusk ? '#2f4a2a' : '#8fbf62'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = dusk ? '#2a4325' : '#86b658';
    for (let y = 0; y < H; y += 8) for (let x = (y % 16 ? 0 : 4); x < W; x += 16) ctx.fillRect(x, y, 4, 4);
    // 奥の木立。幹・輪郭・本体・光の葉 の4層で、遠景でも立体に見せる
    for (let x = 4; x < W; x += 19) {
      const ty = 74 + Math.floor(rnd() * 12);
      const sc = 0.8 + rnd() * 0.55;
      const cw = Math.round(8 * sc), ch = Math.round(12 * sc);
      ctx.fillStyle = '#3a2712'; ctx.fillRect(x + 6, ty - 6, 3, 7);          // 幹
      ctx.fillStyle = '#5c421f'; ctx.fillRect(x + 6, ty - 6, 1.5, 7);
      const c0 = dusk ? '#0d2412' : '#173a1a';
      const c1 = dusk ? '#173a1e' : '#256026';
      const c2 = dusk ? '#1f4d27' : '#347a33';
      const c3 = dusk ? '#2a6033' : '#4e9b46';
      ctx.fillStyle = c0;                                                    // 輪郭
      ctx.fillRect(x + 7 - cw, ty - 5 - ch, cw * 2, ch);
      ctx.fillRect(x + 7 - cw * 0.6, ty - 8 - ch, cw * 1.2, 4);
      ctx.fillStyle = c1;                                                    // 本体
      ctx.fillRect(x + 8 - cw, ty - 4 - ch, cw * 2 - 2, ch - 1);
      ctx.fillRect(x + 8 - cw * 0.6, ty - 7 - ch, cw * 1.1, 3.5);
      ctx.fillStyle = c2;                                                    // 中間
      ctx.fillRect(x + 8 - cw, ty - 3.5 - ch, cw * 1.1, ch * 0.5);
      ctx.fillStyle = c3;                                                    // 光の葉
      ctx.fillRect(x + 8.5 - cw, ty - 3 - ch, cw * 0.6, ch * 0.28);
      ctx.fillRect(x + 8 - cw * 0.5, ty - 6.5 - ch, cw * 0.5, 2.4);
    }
    // 敷地の舗装（建物が建つ面）
    ctx.fillStyle = dusk ? '#4a4450' : '#b8b0a0'; ctx.fillRect(10, 108, W - 20, H - 128);
    ctx.fillStyle = dusk ? '#524b58' : '#c4bcac';
    for (let x = 10; x < W - 10; x += 24) ctx.fillRect(x, 108, 22, H - 128);
    ctx.fillStyle = dusk ? '#3c3742' : '#a89e8c'; ctx.fillRect(10, 108, W - 20, 3);
    // 引き込み路
    ctx.fillStyle = dusk ? '#2f313a' : '#6d7078'; ctx.fillRect(W / 2 - 22, 252, 44, H - 252);
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for (let y = 262; y < H; y += 16) ctx.fillRect(W / 2 - 2, y, 4, 8);

    // ---- 手前の敷地 ----
    // ここをキャラが歩くので、生活感のあるものを置いて「場所」らしくする。
    // 建物の当たり判定とは無関係なので、通り抜けられる（歩行の邪魔をしない）。
    const yardLine = dusk ? 'rgba(230,224,200,.22)' : 'rgba(255,255,255,.40)';
    ctx.fillStyle = yardLine;                                   // 駐車枠の白線
    for (let x = 30; x < W / 2 - 40; x += 34) ctx.fillRect(x, 286, 2, 30);
    ctx.fillRect(30, 286, W / 2 - 70 - 30, 2);
    for (let x = W / 2 + 40; x < W - 30; x += 34) ctx.fillRect(x, 286, 2, 30);
    ctx.fillRect(W / 2 + 40, 286, W - 30 - (W / 2 + 40), 2);

    // タイヤの山（積み上げ）
    const tyreStack = (tx, ty, n) => {
      for (let i = 0; i < n; i++) {
        const yy = ty - i * 5;
        ctx.fillStyle = '#15161a'; ctx.fillRect(tx - 8, yy - 5, 16, 6);
        ctx.fillStyle = i % 2 ? '#2a2c33' : '#22242a'; ctx.fillRect(tx - 8, yy - 5, 16, 2);
      }
      ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(tx - 8, ty - n * 5 - 5, 16, 1);
    };
    tyreStack(64, 316, 4); tyreStack(86, 316, 3);
    tyreStack(W - 70, 316, 3);

    // 資材のコンテナ（チームカラー）
    const crate = (cx, cy, cw, ch2, c) => {
      ctx.fillStyle = '#2a2015'; ctx.fillRect(cx - 1, cy - ch2 - 1, cw + 2, ch2 + 2);
      ctx.fillStyle = c; ctx.fillRect(cx, cy - ch2, cw, ch2);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(cx, cy - ch2, cw, 2);
      ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(cx, cy - 3, cw, 3);
    };
    crate(150, 318, 22, 13, g2.color);
    crate(178, 318, 16, 10, "#6a7078");
    crate(W - 150, 318, 20, 12, '#6a7078');

    // 車止めのポール
    ctx.fillStyle = dusk ? '#4a4450' : '#8a8578';
    for (let x = 40; x < W - 30; x += 58) { ctx.fillRect(x, 278, 3, 7); }
    // フェンス（敷地の奥側）
    ctx.fillStyle = '#7a6a52';
    for (let x = 10; x < W - 8; x += 10) ctx.fillRect(x, 100, 3, 10);
    ctx.fillRect(10, 100, W - 20, 3);

    // 建物より手前は別レイヤーに描く。シルエットから影を作りたいので
    const bl = dusk ? layer() : null;
    const bg = bl ? bl.g : ctx;

    // 建物（奥から手前へ）
    const signs = [];
    PLOTS.forEach(p => {
      const lv = g2.facilities[p.key] || 1;
      const bb = DRAW[p.key](bg, p, lv, g2.color);
      hitBoxes.push({ key: p.key, x: bb.x, y: bb.y, w: bb.w, h: bb.h });
      if (sel === p.key) {
        bg.strokeStyle = '#fff34d'; bg.lineWidth = 3;
        bg.setLineDash([5, 4]);
        bg.strokeRect(bb.x - 3, bb.y - 3, bb.w + 6, bb.h + 6);
        bg.setLineDash([]);
      }
      // 看板は建物の上に出す（手前はキャラが歩くので空けておく）。
      // 隣同士でぶつからないよう、一段ずつ高さをずらす。
      signs.push({ x: p.x + bb.w / 2 - 2, y: Math.max(2, bb.y - 15 - (signs.length % 2) * 13),
                   text: p.label + ' Lv.' + lv, sel: sel === p.key });
    });
    signs.forEach(sg => sign(bg, sg.x, sg.y, sg.text, sg.sel ? '#e04a3f' : '#4a2f1a'));

    drawCrowd(bg, g2.fans, g2.titles.teams + g2.titles.drivers, g2.color, rnd);

    // チーム旗
    bg.fillStyle = '#7a6a52'; bg.fillRect(24, 116, 3, 54);
    bg.fillStyle = g2.color; bg.fillRect(27, 116, 26, 16);
    bg.fillStyle = 'rgba(255,255,255,.55)'; bg.fillRect(29, 119, 22, 3);

    /* ---- オフ期間 ----
       建物は閉まっていて、人が敷地に出ている。歩いて話しかけて回る。 */
    if (off) {
      // オフ期間は建物に入れないので、建物の当たり判定は捨てて人に差し替える
      hitBoxes = [];
      const py = WALK.y1 - 4;
      const stand = (x, suit, hair, faceC, hat) => {
        bg.fillStyle = 'rgba(0,0,0,.30)';
        bg.beginPath(); bg.ellipse(x, py, 7, 2.6, 0, 0, Math.PI * 2); bg.fill();
        bg.fillStyle = shadeHex(suit, -0.20); bg.fillRect(x - 5, py - 21, 10, 21);
        bg.fillStyle = suit;                  bg.fillRect(x - 5, py - 21, 10, 8);
        bg.fillStyle = 'rgba(255,255,255,.24)'; bg.fillRect(x - 5, py - 21, 10, 2);
        bg.fillStyle = '#2c3140'; bg.fillRect(x - 5, py - 9, 4, 9);
        bg.fillRect(x + 1, py - 9, 4, 9);
        bg.fillStyle = faceC; bg.fillRect(x - 4, py - 29, 8, 8);
        bg.fillStyle = hair;  bg.fillRect(x - 4, py - 30, 8, 4);
        bg.fillStyle = '#2a2028'; bg.fillRect(x - 3, py - 26, 2, 2);
        bg.fillRect(x + 1, py - 26, 2, 2);
        if (hat) { bg.fillStyle = hat; bg.fillRect(x - 5, py - 31, 10, 3); }
      };
      const names = [];
      const box = (i) => hitBoxes.push({ key: OFF_SPOTS[i].key,
        x: OFF_SPOTS[i].x - 14, y: py - 34, w: 28, h: 36 });
      (g2.drivers || []).slice(0, 2).forEach((d, i) => {
        stand(OFF_SPOTS[i].x, g2.color, '#3a2718', '#f0c49a', null);
        names.push([OFF_SPOTS[i].x, d.name]);
        box(i);
      });
      stand(OFF_SPOTS[2].x, '#5a6270', '#2b1d12', '#e8bd94', null);           // スタッフ
      names.push([OFF_SPOTS[2].x, 'スタッフのみんな']); box(2);
      stand(OFF_SPOTS[3].x, '#3f8a4a', '#4a3018', '#f2cba4', '#e8c24a');      // ユース
      names.push([OFF_SPOTS[3].x, '下部組織の若手']); box(3);
      stand(OFF_SPOTS[4].x, '#3a3f52', '#241c14', '#e2b48e', null);           // 首脳陣
      names.push([OFF_SPOTS[4].x, '首脳陣']); box(4);

      // 来季への出発地点
      const nx = OFF_SPOTS[5].x;
      bg.fillStyle = '#241a10'; bg.fillRect(nx - 24, py - 62, 48, 14);
      bg.fillStyle = dusk ? '#5c4a24' : '#e8dcc0'; bg.fillRect(nx - 23, py - 61, 46, 12);
      bg.font = 'bold 9px sans-serif'; bg.textAlign = 'center';
      bg.fillStyle = dusk ? '#ffe9b0' : '#3a2f1a';
      bg.fillText('NEXT SEASON', nx, py - 52);
      bg.fillStyle = '#8d8578'; bg.fillRect(nx - 22, py - 48, 3, 48);
      bg.fillRect(nx + 19, py - 48, 3, 48);
      bg.fillStyle = 'rgba(255,255,255,.40)';
      for (let k = 0; k < 3; k++) bg.fillRect(nx - 8, py - 30 + k * 9, 16, 3);
      names.push([nx, '来季へ']);
      hitBoxes.push({ key: OFF_SPOTS[5].key, x: nx - 26, y: py - 64, w: 52, h: 66 });

      // 名札
      names.forEach((n, i) => sign(bg, n[0], py - 44 - (i % 2) * 12, n[1],
        sel === OFF_SPOTS[i].key ? '#e04a3f' : '#3f3a30'));

      // 祝いの垂れ幕
      bg.fillStyle = '#241a10'; bg.fillRect(140, 118, 320, 18);
      bg.fillStyle = g2.color;  bg.fillRect(142, 120, 316, 14);
      bg.fillStyle = 'rgba(255,255,255,.30)'; bg.fillRect(142, 120, 316, 3);
      bg.font = 'bold 11px sans-serif'; bg.textAlign = 'center';
      bg.fillStyle = '#fff8e3';
      bg.fillText('シーズン ' + g2.season + ' おつかれさま！', 300, 131);
    }

    if (!dusk) return;

    // 建物の落ち影。同じ絵を黒くして、光の向きへずらして重ねる
    if (GP.fx.supportsBlur()) {
      const sil = layer();
      sil.g.filter = 'brightness(0)';
      sil.g.drawImage(bl.c, 0, 0);
      sil.g.filter = 'none';
      ctx.save();
      ctx.globalAlpha = 0.11;
      for (let k = 1; k <= 7; k++) ctx.drawImage(sil.c, k * 2.8, k * 1.1);
      ctx.restore();
    }
    ctx.drawImage(bl.c, 0, 0);

    // 夕暮れの空気。地平線あたりに橙、手前に紫を落とす
    const air = ctx.createLinearGradient(0, 60, 0, H);
    air.addColorStop(0, 'rgba(255,168,86,.22)');
    air.addColorStop(0.45, 'rgba(150,110,190,.10)');
    air.addColorStop(1, 'rgba(40,26,64,.30)');
    ctx.fillStyle = air; ctx.fillRect(0, 0, W, H);

    GP.fx.composite(out, { dof: 0, bloom: 1.0, warm: 1.0, vignette: 1.0, night: true });
  }

  function hit(x, y) {
    for (let i = hitBoxes.length - 1; i >= 0; i--) {
      const b = hitBoxes[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.key;
    }
    return null;
  }

  /* チームの規模（施設・ファン・タイトルの総合）*/
  function scale(g2) {
    const fac = GP.data.FACILITIES.reduce((a, f) => a + (g2.facilities[f.key] || 1), 0);
    const fanPt = Math.max(0, (Math.log10(Math.max(10, g2.fans)) - 2.4) * 12);
    // タイトルは効くが、積み上げるだけで頂点に届かないよう頭打ちにする
    const t = Math.min(40, (g2.titles.teams + g2.titles.drivers) * 5);
    const v = fac + fanPt + t;
    const RANKS = [
      [14, 'ガレージチーム'], [28, '弱小プライベーター'], [44, '中堅コンストラクター'],
      [62, '有力チーム'], [82, 'トップチーム'], [104, '強豪ワークス'], [9999, '伝説のチーム']
    ];
    const r = RANKS.find(x => v < x[0]);
    return { value: Math.round(v), rank: r ? r[1] : '伝説のチーム' };
  }

  return { render, scene, drawWith, invalidate, hit, scale,
           drawActor, doorOf, doorPos, clampWalk, WALK, W, H };
})();

</script>
<script>
/* ===== src/paddock.js ===== */
/* =========================================================
   レースウィークのパドック
   本拠地と同じ「歩いて入る」仕組みで、
   ガレージ・ドライバーの控え・タイミングブース・コースへの出口を回る。
   絵の作りは本拠地と揃えてあるが、こちらはサーキットの裏側。
   ========================================================= */
window.GP = window.GP || {};

GP.paddock = (function () {
  'use strict';

  const W = 600, H = 340;

  /* 歩ける範囲。ガレージの手前の通路を左右に移動する */
  const WALK = { x0: 20, x1: W - 20, y0: 264, y1: 320 };

  /* ガレージの並び。i=4 が自チーム */
  const GW = 52, GSTEP = 53, MINE_AT = 4;
  const garageX = i => 4 + i * GSTEP + GW / 2;

  /* 通路側で立ち寄れる場所。x は入口の中心 */
  const SPOTS = [
    { key: 'drivers', x: 92,  label: 'ドライバーの控え' },
    { key: 'timing',  x: 400, label: 'タイミングブース' },
    { key: 'gate',    x: 530, label: 'コースへの出口' }
  ];

  /* パドックにいる人。通路側に立っていて、話しかけられる */
  const PEOPLE = [
    { key: 'drv0',  x: 168, label: '' },   // 自チームのドライバー1
    { key: 'drv1',  x: 200, label: '' },   // 自チームのドライバー2
    { key: 'press', x: 320, label: '記者たち' }
  ];

  /* ライバルのドライバーが立っている場所。毎戦ちがう顔ぶれが来る */
  const VISIT = [
    { key: 'poach0', x: 252 },
    { key: 'poach1', x: 372 },
    { key: 'poach2', x: 462 }
  ];

  /* この週にパドックへ来ているライバルのドライバー（3人）
     一度でも接触した相手は来続ける。そうでないと心証を積み上げられない。
     残りの枠は、毎戦ちがう顔ぶれで埋める。                          */
  function visitors(g2) {
    const rv = g2.rivals || [];
    if (!rv.length) return [];
    const picked = [];
    const seen = {};
    const add = (t, d) => {
      if (!t || !d || seen[d.name] || picked.length >= VISIT.length) return;
      seen[d.name] = 1;
      picked.push({ team: t, driver: d });
    };
    // 話をした相手を優先して呼ぶ
    rv.forEach(t => (t.drivers || []).forEach(d => { if (d.interest > 0) add(t, d); }));
    // 残りは毎戦入れ替わる
    const base = (g2.nextRace || 0) * 2;
    for (let k = 0; k < rv.length * 2 && picked.length < VISIT.length; k++) {
      const t = rv[(base + k) % rv.length];
      if (!t || !t.drivers || !t.drivers.length) continue;
      add(t, t.drivers[(base + k) % t.drivers.length]);
    }
    return picked.map((v, i) => ({ spot: VISIT[i], team: v.team, driver: v.driver }));
  }

  /* ガレージ寄りに立っているか（上半分）。ここでは建物を相手にする */
  const NEAR_GARAGE = y => y < WALK.y0 + 26;

  let hitBoxes = [];
  let dusk = false;

  function seeded(n) {
    let h = (n * 2654435761) >>> 0;
    return function () { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  }

  function mix(hex, amt) {
    if (!hex || hex[0] !== '#') return hex;
    const n = parseInt(hex.slice(1), 16);
    const c = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
  }

  function mixDark(hex) { return mix(hex, -0.20); }

  /* いま立っている場所から手が届く相手を返す。
     ガレージ寄りならガレージ（自チーム＝入る／他チーム＝覗く）、
     通路側なら人やブースが相手になる。                          */
  function doorOf(x, y, g2) {
    const near = NEAR_GARAGE(y == null ? WALK.y0 : y);
    const cands = [];
    if (near) {
      for (let i = 0; i < 11; i++) {
        cands.push({ key: i === MINE_AT ? 'garage' : ('scout' + i), x: garageX(i) });
      }
    } else {
      SPOTS.forEach(s => cands.push({ key: s.key, x: s.x }));
      PEOPLE.forEach(s => cands.push({ key: s.key, x: s.x }));
      VISIT.forEach(s => cands.push({ key: s.key, x: s.x }));
    }
    let best = null, bd = 1e9;
    cands.forEach(c => {
      const d = Math.abs(x - c.x);
      if (d < 24 && d < bd) { bd = d; best = c; }
    });
    return best;
  }

  function doorPos(key) {
    if (key === 'garage') return { x: garageX(MINE_AT), y: WALK.y0 + 6 };
    if (/^scout(\d+)$/.test(key)) return { x: garageX(parseInt(RegExp.$1, 10)), y: WALK.y0 + 6 };
    const s = SPOTS.concat(PEOPLE).concat(VISIT).find(q => q.key === key);
    return s ? { x: s.x, y: WALK.y0 + 40 } : null;
  }

  function clampWalk(x, y) {
    return { x: Math.max(WALK.x0, Math.min(WALK.x1, x)),
             y: Math.max(WALK.y0, Math.min(WALK.y1, y)) };
  }

  function hit(x, y) {
    for (let i = hitBoxes.length - 1; i >= 0; i--) {
      const b = hitBoxes[i];
      if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return b.key;
    }
    return null;
  }

  /* ---------- 部品 ---------- */
  function sign(g, x, y, text, color) {
    g.font = 'bold 9px sans-serif'; g.textAlign = 'center';
    const w = g.measureText(text).width + 10;
    x = Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, x));
    g.fillStyle = '#241a10'; g.fillRect(x - w / 2 - 1, y - 1, w + 2, 13);
    g.fillStyle = color; g.fillRect(x - w / 2, y, w, 11);
    g.fillStyle = '#fff8e3'; g.fillText(text, x, y + 8);
  }

  /* ---------- 全体 ---------- */
  function render(cv, g2, sel) {
    dusk = document.body.getAttribute('data-skin') === 'hd';
    const out = cv.getContext('2d');
    out.imageSmoothingEnabled = false;
    if (dusk) GP.fx.init(W, H);
    const ctx = dusk ? GP.fx.begin() : out;
    ctx.imageSmoothingEnabled = false;
    hitBoxes = [];
    const rnd = seeded(Math.floor(g2.fans) + g2.season * 11 + g2.nextRace * 7);
    // 名前と色しか使わないので、allTeams（コースが要る）は呼ばない。
    // 自チームのガレージは真ん中あたりに固定して、入口の位置を一定にする。
    const rivals = (g2.rivals || []).map(r => ({ name: r.name, color: r.color }));
    const scouted = g2.scouted || [];
    const teams = [];
    for (let i = 0, k = 0; i < 11; i++) {
      if (i === MINE_AT) teams.push({ name: g2.team, color: g2.color, mine: true });
      else teams.push(rivals[k++] || { name: '', color: '#8a8578' });
    }

    /* ---- 奥：コース ---- */
    ctx.fillStyle = dusk ? '#242830' : '#4c5057'; ctx.fillRect(0, 0, W, 62);
    ctx.fillStyle = dusk ? '#2b303a' : '#585d66'; ctx.fillRect(0, 0, W, 4);
    ctx.fillStyle = 'rgba(255,255,255,.30)';                       // コース脇の白線
    ctx.fillRect(0, 52, W, 2);
    ctx.fillStyle = 'rgba(255,255,255,.22)';                       // 中央の破線
    for (let x = 0; x < W; x += 26) ctx.fillRect(x, 28, 14, 2);
    // 路面の粒
    for (let i = 0; i < 420; i++) {
      const x = rnd() * W, y = rnd() * 60;
      ctx.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.07)';
      ctx.fillRect(x, y, 2, 2);
    }

    /* ---- ピットウォール ---- */
    ctx.fillStyle = dusk ? '#3a3540' : '#8d8578'; ctx.fillRect(0, 62, W, 14);
    ctx.fillStyle = dusk ? '#4a4450' : '#a8a094'; ctx.fillRect(0, 62, W, 4);
    // 壁のスポンサーボード（チームカラーで賑やかす）
    for (let x = 6, i = 0; x < W - 20; x += 44, i++) {
      const t = teams[i % Math.max(1, teams.length)];
      ctx.fillStyle = t ? t.color : '#c0c0c8';
      ctx.fillRect(x, 65, 36, 8);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x, 65, 36, 2);
    }

    /* ---- ピットレーン ---- */
    ctx.fillStyle = dusk ? '#2f333c' : '#6d7078'; ctx.fillRect(0, 76, W, 52);
    ctx.fillStyle = 'rgba(255,255,255,.34)'; ctx.fillRect(0, 78, W, 2);      // 外側の白線
    ctx.fillRect(0, 124, W, 2);                                              // 内側の白線
    ctx.fillStyle = 'rgba(255,255,255,.20)';
    for (let x = 0; x < W; x += 18) ctx.fillRect(x, 100, 9, 1.5);            // 中央の破線
    for (let i = 0; i < 320; i++) {
      const x = rnd() * W, y = 78 + rnd() * 48;
      ctx.fillStyle = rnd() > 0.5 ? 'rgba(255,255,255,.05)' : 'rgba(0,0,0,.07)';
      ctx.fillRect(x, y, 2, 2);
    }

    /* ---- ガレージ（チームごとに1つ並ぶ）---- */
    const gw = GW, gy = 246;
    for (let i = 0; i < 11; i++) {
      const gx = 4 + i * GSTEP;
      const t = teams[i];
      const mine = !!(t && t.mine);
      const wall = dusk ? '#2f2b38' : '#b8b2a4';
      // 本体
      ctx.fillStyle = '#241a10'; ctx.fillRect(gx - 1, 128 - 1, gw + 2, gy - 128 + 2);
      ctx.fillStyle = wall; ctx.fillRect(gx, 128, gw, gy - 128);
      ctx.fillStyle = 'rgba(255,246,220,.14)'; ctx.fillRect(gx, 128, gw * 0.3, gy - 128);
      ctx.fillStyle = 'rgba(40,24,10,.20)'; ctx.fillRect(gx + gw * 0.76, 128, gw * 0.24, gy - 128);
      // 屋根の帯（チームカラー）
      ctx.fillStyle = t ? t.color : '#8a8578'; ctx.fillRect(gx, 128, gw, 12);
      ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fillRect(gx, 128, gw, 3);
      // シャッター（自チームだけ開いていて、中が見える）
      const sx = gx + 7, sw = gw - 14;
      ctx.fillStyle = '#2a2d34'; ctx.fillRect(sx - 1, 152, sw + 2, gy - 156);
      if (mine) {
        ctx.fillStyle = dusk ? '#514634' : '#7c7462';                        // ガレージの中
        ctx.fillRect(sx, 156, sw, gy - 162);
        ctx.fillStyle = 'rgba(255,236,180,.42)';                             // 天井の照明
        ctx.fillRect(sx, 156, sw, 8);
        ctx.fillStyle = 'rgba(255,236,180,.16)';
        ctx.fillRect(sx, 164, sw, gy - 170);
        // 整備中のマシン（上から見た形を簡略化）
        ctx.fillStyle = mix(t.color, -0.18); ctx.fillRect(sx + 7, 196, sw - 14, 26);
        ctx.fillStyle = t.color; ctx.fillRect(sx + 9, 196, sw - 18, 26);
        ctx.fillStyle = '#17181c';
        ctx.fillRect(sx + 3, 200, 5, 8); ctx.fillRect(sx + sw - 8, 200, 5, 8);
        ctx.fillRect(sx + 3, 214, 5, 8); ctx.fillRect(sx + sw - 8, 214, 5, 8);
        ctx.fillStyle = '#2b2e36'; ctx.fillRect(sx + 5, 192, sw - 10, 3);    // フロントウイング
        ctx.fillRect(sx + 6, 224, sw - 12, 3);                               // リアウイング
      } else {
        ctx.fillStyle = dusk ? '#3a3f4a' : '#9aa0a8';                        // 閉じたシャッター
        ctx.fillRect(sx, 156, sw, gy - 162);
        ctx.fillStyle = 'rgba(0,0,0,.16)';
        for (let yy = 158; yy < gy - 8; yy += 4) ctx.fillRect(sx, yy, sw, 1.5);
      }
      // チーム名の板。屋根帯の下に敷いて読めるようにする
      if (t && t.name) {
        ctx.fillStyle = 'rgba(20,14,8,.62)';
        ctx.fillRect(gx + 3, 141, gw - 6, 11);
        ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = mine ? '#ffe9b0' : '#e2dccc';
        ctx.fillText(t.name.slice(0, 5), gx + gw / 2, 149.5);
      }

      // ガレージ前の機材と人。並びが単調にならないよう、区画ごとに変える
      const r2 = seeded(i * 977 + 31);
      if (r2() < 0.75) {                                   // 積んだタイヤ
        const tx = gx + 8 + r2() * (gw - 20);
        for (let k = 0; k < 2 + Math.floor(r2() * 2); k++) {
          ctx.fillStyle = '#15161a'; ctx.fillRect(tx, gy - 8 - k * 4, 13, 5);
          ctx.fillStyle = k % 2 ? '#2a2c33' : '#22242a'; ctx.fillRect(tx, gy - 8 - k * 4, 13, 1.6);
        }
      }
      if (r2() < 0.6) {                                    // 工具箱
        const bx2 = gx + 6 + r2() * (gw - 22);
        ctx.fillStyle = '#241a10'; ctx.fillRect(bx2 - 1, gy - 12, 13, 10);
        ctx.fillStyle = t ? t.color : '#7a8088'; ctx.fillRect(bx2, gy - 11, 11, 8);
        ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fillRect(bx2, gy - 11, 11, 2);
      }
      if (r2() < 0.7) {                                    // 立っているクルー
        const cx2 = gx + 10 + r2() * (gw - 24), cy2 = gy - 4;
        const cc = t ? t.color : '#7a8088';
        ctx.fillStyle = 'rgba(0,0,0,.26)'; ctx.fillRect(cx2 - 3, cy2 + 1, 6, 2);
        ctx.fillStyle = mixDark(cc); ctx.fillRect(cx2 - 3, cy2 - 8, 6, 8);
        ctx.fillStyle = cc; ctx.fillRect(cx2 - 3, cy2 - 8, 6, 3.5);
        ctx.fillStyle = '#e8b98e'; ctx.fillRect(cx2 - 2.4, cy2 - 12, 5, 4);   // 顔
        ctx.fillStyle = '#3a2718'; ctx.fillRect(cx2 - 2.4, cy2 - 12.6, 5, 2); // 髪
      }
      if (mine) {
        hitBoxes.push({ key: 'garage', x: gx - 2, y: 126, w: gw + 4, h: gy - 124 });
      } else {
        hitBoxes.push({ key: 'scout' + i, x: gx - 2, y: 126, w: gw + 4, h: gy - 124 });
        // すでに覗いたガレージには印を出す（同じ週に何度も稼げないので）
        if (scouted.indexOf(t && t.name) >= 0) {
          ctx.fillStyle = 'rgba(20,14,8,.55)';
          ctx.fillRect(gx + gw / 2 - 11, 156, 22, 16);
          ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
          ctx.fillStyle = '#8fe08a';
          ctx.fillText('✓', gx + gw / 2, 168);
        }
      }
    }

    /* ---- 手前：パドックの通路 ---- */
    ctx.fillStyle = dusk ? '#3e3948' : '#a8a294'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = dusk ? '#443f50' : '#b2ac9e';
    for (let x = 0; x < W; x += 26) ctx.fillRect(x, gy, 24, H - gy);
    ctx.fillStyle = 'rgba(40,24,10,.28)'; ctx.fillRect(0, gy, W, 3);

    /* ---- ドライバーの控え（モーターホーム）---- */
    (function () {
      const x = 58, y = 262, w = 70, h = 42;
      ctx.fillStyle = '#241a10'; ctx.fillRect(x - 1, y - h - 1, w + 2, h + 2);
      ctx.fillStyle = dusk ? '#3a3646' : '#e4dccc'; ctx.fillRect(x, y - h, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(x, y - h, w * 0.3, h);
      ctx.fillStyle = g2.color; ctx.fillRect(x, y - h, w, 9);
      ctx.fillStyle = 'rgba(255,255,255,.30)'; ctx.fillRect(x, y - h, w, 2.5);
      for (let a = 5; a < w - 8; a += 15) {                                  // 窓
        ctx.fillStyle = 'rgba(50,36,20,.5)'; ctx.fillRect(x + a - 1, y - h + 13, 11, 11);
        ctx.fillStyle = dusk ? 'rgba(255,238,170,.9)' : 'rgba(150,200,230,.85)';
        ctx.fillRect(x + a, y - h + 14, 9, 9);
        ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + a, y - h + 14, 9, 3);
      }
      ctx.fillStyle = '#5c5548'; ctx.fillRect(x + w - 18, y - 16, 12, 16);   // 入口
      ctx.fillStyle = '#7a7264'; ctx.fillRect(x + w - 18, y - 16, 12, 2);
      hitBoxes.push({ key: 'drivers', x: x - 2, y: y - h - 2, w: w + 4, h: h + 4 });
    })();

    /* ---- タイミングブース ---- */
    (function () {
      const x = 376, y = 258, w = 48, h = 34;
      ctx.fillStyle = '#241a10'; ctx.fillRect(x - 1, y - h - 1, w + 2, h + 2);
      ctx.fillStyle = dusk ? '#2e3a44' : '#9ab0bc'; ctx.fillRect(x, y - h, w, h);
      ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(x, y - h, w * 0.3, h);
      ctx.fillStyle = '#3a4650'; ctx.fillRect(x, y - h, w, 8);
      // モニター（順位表が流れている）
      ctx.fillStyle = '#12161c'; ctx.fillRect(x + 5, y - h + 12, w - 10, 16);
      for (let r = 0; r < 4; r++) {
        ctx.fillStyle = r === 0 ? '#ffd24a' : 'rgba(120,220,255,.75)';
        ctx.fillRect(x + 7, y - h + 14 + r * 4, 6 + (r * 7) % 18, 2);
      }
      hitBoxes.push({ key: 'timing', x: x - 2, y: y - h - 2, w: w + 4, h: h + 4 });
    })();

    /* ---- コースへの出口 ---- */
    (function () {
      const x = 512, y = 254;
      ctx.fillStyle = '#241a10'; ctx.fillRect(x - 1, y - 44 - 1, 5, 46);
      ctx.fillStyle = '#8d8578'; ctx.fillRect(x, y - 44, 3, 44);            // 支柱
      ctx.fillRect(x + 34, y - 44, 3, 44);
      ctx.fillStyle = '#241a10'; ctx.fillRect(x - 2, y - 48, 41, 12);
      ctx.fillStyle = dusk ? '#4a3f2a' : '#d8d2c0'; ctx.fillRect(x - 1, y - 47, 39, 10);
      ctx.font = 'bold 8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillStyle = dusk ? '#ffe9b0' : '#3a2f1a';
      ctx.fillText('PIT OUT', x + 18, y - 39);
      // 路面の矢印
      ctx.fillStyle = 'rgba(255,255,255,.45)';
      for (let k = 0; k < 3; k++) ctx.fillRect(x + 10, y + 4 + k * 7, 16, 3);
      hitBoxes.push({ key: 'gate', x: x - 4, y: y - 50, w: 46, h: 56 });
    })();

    /* ---- 通路の小物 ---- */
    const tyreStack = (tx, ty, n) => {
      for (let i = 0; i < n; i++) {
        const yy = ty - i * 5;
        ctx.fillStyle = '#15161a'; ctx.fillRect(tx - 8, yy - 5, 16, 6);
        ctx.fillStyle = i % 2 ? '#2a2c33' : '#22242a'; ctx.fillRect(tx - 8, yy - 5, 16, 2);
      }
    };
    tyreStack(160, 318, 4); tyreStack(182, 318, 3);
    tyreStack(330, 316, 3); tyreStack(468, 318, 4);
    const crate = (cx, cy, cw, ch, c) => {
      ctx.fillStyle = '#241a10'; ctx.fillRect(cx - 1, cy - ch - 1, cw + 2, ch + 2);
      ctx.fillStyle = c; ctx.fillRect(cx, cy - ch, cw, ch);
      ctx.fillStyle = 'rgba(255,255,255,.22)'; ctx.fillRect(cx, cy - ch, cw, 2);
    };
    crate(276, 320, 22, 13, g2.color);
    crate(302, 320, 16, 10, '#6a7078');
    crate(432, 320, 18, 11, '#6a7078');

    /* ---- パドックにいる人 ----
       自チームのドライバーは通路にいて、話しかけると気持ちが聞ける。
       記者は取材を待っている。                                     */
    const person = (x, y, suit, hair, face) => {
      ctx.fillStyle = 'rgba(0,0,0,.30)';
      ctx.beginPath(); ctx.ellipse(x, y, 7, 2.6, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = mix(suit, -0.20); ctx.fillRect(x - 5, y - 21, 10, 21);
      ctx.fillStyle = suit;             ctx.fillRect(x - 5, y - 21, 10, 8);
      ctx.fillStyle = 'rgba(255,255,255,.24)'; ctx.fillRect(x - 5, y - 21, 10, 2);
      ctx.fillStyle = '#2c3140'; ctx.fillRect(x - 5, y - 9, 4, 9);    // 脚
      ctx.fillRect(x + 1, y - 9, 4, 9);
      ctx.fillStyle = face;  ctx.fillRect(x - 4, y - 29, 8, 8);       // 顔
      ctx.fillStyle = hair;  ctx.fillRect(x - 4, y - 30, 8, 4);       // 髪
      ctx.fillStyle = '#2a2028'; ctx.fillRect(x - 3, y - 26, 2, 2);
      ctx.fillStyle = '#2a2028'; ctx.fillRect(x + 1, y - 26, 2, 2);
    };
    const py = WALK.y1 - 4;
    (g2.drivers || []).slice(0, 2).forEach((d, i) => {
      person(PEOPLE[i].x, py, g2.color, '#3a2718', '#f0c49a');
      hitBoxes.push({ key: PEOPLE[i].key, x: PEOPLE[i].x - 12, y: py - 32, w: 24, h: 34 });
      // ヘルメットを小脇に抱えている
      ctx.fillStyle = mix(g2.color, 0.18);
      ctx.fillRect(PEOPLE[i].x + 5, py - 15, 7, 7);
      ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillRect(PEOPLE[i].x + 5, py - 15, 7, 2);
    });
    // ライバルのドライバー。自チームの色ではなく、その人のチームの色を着ている
    visitors(g2).forEach(v => {
      person(v.spot.x, py, v.team.color, '#2b1d12', '#ecc196');
      // 胸元にチームカラーの識別帯
      ctx.fillStyle = mix(v.team.color, 0.28);
      ctx.fillRect(v.spot.x - 5, py - 14, 10, 2);
      hitBoxes.push({ key: v.spot.key, x: v.spot.x - 12, y: py - 32, w: 24, h: 34 });
      // 誰なのか分かるように名札を出す
      sign(ctx, v.spot.x, py - 46, v.driver.name,
           sel === v.spot.key ? '#e04a3f' : '#3f3a30');
    });

    // 記者たち（カメラを持っている）
    hitBoxes.push({ key: 'press', x: PEOPLE[2].x - 24, y: py - 34, w: 48, h: 36 });
    [0, 1, 2].forEach(k => {
      const x = PEOPLE[2].x - 14 + k * 14;
      person(x, py + (k === 1 ? 0 : 2), ['#4a5060', '#3f4652', '#55505e'][k], '#241c14', '#e8bd94');
      if (k === 1) {
        ctx.fillStyle = '#1b1e26'; ctx.fillRect(x - 6, py - 26, 12, 7);
        ctx.fillStyle = '#3a4048'; ctx.fillRect(x + 4, py - 25, 4, 5);
        ctx.fillStyle = 'rgba(200,230,255,.7)'; ctx.fillRect(x + 6, py - 24, 2, 3);
      }
    });

    /* ---- 看板 ---- */
    sign(ctx, garageX(MINE_AT), 110, '自チームのガレージ',
         sel === 'garage' ? '#e04a3f' : '#4a2f1a');
    SPOTS.forEach((sp, i) => {
      sign(ctx, sp.x, [198, 202, 184][i], sp.label, sel === sp.key ? '#e04a3f' : '#4a2f1a');
    });
    sign(ctx, PEOPLE[2].x, WALK.y1 - 40, '記者たち', sel === 'press' ? '#e04a3f' : '#4a2f1a');
    if (sel && /^scout(\d+)$/.test(sel)) {
      const i = parseInt(RegExp.$1, 10);
      const t = teams[i];
      sign(ctx, garageX(i), 110, (t && t.name ? t.name : 'ライバル') + ' を覗く', '#e04a3f');
    }

    /* ---- 選択中の場所を囲む ---- */
    if (sel) {
      const b = hitBoxes.find(h2 => h2.key === sel);
      if (b) {
        ctx.strokeStyle = '#fff34d'; ctx.lineWidth = 3;
        ctx.setLineDash([5, 4]);
        ctx.strokeRect(b.x - 3, b.y - 3, b.w + 6, b.h + 6);
        ctx.setLineDash([]);
      }
    }

    if (!dusk) return;
    // 夕暮れの空気
    const air = ctx.createLinearGradient(0, 40, 0, H);
    air.addColorStop(0, 'rgba(255,168,86,.20)');
    air.addColorStop(0.5, 'rgba(150,110,190,.10)');
    air.addColorStop(1, 'rgba(40,26,64,.28)');
    ctx.fillStyle = air; ctx.fillRect(0, 0, W, H);
    GP.fx.composite(out, { dof: 0, bloom: 1.0, warm: 1.0, vignette: 1.0, night: true });
  }

  /* ---------- 背景のキャッシュ（本拠地と同じ考え方）---------- */
  let cache = null, cacheKey = '';

  function keyOf(g2, sel) {
    return [document.body.getAttribute('data-skin'), sel || '',
            Math.floor(g2.fans), g2.season, g2.nextRace, g2.color, g2.team,
            (g2.scouted || []).join(','),
            visitors(g2).map(v => v.driver.name).join(',')].join('|');
  }

  function scene(g2, sel) {
    const k = keyOf(g2, sel);
    if (cache && cacheKey === k) return cache;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    render(c, g2, sel);
    cache = c; cacheKey = k;
    return cache;
  }

  function invalidate() { cache = null; cacheKey = ''; }

  function drawWith(cv, g2, sel, actor) {
    const out = cv.getContext('2d');
    out.imageSmoothingEnabled = false;
    out.setTransform(1, 0, 0, 1, 0, 0);
    out.clearRect(0, 0, W, H);
    out.drawImage(scene(g2, sel), 0, 0);
    if (actor) GP.base.drawActor(out, actor);
  }

  return { render, scene, drawWith, invalidate, hit, visitors,
           doorOf, doorPos, clampWalk, WALK, SPOTS, PEOPLE, VISIT, MINE_AT, garageX, W, H };
})();

</script>
<script>
/* ===== src/interior.js ===== */
/* =========================================================
   施設の内装
   拠点の建物に入ったときに見える部屋。
   施設レベルが上がると、機材が増え、人が増え、部屋そのものが広がる。
   横から見た絵で、いちばん手前に自分（チームプリンシパル）が立つ。
   ========================================================= */
window.GP = window.GP || {};

GP.interior = (function () {
  'use strict';

  const W = 520, H = 190;

  function seeded(n) {
    let h = (n * 2654435761) >>> 0;
    return function () { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  }

  function mix(hex, amt) {
    if (!hex || hex[0] !== '#') return hex;
    const n = parseInt(hex.slice(1), 16);
    const c = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
  }

  /* 働いている人。レベルが上がるほど増える */
  function worker(g, x, y, col, phase) {
    const bob = Math.sin(phase) * 0.8;
    g.fillStyle = 'rgba(0,0,0,.26)'; g.fillRect(x - 4, y + 1, 8, 2);
    g.fillStyle = mix(col, -0.20); g.fillRect(x - 4, y - 13 + bob, 8, 13);
    g.fillStyle = col;             g.fillRect(x - 4, y - 13 + bob, 8, 5);
    g.fillStyle = '#e8b98e';       g.fillRect(x - 3, y - 19 + bob, 6, 6);   // 顔
    g.fillStyle = '#3a2718';       g.fillRect(x - 3, y - 20 + bob, 6, 3);   // 髪
  }

  /* 部屋の枠。レベルが上がるほど天井が高く、明かりが増える */
  function room(g, lv, tint, dusk) {
    const grow = Math.min(1, (lv - 1) / 9);
    const floorY = H - 22;
    // 奥の壁
    g.fillStyle = dusk ? '#2a2436' : '#cfc6b2';
    g.fillRect(0, 0, W, floorY);
    g.fillStyle = dusk ? '#312b3e' : '#d8cfbb';
    g.fillRect(0, 0, W, 16 + grow * 10);                       // 天井
    // 壁の帯（チームカラー）
    g.fillStyle = tint;
    g.fillRect(0, 22 + grow * 10, W, 5);
    g.fillStyle = 'rgba(255,255,255,.28)';
    g.fillRect(0, 22 + grow * 10, W, 1.5);
    // 天井の照明。レベルで数が増える
    const lamps = 2 + Math.round(grow * 4);
    for (let i = 0; i < lamps; i++) {
      const x = (i + 0.5) * (W / lamps);
      g.fillStyle = '#5c5648'; g.fillRect(x - 1, 0, 2, 6);
      g.fillStyle = '#fff6d8'; g.fillRect(x - 9, 6, 18, 4);
      const gl = g.createRadialGradient(x, 10, 2, x, 10, 46);
      gl.addColorStop(0, 'rgba(255,240,190,.28)');
      gl.addColorStop(1, 'rgba(255,240,190,0)');
      g.fillStyle = gl; g.fillRect(x - 46, 6, 92, 70);
    }
    // 床
    g.fillStyle = dusk ? '#3a3346' : '#9a9384';
    g.fillRect(0, floorY, W, H - floorY);
    g.fillStyle = dusk ? '#413a4e' : '#a49d8c';
    for (let x = 0; x < W; x += 30) g.fillRect(x, floorY, 28, H - floorY);
    g.fillStyle = 'rgba(0,0,0,.22)'; g.fillRect(0, floorY, W, 2);
    return floorY;
  }

  /* ---------- 施設ごとの中身 ---------- */
  const ROOMS = {
    /* ファクトリー：作業台とマシン、レベルが上がると設備が並ぶ */
    factory: function (g, lv, col, fy, rnd) {
      const n = Math.min(5, 1 + Math.floor(lv / 2.2));
      for (let i = 0; i < n; i++) {                     // 部品棚
        const x = 14 + i * 42;
        g.fillStyle = '#4a4034'; g.fillRect(x, fy - 46, 34, 46);
        g.fillStyle = '#5e5344'; g.fillRect(x + 1, fy - 45, 32, 44);
        for (let r = 0; r < 3; r++) {
          g.fillStyle = '#3a3229'; g.fillRect(x + 2, fy - 42 + r * 14, 30, 2);
          for (let c = 0; c < 3; c++) {
            if (((i + r + c) % 4) === 0) continue;
            g.fillStyle = ['#8d94a0', col, '#a08860'][(i + c) % 3];
            g.fillRect(x + 4 + c * 10, fy - 40 + r * 14, 7, 8);
          }
        }
      }
      // 組み立て中のマシン
      const cx = W - 150, cy = fy - 8;
      g.fillStyle = '#3a3d46'; g.fillRect(cx - 4, cy - 4, 118, 6);          // 作業台
      g.fillRect(cx + 4, cy + 2, 6, 6); g.fillRect(cx + 96, cy + 2, 6, 6);
      g.fillStyle = mix(col, -0.18); g.fillRect(cx + 10, cy - 20, 86, 16);
      g.fillStyle = col; g.fillRect(cx + 14, cy - 20, 78, 12);
      g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(cx + 14, cy - 20, 78, 3);
      g.fillStyle = '#17181c';
      g.fillRect(cx + 16, cy - 10, 14, 8); g.fillRect(cx + 76, cy - 10, 14, 8);
      g.fillStyle = '#2b2e36'; g.fillRect(cx + 4, cy - 24, 14, 4);          // ウイング
      g.fillRect(cx + 92, cy - 26, 16, 5);
      if (lv >= 5) {                                                        // ロボットアーム
        g.fillStyle = '#f0a020'; g.fillRect(cx + 44, fy - 74, 6, 30);
        g.fillRect(cx + 44, fy - 76, 26, 6);
        g.fillStyle = '#8d94a0'; g.fillRect(cx + 66, fy - 74, 5, 14);
      }
      return [30, 100, W - 60].slice(0, 1 + Math.floor(lv / 3));
    },

    /* 風洞：送風管と、模型を載せた台 */
    tunnel: function (g, lv, col, fy, rnd) {
      const r = 30 + lv * 2.2;
      const cx = 96, cy = fy - r - 6;
      g.fillStyle = '#3a3f48';
      g.beginPath(); g.arc(cx, cy, r + 5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#8d959e';
      g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#5f6870';
      g.beginPath(); g.arc(cx, cy, r * 0.42, 0, Math.PI * 2); g.fill();
      g.strokeStyle = '#dfe6ec'; g.lineWidth = 3;                           // 羽根
      for (let a = 0; a < 5; a++) {
        const t = a * Math.PI * 2 / 5 + lv * 0.4;
        g.beginPath(); g.moveTo(cx, cy);
        g.lineTo(cx + Math.cos(t) * r * 0.8, cy + Math.sin(t) * r * 0.8); g.stroke();
      }
      // 風の筋。レベルが上がるほど本数が増える
      const lines = 3 + Math.floor(lv * 0.7);
      for (let i = 0; i < lines; i++) {
        const y = cy - r + (i + 0.5) * (r * 2 / lines);
        g.fillStyle = 'rgba(200,230,255,' + (0.16 + (i % 3) * 0.06).toFixed(2) + ')';
        g.fillRect(cx + r + 8, y, 130 + (i % 4) * 26, 2);
      }
      // 模型を載せた台
      const mx = W - 150;
      g.fillStyle = '#3a3d46'; g.fillRect(mx, fy - 10, 110, 10);
      g.fillStyle = mix(col, -0.16); g.fillRect(mx + 18, fy - 24, 70, 12);
      g.fillStyle = col; g.fillRect(mx + 22, fy - 24, 62, 9);
      g.fillStyle = '#17181c';
      g.fillRect(mx + 24, fy - 16, 11, 6); g.fillRect(mx + 72, fy - 16, 11, 6);
      if (lv >= 4) {                                                        // 計測モニター
        g.fillStyle = '#241a10'; g.fillRect(W - 62, fy - 74, 52, 36);
        g.fillStyle = '#12202c'; g.fillRect(W - 60, fy - 72, 48, 32);
        for (let i = 0; i < 4; i++) {
          g.fillStyle = 'rgba(120,220,255,.7)';
          g.fillRect(W - 56, fy - 66 + i * 7, 10 + (i * 11) % 30, 3);
        }
      }
      return [200, 300, 380].slice(0, 1 + Math.floor(lv / 4));
    },

    /* シミュレーター：ドーム型の機体と画面 */
