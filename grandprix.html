<!DOCTYPE html>
<html lang="ja">
<head>
<!-- このファイルは build.js が生成した1ファイル版です。編集は src/ 側で行ってください。 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>グランプリ物語 - F1チーム運営シミュレーション</title>

<!-- ホーム画面に追加してアプリとして遊べるようにする -->
<meta name="theme-color" content="#4a2f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GP物語">
<style>
/* =========================================================
   グランプリ物語 — カイロソフト風スタイル
   太いこげ茶の枠 × 生成りの紙 × ポップな原色
   ========================================================= */
:root{
  --ink:#4a2f1a;          /* 枠線・文字のこげ茶 */
  --ink2:#7b5a3a;
  --paper:#fff8e3;        /* パネルの紙色 */
  --paper2:#f6ecd0;
  --board:#c9a86a;        /* 背景の木目 */
  --board2:#b8955a;
  --red:#e04a3f; --blue:#3a7ad9; --green:#4ea63f;
  --yellow:#ffc93c; --purple:#b06fd0; --sky:#7ecbf0;

  --paper3:#fffdf3;       /* パネルの中の、さらに明るい面 */
  --trough:#e9dcbc;       /* ゲージの下地 */
  --hilite:#fff;          /* 枠の内側に入れる光の線 */
  --outline:#fff;         /* 見出し文字の縁取り */
  --headbg:linear-gradient(var(--ink2),#65482c);
  --headbg2:var(--ink);
  --headfg:#ffeec4;
  --glow:transparent;     /* HD-2Dスキンでだけ光る */
  --shine:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
/* ---------- タッチ操作まわり（スマホ／ホーム画面アプリ用）---------- */
html{-webkit-text-size-adjust:100%}
body{
  overscroll-behavior:none;              /* 引っ張って更新されないように */
  -webkit-tap-highlight-color:transparent;
  -webkit-touch-callout:none;
  touch-action:manipulation;             /* ダブルタップ拡大を止める */
}
button,.cmd,.tab,.pickbtn,.stratbtn,.mini,.colorbtn{touch-action:manipulation;user-select:none;-webkit-user-select:none}
input{user-select:auto;-webkit-user-select:auto}
body{
  font-family:'DotGothic16','Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN',
              'Yu Gothic UI','Meiryo',sans-serif;
  color:var(--ink);
  background:var(--board);
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,.05) 0 2px, transparent 2px 8px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 3px, transparent 3px 14px);
  -webkit-font-smoothing:none;
  font-size:14px; line-height:1.5;
  overflow:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- 共通の「カイロ枠」 ---------- */
.frame{
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:8px;
  box-shadow:0 4px 0 var(--ink), inset 0 0 0 2px var(--hilite);
}

/* ================= レイアウト ================= */
#app{height:100%;display:flex;flex-direction:column;gap:8px;max-width:1180px;margin:0 auto;
     padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
             calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left))}

/* ---------- トップバー ---------- */
.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:8px 12px;
  background:linear-gradient(#fff8e3,#f0e2bd);
  border:3px solid var(--ink);border-radius:10px;
  box-shadow:0 4px 0 var(--ink);
}
.tb-team{display:flex;align-items:center;gap:7px;font-size:17px;font-weight:bold}
.tb-team .dot{width:16px;height:16px;border:2px solid var(--ink);border-radius:3px;display:inline-block}
.tb-team .rank{font-size:10px;font-weight:normal;background:var(--ink);color:#ffeec4;
               border-radius:5px;padding:1px 7px;white-space:nowrap}
.tb-team .rank.grow{animation:rankpop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes rankpop{0%{transform:scale(.7);background:var(--yellow);color:var(--ink)}
  60%{transform:scale(1.15);background:var(--yellow);color:var(--ink)}100%{transform:scale(1)}}
.tb-stats{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.stat{
  display:flex;align-items:center;gap:3px;
  background:var(--paper3);border:2px solid var(--ink);border-radius:6px;
  padding:2px 8px;font-size:13px;box-shadow:0 2px 0 rgba(74,47,26,.35);
}
.stat.danger{background:#ffdede;animation:blink .8s steps(2,end) infinite}
.stat .ic{font-size:14px}
.stat b{font-size:15px}
.stat small{font-size:10px;opacity:.7}
.tb-next{
  background:var(--headbg2);color:var(--headfg);border-radius:6px;padding:4px 12px;
  font-size:13px;white-space:nowrap;
}
.tb-next.race-imminent{background:var(--red);color:#fff;animation:pulse .7s ease-in-out infinite alternate}
.tb-next.race-soon{background:#8a5a1a}
.tb-next b{color:var(--yellow)}
.tb-next em{font-style:normal;font-size:10px;opacity:.85;margin-left:6px}
.pips{display:inline-flex;gap:3px;margin:0 6px;vertical-align:middle}
.pips i{width:8px;height:8px;border-radius:2px;background:var(--yellow);
        border:1px solid rgba(0,0,0,.35);display:inline-block}

/* ---------- 次戦までの残りコマンド ---------- */
.countdown{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;margin-bottom:8px;
           background:linear-gradient(#fff8e3,#f2e4bc);border:3px solid var(--ink);
           border-radius:8px;padding:6px 10px;box-shadow:0 2px 0 rgba(74,47,26,.4)}
.countdown b{font-size:14px}
.countdown span{font-size:10px;opacity:.8}
.countdown .pips i{width:12px;height:12px;background:linear-gradient(var(--yellow),#e8a800);
                   border:2px solid var(--ink);border-radius:3px}
.countdown.now{background:linear-gradient(#ffd0c0,#ff9a80);border-color:var(--red)}
.countdown.now b{color:#a01a10}

/* ---------- タイヤ ---------- */
.tyres{gap:5px}
.tyrebtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.25;
         background:var(--paper3);border:3px solid var(--ink);border-radius:8px;
         box-shadow:0 3px 0 rgba(74,47,26,.5);padding:4px 2px;font-size:9px}
.tyrebtn b{width:22px;height:22px;border-radius:50%;background:var(--tc);color:var(--tt);
           border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:11px}
.tyrebtn small{font-size:8px;opacity:.8}
.tyrebtn.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.rv-ty{min-width:26px;display:inline-flex;align-items:center;justify-content:center;gap:1px;
       border:1px solid var(--ink);border-radius:8px;font-size:9px;font-weight:bold;padding:0 3px;
       background:#666;color:#fff;flex-shrink:0}
.rv-ty em{font-style:normal;font-size:8px;opacity:.85;font-weight:normal}
.rv-ty.old{box-shadow:inset 0 0 0 2px rgba(255,180,0,.9)}
.rv-ty.worn{box-shadow:inset 0 0 0 2px rgba(255,40,20,.95);animation:blink 1s steps(2,end) infinite}
.rv-row.pitting{background:rgba(255,243,77,.28)}
.rv-row.pitting .rv-gap{color:#c88000;font-weight:bold}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.06)}}
@keyframes blink{50%{opacity:.45}}

/* ---------- メイン ---------- */
.main{flex:1;display:grid;grid-template-columns:1fr 330px;gap:8px;min-height:0}
.col-left{overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px;
          align-content:start;grid-auto-rows:min-content;padding-right:2px}
.col-left > .card:first-child{grid-column:1 / -1}
.col-right{overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px}
.col-left::-webkit-scrollbar,.col-right::-webkit-scrollbar,
.loglist::-webkit-scrollbar,.rv-order::-webkit-scrollbar,
.rv-loglist::-webkit-scrollbar,.modal-body::-webkit-scrollbar{width:10px}
.col-left::-webkit-scrollbar-thumb,.col-right::-webkit-scrollbar-thumb,
.loglist::-webkit-scrollbar-thumb,.rv-order::-webkit-scrollbar-thumb,
.rv-loglist::-webkit-scrollbar-thumb,.modal-body::-webkit-scrollbar-thumb{
  background:var(--ink2);border:2px solid var(--ink);border-radius:6px}

/* ---------- カード ---------- */
.card{
  background:var(--paper);border:3px solid var(--ink);border-radius:10px;
  box-shadow:0 4px 0 var(--ink);overflow:hidden;flex-shrink:0;
}
.card-h{
  background:var(--headbg);color:var(--headfg);
  padding:5px 10px;font-size:14px;border-bottom:3px solid var(--ink);
  text-shadow:1px 1px 0 rgba(0,0,0,.4);
}
.pad{padding:10px}
.sub{margin:12px 0 6px;font-size:13px;background:var(--headbg2);color:var(--headfg);
     display:inline-block;padding:2px 10px;border-radius:5px}
.desc{font-size:12px;color:#6b503a;margin:6px 0;line-height:1.6}
.lead{font-size:13px;margin-bottom:10px;line-height:1.7}

/* ---------- 注目度ゲージ ---------- */
.stat.hype{gap:5px}
.hypebar{width:44px;height:8px;background:var(--trough);border:2px solid var(--ink);
         border-radius:5px;overflow:hidden;display:inline-block}
.hypebar b{display:block;height:100%;transition:width .4s}
.hypebox{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;
         background:var(--paper3);border:2px dashed var(--ink2);border-radius:8px;padding:5px 9px;margin-bottom:8px}
.skind{font-style:normal;font-size:9px;border:1px solid var(--ink);border-radius:4px;
       padding:0 5px;margin-left:5px;background:#e8dcc0}
.skind.tech{background:#cfe0f8}
.skind.media{background:#ffe0f0}
.skind.mixed{background:#e0f4d8}
.pickbtn.offer{border-color:#8a2f8a;box-shadow:0 3px 0 #8a2f8a;
               background:linear-gradient(#fff0ff,#f4dcf4);animation:sppop .3s cubic-bezier(.3,1.5,.6,1)}
.gp-t .flp{font-style:normal;margin-left:3px}
.rewardbox small{display:block;font-size:9px;opacity:.65}

/* ---------- 収支ダッシュボード ---------- */
.fin{display:flex;gap:8px;flex-wrap:wrap}
.fin-col{flex:1;min-width:200px;background:var(--paper3);border:2px solid var(--ink);border-radius:8px;padding:6px 8px}
.fin-h{background:var(--ink);color:#ffeec4;border-radius:5px;padding:2px 8px;font-size:11px;margin-bottom:5px}
.fin-row{display:flex;justify-content:space-between;gap:8px;font-size:11px;padding:2px 0;
         border-bottom:1px dashed #d8c8a4}
.fin-row.cut{color:#2e8b30}
.fin-row.total{border-bottom:none;border-top:2px solid var(--ink);margin-top:3px;padding-top:4px;font-size:13px}
.fin-row.total b{font-size:14px}

/* ---------- 開発リソースの配分 ---------- */
.focusrow{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}
.focusbtn{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
          background:var(--paper3);border:3px solid var(--ink);border-radius:8px;
          box-shadow:0 3px 0 rgba(74,47,26,.5);padding:4px 7px;line-height:1.3;text-align:left}
.focusbtn b{font-size:12px}
.focusbtn small{font-size:9px;opacity:.75}
.focusbtn.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.nextcar{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:10px;
         background:#f0fbe8;border:2px solid var(--ink);border-radius:7px;padding:4px 9px}
.nextcar i{flex:1;height:10px;background:var(--trough);border:2px solid var(--ink);border-radius:5px;overflow:hidden}
.nextcar i b{display:block;height:100%;background:linear-gradient(#8ede6a,#4ea63f);transition:width .35s}
.nextcar em{font-style:normal;font-weight:bold;width:36px;text-align:right}

/* ---------- 車体 ---------- */
.sub.small{font-size:11px;padding:1px 8px;margin:8px 0 4px}
.bodyattrs{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.battr{display:flex;align-items:center;gap:5px;font-size:10px;background:var(--paper3);
       border:2px solid var(--ink);border-radius:6px;padding:2px 6px}
.battr span{width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.battr i{flex:1;height:8px;background:var(--trough);border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.battr i b{display:block;height:100%;transition:width .35s}
.battr em{font-style:normal;width:44px;text-align:right;font-weight:bold}
.battr em small{font-weight:normal;opacity:.6;font-size:8px}

/* ---------- ERS ---------- */
.ersrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;margin:6px 0;
        background:#eef4ff;border:2px solid var(--ink);border-radius:6px;padding:3px 8px}
.ersrow em{font-style:normal;opacity:.85}
.sc-ers{display:inline-flex;align-items:center;gap:3px;width:52px;flex-shrink:0;font-size:10px}
.sc-ers i{flex:1;height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;display:block}
.sc-ers i u{display:block;height:100%;text-decoration:none;background:#6cf0ff;transition:width .4s}
.sc-ers.mid i u{background:#ffd24a}
.sc-ers.low i u{background:#ff6a4a}

/* ---------- 人事のタブ ---------- */
.hrtabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.hrtab{flex:1;min-width:88px;background:#e8dcc0;border:3px solid var(--ink);border-radius:8px;
       box-shadow:0 3px 0 rgba(74,47,26,.5);padding:5px 4px;font-size:11px;font-weight:bold}
.hrtab.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.skbar{display:inline-block;width:70px;height:7px;background:var(--trough);border:1px solid var(--ink);
       border-radius:4px;overflow:hidden;vertical-align:middle}
.skbar i{display:block;height:100%;background:linear-gradient(var(--green),#2e7a2e)}
.srank{background:var(--sky);border:1px solid var(--ink);border-radius:4px;padding:0 5px;font-style:normal;font-size:9px}
.deptgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:4px}
.dept{display:flex;align-items:center;gap:5px;font-size:10px;background:var(--paper3);
      border:2px solid var(--ink);border-radius:6px;padding:2px 6px}
.dept span{width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dept i{flex:1;height:8px;background:var(--trough);border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.dept i b{display:block;height:100%;background:linear-gradient(var(--yellow),#e8a800)}
.dept em{font-style:normal;width:26px;text-align:right}
.mgmtrow.empty{opacity:.65;border-style:dashed}
.mgeff{font-style:normal;color:#2e6b8b}

/* ---------- チャンピオンシップ順位表 ---------- */
.tablewrap{overflow-x:auto;border:2px solid var(--ink);border-radius:8px;background:var(--paper3);margin-bottom:4px}
table.rank.champ{font-size:11px}
table.rank.champ td,table.rank.champ th{padding:3px 5px;text-align:center;white-space:nowrap}
table.rank.champ td.nm,table.rank.champ th.nm{text-align:left}
table.rank.champ td.pt{font-weight:bold;font-size:12px}
table.rank.grid{font-size:10px}
table.rank.grid td{width:22px;text-align:center;padding:2px}
table.rank.grid td.gold{background:var(--yellow);font-weight:bold}
table.rank.grid td.pod{background:#c8ecc0;font-weight:bold}
table.rank.grid td.pts{background:#e8f0d8}
table.rank.grid td.dnf{background:#ffd8d0;color:#a02010}
table.rank.grid td.dim{opacity:.35}

/* ---------- 難易度・チケット ---------- */
.tb-team .mode{font-size:10px;color:#fff;border:2px solid var(--ink);border-radius:5px;
               padding:0 6px;white-space:nowrap;text-shadow:1px 1px 0 rgba(0,0,0,.3)}
.stat.ticket.has{background:linear-gradient(#fff4c0,#ffe88a);animation:tkpulse 1.4s ease-in-out infinite}
@keyframes tkpulse{0%,100%{box-shadow:0 2px 0 rgba(74,47,26,.35)}50%{box-shadow:0 2px 0 rgba(74,47,26,.35),0 0 8px 2px rgba(255,201,60,.8)}}
.diffs{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.diffbtn{flex:1;min-width:96px;display:flex;flex-direction:column;align-items:flex-start;gap:1px;
         background:var(--paper3);border:3px solid var(--ink);border-radius:8px;
         box-shadow:0 3px 0 rgba(74,47,26,.5);padding:5px 8px;text-align:left;line-height:1.3}
.diffbtn b{font-size:13px}
.diffbtn small{font-size:9px;opacity:.75}
.diffbtn.on{background:var(--dc);color:#fff;transform:translateY(3px);box-shadow:0 0 0 var(--ink);
            text-shadow:1px 1px 0 rgba(0,0,0,.35)}
.diffbtn.on small{opacity:.95}
.ticketbar{display:flex;align-items:center;gap:8px;width:100%;cursor:pointer;
           background:var(--paper3);border:3px dashed var(--ink2);border-radius:8px;padding:6px 8px;margin-bottom:10px}
.ticketbar.on{background:linear-gradient(#fff4c0,#ffe88a);border-style:solid;border-color:var(--ink)}
.tk-ic{font-size:20px}
.tk-body{flex:1;display:flex;flex-direction:column;line-height:1.3;font-size:12px}
.tk-body small{font-size:10px;opacity:.75}
.tk-sw{font-size:11px;font-weight:bold;background:var(--ink);color:#ffeec4;border-radius:5px;padding:2px 8px}
.ticketbar.on .tk-sw{background:var(--red);color:#fff}
.pb-cost b.free{color:#2e8b30;font-size:12px}
.youthrow em{font-style:normal;font-weight:bold}

/* ---------- チーム本拠地 ---------- */
.baseinfo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
          background:var(--ink);color:#ffeec4;border-radius:8px;padding:5px 10px;margin-bottom:8px;font-size:11px}
.baseinfo b{font-size:14px;color:var(--yellow)}
.basewrap{border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:#8fbf62;
          box-shadow:0 3px 0 rgba(74,47,26,.5)}
#baseCv{display:block;width:100%;height:auto;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;cursor:pointer}
.lvbar{display:flex;align-items:center;gap:8px;font-size:11px;margin:6px 0}
.lvbar i{flex:1;display:flex;gap:2px}
.lvbar i b{flex:1;height:12px;background:var(--trough);border:2px solid var(--ink);border-radius:3px}
.lvbar i b.on{background:linear-gradient(var(--yellow),#e8a800)}
.basebtns{display:flex;gap:8px;margin:6px 0}
.basepick{flex-direction:row;flex-wrap:wrap;gap:5px}
.basepick .pickbtn{flex:1 1 30%;min-width:120px;justify-content:flex-start;font-size:10px;padding:4px 6px}
.basepick .pickbtn.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.basepick em{font-style:normal;opacity:.7;margin-left:auto}

/* ---------- 効果音ボタン ---------- */
.stat.sound{cursor:pointer;font-size:14px;line-height:1;padding:3px 8px}
.stat.sound.off{opacity:.5}

/* ---------- 特別戦の招待 ---------- */
.card.special{grid-column:1 / -1;border-color:#8a2f8a;box-shadow:0 4px 0 #8a2f8a;
              animation:sppop .3s cubic-bezier(.3,1.5,.6,1)}
.card.special .card-h{background:linear-gradient(#b04ab0,#8a2f8a)}
@keyframes sppop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.sp-meta{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin:6px 0}
.sp-meta span{background:var(--paper3);border:2px solid var(--ink);border-radius:6px;padding:2px 8px}
.sp-btns{display:flex;gap:8px;margin-top:8px}

/* ---------- 次戦カード ---------- */
.track-mini{background:#8fd06a;border:2px solid var(--ink);border-radius:6px;margin-bottom:8px}
.tinfo{display:flex;gap:12px;font-size:12px;margin-bottom:4px}
.seclegend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;margin:4px 0}
.seclegend span{display:flex;align-items:center;gap:3px}
.seclegend i{width:12px;height:5px;border:1px solid var(--ink);border-radius:2px;display:inline-block}
.seclegend em{font-style:normal;opacity:.75}
.req{margin-top:8px}
.reqrow{display:flex;align-items:center;gap:6px;font-size:11px;margin:3px 0}
.reqrow span{width:52px}
.reqrow i{flex:1;height:11px;background:var(--trough);border:2px solid var(--ink);border-radius:6px;
          overflow:hidden;display:block}
.reqrow i b{display:block;height:100%;background:linear-gradient(var(--yellow),#e8a800)}
.reqrow em{width:34px;text-align:right;font-style:normal}
.score{margin-top:8px;background:var(--paper3);border:2px dashed var(--ink2);border-radius:6px;
       padding:5px 8px;font-size:13px;text-align:center}
.score b{font-size:19px;color:var(--red)}

/* ---------- マシン ---------- */
.statrow{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.sb{display:flex;align-items:center;gap:7px;font-size:12px}
.sb span{width:58px}
.sb i{flex:1;height:14px;background:var(--trough);border:2px solid var(--ink);border-radius:7px;overflow:hidden;display:block}
.sb i b{display:block;height:100%;border-radius:5px 0 0 5px;transition:width .35s}
.sb em{width:34px;text-align:right;font-style:normal;font-weight:bold}
.rel{font-size:12px;margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rel b{font-size:17px}
.rel small{font-size:10px;opacity:.75}
.good{color:#2e8b30}.warn{color:#d08000}.bad{color:#d02020}
.parts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.part{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:wrap;
      background:var(--paper3);border:2px solid var(--ink);border-radius:6px;padding:3px 6px}
.part.empty{opacity:.55;border-style:dashed}
.p-ic{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
      border:2px solid var(--ink);border-radius:5px;font-size:11px}
.p-nm{width:132px;display:flex;flex-direction:column;line-height:1.2;min-width:0;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p-nm small{font-size:9px;opacity:.75;font-weight:normal}
.p-rar{letter-spacing:-1px;font-size:9px}
.p-lv{width:56px;font-weight:bold;text-align:right}
.p-lv small{font-size:9px;opacity:.6;font-weight:normal}
.p-bar{flex:1;min-width:60px;height:10px;background:var(--trough);border:2px solid var(--ink);
       border-radius:5px;overflow:hidden}
.p-bar i{display:block;height:100%;transition:width .35s}
.p-cond{width:38px;text-align:right}
.p-act{display:flex;gap:3px;align-items:center}
.p-act small{font-size:9px;opacity:.6}
.p-trs{display:flex;gap:3px;flex-wrap:wrap;width:100%;padding-left:26px}
.ptr{font-size:9px;background:var(--yellow);border:2px solid var(--ink);border-radius:4px;padding:0 4px}
.invnote{margin-top:8px;font-size:11px;background:#f0fbe8;border:2px dashed var(--ink2);
         border-radius:6px;padding:4px 8px;text-align:center}
.card-h b.gen{background:var(--red);border-radius:5px;padding:0 8px;font-size:12px;margin-left:4px}
.p-cond.warn{color:#d08000;font-weight:bold}
.p-cond.bad{color:#d02020;font-weight:bold;animation:blink 1s steps(2,end) infinite}

/* ---------- ドライバー ---------- */
.drvwrap{display:grid;grid-template-columns:1fr;gap:8px}
.drv{background:var(--paper3);border:2px solid var(--ink);border-radius:8px;padding:7px;
     box-shadow:0 2px 0 rgba(74,47,26,.3)}
.drv.empty{display:flex;flex-direction:column;justify-content:center;align-items:center;
           color:#a08868;font-size:12px;text-align:center;border-style:dashed}
.drv-head{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.face{border:2px solid var(--ink);border-radius:5px;flex-shrink:0;image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;
      background:#cfe6f5;box-shadow:0 2px 0 rgba(74,47,26,.35)}
.drv-id{flex:1;display:flex;flex-direction:column;line-height:1.25;min-width:0}
.drv-nm{font-size:13px;font-weight:bold;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drv-sub{font-size:9px;opacity:.8}
.drv-sub b{background:var(--yellow);border:1px solid var(--ink);border-radius:3px;padding:0 3px}
.drv-age{font-size:10px;opacity:.7}
.quote{display:flex;gap:6px;align-items:flex-start;background:var(--paper3);border:2px solid var(--ink);
       border-radius:8px;padding:5px 7px;margin-top:6px;font-size:11px;line-height:1.5}
.quote .face{width:30px;height:30px}
.quote em{font-style:normal;display:block;font-size:9px;opacity:.7;margin-bottom:1px}
.skills{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:5px}
.skill{background:var(--sky);border:2px solid var(--ink);border-radius:4px;
       font-size:9px;padding:0 5px;white-space:nowrap}
.skill.none{background:#e0d6bc;opacity:.7}
.drv-stats{display:grid;grid-template-columns:1fr 1fr;gap:2px 6px;margin-bottom:5px}
.mst{display:flex;align-items:center;gap:3px;font-size:10px}
.mst span{width:24px}
.mst i{flex:1;height:7px;background:var(--trough);border:1px solid var(--ink);border-radius:4px;overflow:hidden}
.mst i b{display:block;height:100%;background:linear-gradient(var(--green),#3a8030)}
.mst em{width:22px;text-align:right;font-style:normal}
.drv-foot{display:flex;justify-content:space-between;font-size:10px;border-top:1px dashed var(--ink2);padding-top:3px}
.drv-sal{font-size:9px;opacity:.6;text-align:right}

/* ---------- サイドパネル ---------- */
.col-right{background:var(--paper);border:3px solid var(--ink);border-radius:10px;
           box-shadow:0 4px 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;gap:0}
.tabs{display:flex;background:var(--ink2);border-bottom:3px solid var(--ink);flex-shrink:0}
.tab{flex:1;background:transparent;border:none;color:#e8d5b5;font-size:10px;padding:6px 2px;border-right:2px solid var(--ink)}
.tab:last-child{border-right:none}
.tab.on{background:var(--paper);color:var(--ink);font-weight:bold}
.tabbody{flex:1;overflow-y:auto;padding:8px}
.loglist{display:flex;flex-direction:column;gap:3px}
.logline{font-size:11px;background:var(--paper3);border-left:4px solid var(--ink2);
         padding:3px 6px;border-radius:0 5px 5px 0;line-height:1.45}
.logline.good{border-left-color:var(--green);background:#f0fbe8}
.logline.bad{border-left-color:var(--red);background:#ffeeee}
.logline.warn{border-left-color:var(--yellow);background:#fff8e0}
table.rank{width:100%;border-collapse:collapse;font-size:11px}
table.rank th{background:var(--ink2);color:#ffeec4;padding:3px;font-weight:normal}
table.rank td{border-bottom:1px dashed #d8c8a4;padding:3px}
table.rank tr.me td{background:#fff2c4;font-weight:bold}
.rk-chip{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);border-radius:2px;margin-right:4px}
.stafflist{display:flex;flex-direction:column;gap:4px}
.staff{display:flex;align-items:center;gap:6px;font-size:11px;background:var(--paper3);
       border:2px solid var(--ink);border-radius:6px;padding:3px 6px}
.s-nm{flex:1;display:flex;flex-direction:column;line-height:1.2}
.s-nm small{font-size:9px;opacity:.65}
.s-sk{font-size:10px}.s-sal{font-size:10px;opacity:.7}
.facs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.fac{font-size:10px;background:var(--paper3);border:2px solid var(--ink);border-radius:5px;
     padding:2px 5px;display:flex;justify-content:space-between}
.spons{margin-top:8px}
.spon{font-size:11px;background:#f0fbe8;border:2px solid var(--ink);border-radius:5px;
      padding:2px 6px;margin-bottom:3px;display:flex;justify-content:space-between}
.spon em{font-style:normal;opacity:.7}

/* ---------- コマンドバー ---------- */
.cmdbar{flex-shrink:0}
.cmdset{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cmd{
  flex:1;min-width:78px;
  display:flex;flex-direction:column;align-items:center;gap:1px;
  background:linear-gradient(#fff8e3,#f0dfb4);
  border:3px solid var(--ink);border-radius:9px;
  box-shadow:0 4px 0 var(--ink);
  padding:6px 4px;font-size:12px;font-weight:bold;
  transition:transform .06s,box-shadow .06s;
}
.cmd span{font-size:20px;line-height:1}
.cmd:hover{background:linear-gradient(#fffdf0,#f8ebc8)}
.cmd:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.cmd.sub{flex:0 0 auto;min-width:66px;background:linear-gradient(#e8dcc0,#d8c69c);font-size:11px;
         color:var(--ink)}   /* 見出しの .sub と名前が重なるので、文字色を戻す */
.cmd.sub span{font-size:16px}
.cmd.big{background:linear-gradient(#ff8a5c,var(--red));color:#fff;font-size:17px;padding:10px;
         text-shadow:1px 1px 0 rgba(0,0,0,.35);animation:pulse .8s ease-in-out infinite alternate}
.cmd.big span{font-size:26px}
.cmd-sep{width:2px;height:34px;background:rgba(74,47,26,.35);border-radius:2px}

/* ---------- タイトル表示中はガレージを隠す ---------- */
body.preboot .main,
body.preboot .cmdbar,
body.preboot .topbar{visibility:hidden}

/* ================= モーダル ================= */
#modal{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(40,24,10,.6);display:none;
       align-items:center;justify-content:center;z-index:50;
       padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
               calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
#modal.show{display:flex}
.modal-box{
  width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;
  background:var(--paper);border:4px solid var(--ink);border-radius:12px;
  box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 0 0 2px var(--hilite);
  animation:popin .18s cubic-bezier(.3,1.5,.6,1);
}
#modal.wide .modal-box{max-width:700px}
@keyframes popin{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.modal-h{display:flex;align-items:center;background:linear-gradient(var(--ink2),#65482c);
         color:#ffeec4;padding:7px 12px;font-size:15px;border-bottom:3px solid var(--ink);
         border-radius:7px 7px 0 0;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.modal-h span{flex:1}
.modal-x{background:var(--red);color:#fff;border:2px solid var(--ink);border-radius:5px;
         width:24px;height:24px;font-size:12px;line-height:1}
.modal-body{padding:12px;overflow-y:auto;flex:1}
.modal-btns{display:flex;gap:8px;padding:10px 12px;border-top:3px solid var(--ink);
            background:var(--paper2);border-radius:0 0 7px 7px;flex-wrap:wrap}
.btn{flex:1;min-width:100px;background:linear-gradient(#fff8e3,#e8d8ae);
     border:3px solid var(--ink);border-radius:8px;box-shadow:0 3px 0 var(--ink);
     padding:7px;font-size:13px;font-weight:bold}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:linear-gradient(#ffd76a,var(--yellow))}
.btn.danger{background:linear-gradient(#ff9a8a,var(--red));color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- 選択リスト ---------- */
.pick{display:flex;flex-direction:column;gap:6px}
.pickbtn{
  display:flex;align-items:center;gap:8px;text-align:left;width:100%;
  background:var(--paper3);border:3px solid var(--ink);border-radius:8px;
  box-shadow:0 3px 0 rgba(74,47,26,.5);padding:6px 8px;font-size:13px;
}
.pickbtn:hover:not(:disabled){background:#fff6da}
.pickbtn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.pickbtn:disabled{opacity:.42;cursor:not-allowed}
.pickbtn.done{opacity:.9;box-shadow:none;background:var(--paper2)}
.pickbtn.small{flex:1;justify-content:center;font-size:11px;padding:4px}
.pb-ic{width:30px;height:30px;display:flex;align-items:center;justify-content:center;
       border:2px solid var(--ink);border-radius:6px;font-size:16px;flex-shrink:0}
.pb-ic.face-ic{border:none;padding:0;width:auto;height:auto}
.pb-ic.face-ic .face{width:30px;height:30px}
.pb-body{flex:1;display:flex;flex-direction:column;line-height:1.35;min-width:0}
.pb-body small{font-size:10px;opacity:.72;font-weight:normal}
.pb-cost{font-size:11px;text-align:right;white-space:nowrap;line-height:1.3}
.pb-cost em{font-style:normal;opacity:.65;font-size:9px}
.mini{background:linear-gradient(#fff8e3,#e8d8ae);border:2px solid var(--ink);
      border-radius:5px;font-size:10px;padding:2px 6px}
.mini.danger{background:linear-gradient(#ff9a8a,var(--red));color:#fff}
.bigbox{background:var(--paper3);border:3px dashed var(--ink2);border-radius:8px;
        padding:10px;text-align:center;font-size:14px;margin:8px 0}
.bigbox b{font-size:24px;color:var(--red)}
.fld{display:block;font-size:13px;margin:10px 0}
.fld input{display:block;width:100%;margin-top:4px;font-family:inherit;font-size:15px;
           padding:6px 8px;border:3px solid var(--ink);border-radius:7px;background:var(--paper3);color:inherit}
.colors{display:flex;gap:6px;margin-top:5px}
.colorbtn{width:34px;height:34px;border:3px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 rgba(74,47,26,.5)}
.colorbtn.on{outline:3px solid var(--yellow);outline-offset:2px;transform:translateY(2px)}
.titlewrap{text-align:left}

/* ---------- トレーニング／作戦 ---------- */
.trainrow,.stratrow{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;
                    background:var(--paper3);border:2px solid var(--ink);border-radius:8px;padding:6px}
.tr-nm,.sr-nm{width:120px;font-size:12px;display:flex;flex-direction:column;line-height:1.25}
.tr-nm small,.sr-nm small{font-size:9px;opacity:.65}
.tr-btns,.sr-btns{flex:1;display:flex;gap:4px}
.stratbtn{flex:1;background:#f0e4c4;border:3px solid var(--ink);border-radius:7px;
          font-size:10px;padding:4px 2px;line-height:1.3;box-shadow:0 3px 0 rgba(74,47,26,.4)}
.stratbtn.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(3px);box-shadow:0 0 0}

/* ---------- 結果表 ---------- */
.racehead{background:var(--ink);color:#ffeec4;border-radius:8px;padding:6px 10px;
          margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.racehead b{font-size:15px}
.racehead span{font-size:11px;opacity:.85}
.gridlist{display:flex;flex-direction:column;gap:2px;max-height:44vh;overflow-y:auto}
.gridrow{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--paper3);
         border:2px solid var(--ink);border-radius:6px;padding:2px 6px}
.gridrow.me{background:#fff2c4;font-weight:bold;border-width:3px}
.gridrow.dnf{opacity:.5}
.gp-pos{width:24px;text-align:center;font-weight:bold;border-radius:4px}
.gp-pos.gold{background:var(--yellow);border:2px solid var(--ink)}
.gp-pos.silver{background:#dcdcdc;border:2px solid var(--ink)}
.gp-pos.bronze{background:#d89a5c;border:2px solid var(--ink)}
.gp-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-tm{width:132px;font-size:10px;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gp-mv{width:34px;text-align:center;font-size:10px;opacity:.75}
.gp-mv.up{color:#2e8b30;opacity:1}
.gp-mv.down{color:#d02020;opacity:1}
.gp-t{width:72px;text-align:right;font-size:11px}
.rewardbox{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;background:var(--paper3);
           border:3px dashed var(--ink2);border-radius:8px;padding:8px;font-size:12px}
.rewardbox div{flex:1;min-width:120px;text-align:center}
.rewardbox b{display:block;font-size:16px}
.note{background:#fff8e0;border-left:5px solid var(--yellow);border-radius:0 6px 6px 0;
      padding:5px 8px;font-size:12px;margin-top:6px}
.note.big{background:linear-gradient(90deg,#fff0a0,#ffd76a);font-size:14px;text-align:center;
          border-left:none;border:3px solid var(--ink);border-radius:8px}
.hist{font-size:11px;background:var(--paper3);border:2px solid var(--ink);border-radius:6px;
      padding:4px 7px;margin-bottom:4px;line-height:1.5}

/* ================= レース画面 ================= */
#raceScreen{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;background:rgba(30,18,8,.86);display:none;
            align-items:center;justify-content:center;z-index:60;
            padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right))
                    calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
#raceScreen.show{display:flex}
.rv-wrap{width:100%;max-width:900px;max-height:96vh;display:flex;flex-direction:column;gap:6px;
         background:var(--paper);border:4px solid var(--ink);border-radius:12px;padding:8px;
         box-shadow:0 6px 0 rgba(0,0,0,.4)}
.rv-head{display:flex;align-items:center;gap:10px;background:var(--ink);color:#ffeec4;
         border-radius:7px;padding:5px 10px;font-size:13px}
.rv-head b{flex:1}
.rv-head #rvLap{background:var(--red);color:#fff;border-radius:5px;padding:1px 8px;font-size:14px}
.rv-body{display:flex;gap:6px;min-height:0}
.rv-canvaswrap{position:relative;flex-shrink:0;max-width:100%}
#raceCanvas{display:block;border:3px solid var(--ink);border-radius:8px;
            image-rendering:-webkit-optimize-contrast;image-rendering:pixelated;
            max-width:100%;background:#7fbf5a}
.rv-cam{position:absolute;right:6px;bottom:6px;display:flex;gap:4px}
.rv-cam button{background:rgba(255,248,227,.9);border:2px solid var(--ink);border-radius:6px;
               font-size:10px;padding:3px 7px;font-weight:bold;box-shadow:0 2px 0 rgba(74,47,26,.5)}
.rv-cam button.on{background:linear-gradient(#ffd76a,var(--yellow));transform:translateY(2px);box-shadow:0 0 0}
.rv-side{flex:1;display:flex;flex-direction:column;border:3px solid var(--ink);
         border-radius:8px;overflow:hidden;background:var(--paper3);min-width:150px}
.rv-order-h{background:var(--ink2);color:#ffeec4;font-size:11px;padding:2px 6px;flex-shrink:0}
.rv-order{flex:1;overflow-y:auto;padding:2px}
.rv-row{display:flex;align-items:center;gap:4px;font-size:10px;padding:1px 3px;border-radius:3px}
.rv-row.me{background:#fff2c4;font-weight:bold}
.rv-row.out{opacity:.4;text-decoration:line-through}
.rv-pos{width:16px;text-align:right}
.rv-chip{width:8px;height:8px;border:1px solid var(--ink);border-radius:2px;flex-shrink:0}
.rv-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-gap{font-size:9px;opacity:.75}
.rv-sectors{background:#241a12;border:3px solid var(--ink);border-radius:8px;padding:3px 5px;
            display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.sc-row{display:flex;align-items:center;gap:4px;font-size:11px;color:#ffeec4;
        font-variant-numeric:tabular-nums}
.sc-row.best{border-top:1px dashed rgba(255,238,196,.3);padding-top:2px;opacity:.9}
.sc-nm{flex:1;display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;
       text-overflow:ellipsis;white-space:nowrap;font-size:10px}
.sc-nm i{width:8px;height:8px;border:1px solid #000;border-radius:2px;flex-shrink:0;display:inline-block}
.sc-ty{display:inline-flex;align-items:center;gap:3px;width:96px;flex-shrink:0}
.sc-ty b{width:16px;height:16px;border-radius:50%;border:1px solid #000;display:flex;
         align-items:center;justify-content:center;font-size:9px;flex-shrink:0}
.sc-ty i{flex:1;height:7px;background:rgba(255,255,255,.18);border-radius:4px;overflow:hidden;display:block}
.sc-ty i u{display:block;height:100%;text-decoration:none;transition:width .4s}
.sc-ty em{font-style:normal;font-size:9px;opacity:.8;width:26px;text-align:right}
.sc-ty.old i u{background:#f0a020 !important}
.sc-ty.worn i u{background:#e04a3f !important}
.sc-ty.worn b{animation:blink 1s steps(2,end) infinite}
.sc-t{width:56px;text-align:right;color:#e8dcc0}
.sc-t.green{color:#6cf06c;font-weight:bold}
.sc-t.purple{color:#d88cff;font-weight:bold}
.sc-t.old{opacity:.42;font-weight:normal}
.sc-lap{width:74px;text-align:right;color:#fff;font-weight:bold}

.rv-loglist{height:74px;overflow-y:auto;background:#2b1c0e;border:3px solid var(--ink);
            border-radius:8px;padding:4px 6px;display:flex;flex-direction:column;gap:2px}
.rv-ev{font-size:11px;color:#ffe9a8;line-height:1.4}
.rv-ev.rv-pass{color:#8ef08e}
.rv-ev.rv-dnf{color:#ff9a8a}
.rv-ev.rv-pit{color:#8ecfff}
.rv-ctrl{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- エラー表示 ---------- */
#fatalBox{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;z-index:200;
          background:rgba(40,20,10,.9);display:flex;align-items:center;justify-content:center;padding:16px}
.fatal-inner{max-width:560px;width:100%;background:var(--paper);border:4px solid var(--red);
             border-radius:12px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.4)}
.fatal-inner b{font-size:16px;display:block;margin-bottom:6px}
.fatal-inner p{font-size:12px;margin-bottom:8px}
.fatal-inner code{display:block;background:#2b1c0e;color:#ffd8a8;border-radius:8px;padding:8px;
                  font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:38vh;overflow:auto;
                  -webkit-user-select:text;user-select:text}
#fatalClose{margin-top:10px;width:100%;background:linear-gradient(#fff8e3,#e8d8ae);
            border:3px solid var(--ink);border-radius:8px;padding:8px;font-weight:bold}

/* ================= トースト・ポップ ================= */
#toastLayer{position:fixed;top:0;right:0;bottom:0;left:0;inset:0;pointer-events:none;z-index:80;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding-top:calc(60px + env(safe-area-inset-top))}
.toast{
  flex-shrink:0;
  background:var(--paper);border:3px solid var(--ink);border-radius:9px;
  box-shadow:0 4px 0 var(--ink);padding:7px 16px;font-size:13px;
  animation:drop .25s cubic-bezier(.3,1.6,.5,1);max-width:92vw;text-align:center;
}
.toast.good{background:linear-gradient(#fff4c0,#ffe88a)}
.toast.bad{background:linear-gradient(#ffd0c8,#ffb0a0)}
.toast.warn{background:linear-gradient(#fff0c0,#ffd98a)}
.toast.out{animation:fadeup .4s forwards}
@keyframes drop{from{transform:translateY(-26px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fadeup{to{transform:translateY(-18px);opacity:0}}
.numpop{
  position:absolute;top:110px;font-size:22px;font-weight:bold;color:var(--green);
  text-shadow:2px 2px 0 var(--outline),-2px -2px 0 var(--outline),2px -2px 0 var(--outline),-2px 2px 0 var(--outline);
  animation:floatup 1.4s ease-out forwards;
}
.numpop.crit{color:var(--red);font-size:28px}
@keyframes floatup{0%{transform:translateY(20px);opacity:0}
  20%{opacity:1}100%{transform:translateY(-46px);opacity:0}}

/* ================= レスポンシブ ================= */
@media (max-width:860px), (hover:none) and (pointer:coarse){
  html,body{overflow:auto}
  #app{height:auto;min-height:100%}
  .main{display:block}
  .col-left{grid-template-columns:1fr;overflow:visible;margin-bottom:8px}
  .col-right{overflow:visible}
  .tabbody{max-height:52vh}
  .drvwrap{grid-template-columns:1fr 1fr}
  .gp-tm{display:none}
  .topbar{position:-webkit-sticky;position:sticky;top:0;z-index:20}
  .cmdbar{position:-webkit-sticky;position:sticky;bottom:0;z-index:20;padding-top:6px;
          padding-bottom:env(safe-area-inset-bottom);
          background:linear-gradient(transparent,rgba(201,168,106,.9) 30%)}
  .cmd{min-height:52px}
  .btn{min-height:44px}
  /* 上部バーが2段になるぶん、通知を下げて重ならないようにする */
  #toastLayer{padding-top:calc(104px + env(safe-area-inset-top))}
  .numpop{top:calc(150px + env(safe-area-inset-top))}
  .rv-body{flex-direction:column;align-items:center}
  .rv-canvaswrap{width:100%}
  #raceCanvas{width:100%;height:auto}
  .rv-cam button{font-size:9px;padding:2px 5px}
  .rv-side{width:100%;min-height:110px;max-height:130px}
  .sc-t{width:48px;font-size:10px}
  .sc-ty{width:64px}
  .sc-ty em{display:none}
  .sc-ers{width:40px}
  .sc-lap{width:60px;font-size:10px}
  .btn{min-width:0;font-size:12px;padding:6px 4px}
}
@media (max-width:520px){
  body{font-size:13px}
  .drvwrap{grid-template-columns:1fr}
  .cmd{min-width:60px;font-size:11px}
  .cmd span{font-size:17px}
  .tb-stats{width:100%;margin-left:0}
}

/* =========================================================
   HD-2Dスキン（オクトパストラベラー風）
   紙の色を沈ませ、金の枠と光で立体感を出す。
   カイロ風の配色は :root にそのまま残してあるので、
   data-skin を外せばいつでも元に戻る。
   ========================================================= */
[data-skin="hd"]{
  --ink:#0e0b14;          /* 枠は黒に近い紫。金と組んで沈む */
  --ink2:#2a2038;
  --paper:#241c30;        /* パネルの面 */
  --paper2:#1b1526;
  --paper3:#2f2540;
  --trough:#120e1c;
  --board:#0a0810;
  --board2:#141020;
  --hilite:rgba(214,178,106,.55);   /* 枠の内側に走る金の線 */
  --outline:#0e0b14;
  --gold:#d6b26a;
  --gold2:#8d6d38;
  --headbg:linear-gradient(180deg,#3b2f4e,#241c30);
  --headbg2:linear-gradient(180deg,#3b2f4e,#241c30);
  --headfg:#f2dfae;
  --glow:rgba(214,178,106,.30);
  --shine:0 0 12px rgba(214,178,106,.22);
  color:#efe4cf;
}

/* ---- 背景：暗い舞台。中央に光を残して四隅を落とす ---- */
[data-skin="hd"] body,
body[data-skin="hd"]{
  background:#0a0810;
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgba(96,74,140,.34) 0%, rgba(10,8,16,0) 62%),
    radial-gradient(90% 70% at 50% 108%, rgba(190,132,60,.20) 0%, rgba(10,8,16,0) 60%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.022) 0 1px, transparent 1px 4px);
  color:#efe4cf;
}

/* ---- パネル：面を沈め、金の細枠と外側の光を足す ---- */
[data-skin="hd"] .card,
[data-skin="hd"] .frame,
[data-skin="hd"] .topbar,
[data-skin="hd"] .modal-box,
[data-skin="hd"] .cmdbar{
  background:linear-gradient(180deg,#2b2239 0%,#1d1729 100%);
  border-color:var(--gold2);
  box-shadow:
    0 0 0 1px rgba(0,0,0,.9),
    inset 0 0 0 1px rgba(214,178,106,.34),
    inset 0 18px 34px rgba(120,92,170,.13),
    0 6px 20px rgba(0,0,0,.72),
    var(--shine);
}

/* 見出しは金の下線で仕切る */
[data-skin="hd"] .card-h{
  border-bottom:1px solid var(--gold2);
  box-shadow:inset 0 -1px 0 rgba(214,178,106,.30), inset 0 1px 0 rgba(214,178,106,.16);
  text-shadow:0 0 8px rgba(214,178,106,.45),1px 1px 0 rgba(0,0,0,.6);
  letter-spacing:.04em;
}

/* ---- 四隅の飾り。オクトパスのメニュー枠の要 ---- */
[data-skin="hd"] .card{position:relative}
[data-skin="hd"] .card::before,
[data-skin="hd"] .card::after{
  content:'';position:absolute;width:9px;height:9px;pointer-events:none;z-index:2;
  border:2px solid var(--gold);opacity:.72;
}
[data-skin="hd"] .card::before{top:3px;left:3px;border-right:0;border-bottom:0}
[data-skin="hd"] .card::after{bottom:3px;right:3px;border-left:0;border-top:0}

/* ---- ゲージ：深く掘った溝に、光る帯を通す ---- */
[data-skin="hd"] .p-bar,
[data-skin="hd"] .reqrow i,
[data-skin="hd"] .skbar,
[data-skin="hd"] .battr i,
[data-skin="hd"] .hypebar,
[data-skin="hd"] .lvbar i b{
  background:var(--trough);
  border-color:rgba(214,178,106,.34);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.85);
}
[data-skin="hd"] .p-bar b,
[data-skin="hd"] .reqrow i b,
[data-skin="hd"] .skbar i,
[data-skin="hd"] .battr i b,
[data-skin="hd"] .hypebar b,
[data-skin="hd"] .lvbar i b.on{
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), 0 0 8px rgba(255,210,120,.40);
  filter:saturate(1.25) brightness(1.12);
}

/* ---- 数字と見出しは、わずかに金色に灯す ---- */
[data-skin="hd"] .tb-stats b,
[data-skin="hd"] .score,
[data-skin="hd"] .lead{
  color:#ffe9b0;
  text-shadow:0 0 10px rgba(255,200,90,.42);

  border-left:3px solid var(--gold);
  text-shadow:0 0 7px rgba(214,178,106,.40);

/* ---- ボタン：面は暗いまま、縁と天面のハイライトで浮かせる ---- */

<script>
/* ===== src/sound.js ===== */
/* =========================================================
   効果音
   音声ファイルを持たず、Web Audio でその場で合成する。
   オフラインでもそのまま鳴り、リポジトリも軽いままにできる。
   ========================================================= */
window.GP = window.GP || {};

GP.sound = (function () {
  'use strict';
  const KEY = 'gp_sound_on';
  let ctx = null, master = null, on = true, last = 0;

  try { on = localStorage.getItem(KEY) !== '0'; } catch (e) {}

  /* ブラウザの制限で、最初の操作があるまで音は出せない */
  function ensure() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0.22;
    master.connect(ctx.destination);
    return ctx;
  }

  /* 単音。fromからtoへ滑らかに動かせる */
  function tone(opt) {
    if (!on) return;
    const c = ensure();
    if (!c) return;
    const t0 = c.currentTime + (opt.at || 0);
    const dur = opt.dur || 0.09;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = opt.type || 'square';
    osc.frequency.setValueAtTime(opt.from, t0);
    if (opt.to && opt.to !== opt.from) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opt.to), t0 + dur);
    const vol = (opt.vol == null ? 1 : opt.vol);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.02);
  }

  /* ノイズ（かすれた音・走行音）*/
  function noise(opt) {
    if (!on) return;
    const c = ensure();
    if (!c) return;
    const dur = opt.dur || 0.15;
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = c.createBufferSource();
    src.buffer = buf;
    const f = c.createBiquadFilter();
    f.type = 'bandpass';
    f.frequency.setValueAtTime(opt.from || 800, c.currentTime);
    if (opt.to) f.frequency.exponentialRampToValueAtTime(opt.to, c.currentTime + dur);
    f.Q.value = opt.q || 1.2;
    const g = c.createGain();
    g.gain.value = opt.vol == null ? 0.6 : opt.vol;
    src.connect(f); f.connect(g); g.connect(master);
    src.start();
  }

  const N = { C4: 261.6, D4: 293.7, E4: 329.6, F4: 349.2, G4: 392.0, A4: 440.0, B4: 493.9,
              C5: 523.3, D5: 587.3, E5: 659.3, F5: 698.5, G5: 784.0, A5: 880.0, B5: 987.8,
              C6: 1046.5, E6: 1318.5, G6: 1568.0 };

  /* ---------- 効果音の定義 ---------- */
  const SFX = {
    click:   () => tone({ from: N.E5, dur: 0.05, vol: 0.5 }),
    tap:     () => tone({ from: N.C5, dur: 0.04, vol: 0.4 }),
    cancel:  () => { tone({ from: N.G4, dur: 0.07, vol: 0.5 }); tone({ from: N.C4, dur: 0.09, vol: 0.5, at: 0.06 }); },
    confirm: () => { tone({ from: N.C5, dur: 0.06, vol: 0.6 }); tone({ from: N.G5, dur: 0.10, vol: 0.6, at: 0.055 }); },
    coin:    () => { tone({ from: N.B5, dur: 0.05, vol: 0.5 }); tone({ from: N.E6, dur: 0.12, vol: 0.5, at: 0.05 }); },
    levelup: () => [N.C5, N.E5, N.G5, N.C6].forEach((f, i) => tone({ from: f, dur: 0.11, vol: 0.55, at: i * 0.065 })),
    crit:    () => { [N.G5, N.C6, N.E6, N.G6].forEach((f, i) => tone({ from: f, dur: 0.13, vol: 0.6, at: i * 0.055 }));
                     tone({ from: N.G6, to: N.C6, dur: 0.25, vol: 0.4, at: 0.24, type: 'triangle' }); },
    build:   () => { noise({ from: 300, to: 120, dur: 0.22, vol: 0.5, q: 0.8 });
                     tone({ from: N.C4, to: N.C5, dur: 0.28, vol: 0.5, type: 'triangle' }); },
    upgrade: () => { [N.E5, N.G5, N.C6].forEach((f, i) => tone({ from: f, dur: 0.12, vol: 0.55, at: i * 0.07 }));
                     noise({ from: 900, to: 300, dur: 0.3, vol: 0.35 }); },
    light:   () => tone({ from: N.A4, dur: 0.14, vol: 0.7, type: 'square' }),
    go:      () => { tone({ from: N.A5, dur: 0.30, vol: 0.8 });
                     noise({ from: 500, to: 2200, dur: 0.45, vol: 0.5, q: 0.7 }); },
    pass:    () => noise({ from: 1600, to: 400, dur: 0.20, vol: 0.45, q: 2.2 }),
    pit:     () => { noise({ from: 2400, to: 2400, dur: 0.18, vol: 0.35, q: 6 });
                     tone({ from: N.E4, dur: 0.08, vol: 0.4, type: 'sawtooth', at: 0.16 }); },
    dnf:     () => { tone({ from: N.E4, to: N.C4 * 0.6, dur: 0.45, vol: 0.6, type: 'sawtooth' });
                     noise({ from: 600, to: 100, dur: 0.4, vol: 0.4 }); },
    win:     () => { [N.C5, N.E5, N.G5, N.C6, N.G5, N.C6].forEach((f, i) =>
                       tone({ from: f, dur: i === 5 ? 0.45 : 0.14, vol: 0.65, at: i * 0.13 })); },
    podium:  () => [N.G4, N.C5, N.E5].forEach((f, i) => tone({ from: f, dur: 0.16, vol: 0.6, at: i * 0.1 })),
    bad:     () => { tone({ from: N.D4, dur: 0.16, vol: 0.5, type: 'triangle' });
                     tone({ from: N.B4 * 0.5, dur: 0.24, vol: 0.5, type: 'triangle', at: 0.14 }); },
    warn:    () => { tone({ from: N.A4, dur: 0.09, vol: 0.5 }); tone({ from: N.A4, dur: 0.09, vol: 0.5, at: 0.13 }); }
  };

  /* 連打で音が団子にならないよう間引く */
  function play(name, minGap) {
    if (!on || !SFX[name]) return;
    const now = performance.now();
    if (minGap && now - last < minGap) return;
    last = now;
    try { SFX[name](); } catch (e) {}
  }

  function setOn(v) {
    on = !!v;
    try { localStorage.setItem(KEY, on ? '1' : '0'); } catch (e) {}
    if (on) { ensure(); play('click'); }
  }
  function isOn() { return on; }
  function unlock() { if (on) ensure(); }

  return { play, setOn, isOn, unlock };
})();

</script>
<script>
/* ===== src/fx.js ===== */
/* =========================================================
   HD-2D風のポストエフェクト
   ドット絵はドット絵のまま、上から光と空気を足して立体感を出す。
     1. ブルーム   明るい色だけがにじんで光る
     2. 被写界深度 カメラが見ていない所がぼける（ジオラマ感）
     3. 色調      ハイライトを暖色に、影を寒色に寄せる
     4. 周辺減光   画面の四隅を落として中央に目を向けさせる
     5. 粒子      火花・砂ぼこり・水しぶき
   canvas 2D の filter と合成モードだけで作れるので、追加ライブラリは要らない。
   ========================================================= */
window.GP = window.GP || {};

GP.fx = (function () {
  'use strict';

  let W = 0, H = 0;
  let scene = null, sctx = null;      // 世界を一度描き込む場所
  let half = null, hctx = null;       // ブルーム抽出用（半分の解像度）
  let half2 = null, h2ctx = null;
  let mask = null, mctx = null;       // 被写界深度の合焦マスク
  let ready = false;

  function make(w, h) {
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(w)); c.height = Math.max(1, Math.round(h));
    return c;
  }

  /* 端末が canvas の filter に対応しているか（Safari 14 未満などは非対応） */
  let blurOK = null;
  function supportsBlur() {
    if (blurOK !== null) return blurOK;
    try {
      const g = make(2, 2).getContext('2d');
      g.filter = 'blur(1px)';
      blurOK = g.filter === 'blur(1px)';
    } catch (e) { blurOK = false; }
    return blurOK;
  }

  function init(w, h) {
    W = w; H = h;
    scene = make(W, H); sctx = scene.getContext('2d');
    half = make(W / 2, H / 2); hctx = half.getContext('2d');
    half2 = make(W / 2, H / 2); h2ctx = half2.getContext('2d');
    mask = make(W, H); mctx = mask.getContext('2d');
    sctx.imageSmoothingEnabled = false;
    ready = true;
    parts.length = 0;
    return sctx;
  }

  /* 世界を描き込む先。raceview はここに今まで通り描くだけでよい */
  function begin() {
    if (!ready) return null;
    sctx.setTransform(1, 0, 0, 1, 0, 0);
    sctx.globalAlpha = 1;
    sctx.globalCompositeOperation = 'source-over';
    sctx.clearRect(0, 0, W, H);
    return sctx;
  }

  /* ---------- 明るい所だけを取り出す ----------
     同じ絵を multiply で重ねると色が2乗される。暗い色は急速に沈み、
     白や黄色だけが残るので、しきい値処理の代わりになる。          */
  function extract(strength) {
    hctx.setTransform(1, 0, 0, 1, 0, 0);
    hctx.globalCompositeOperation = 'source-over';
    hctx.globalAlpha = 1;
    hctx.clearRect(0, 0, half.width, half.height);
    hctx.drawImage(scene, 0, 0, half.width, half.height);
    hctx.globalCompositeOperation = 'multiply';
    hctx.drawImage(half, 0, 0);          // 2乗
    hctx.drawImage(half, 0, 0);          // 4乗（中間色はほぼ黒に落ちる）
    hctx.globalCompositeOperation = 'source-over';
    // 光らせたいものを明示的に足す（ブレーキ灯やシグナルなど）
    if (adds.length) {
      hctx.save();
      hctx.scale(0.5, 0.5);
      for (let i = 0; i < adds.length; i++) adds[i](hctx);
      hctx.restore();
    }
    return strength;
  }

  /* 追加で光らせたいものを毎フレーム登録する */
  const adds = [];
  function addLight(fn) { if (ready) adds.push(fn); }

  /* ---------- 被写界深度 ----------
     focus が指す一点のまわりだけを鮮明に残し、外側をぼかす。
     ぼけた絵を敷いてから、鮮明な絵を円形マスクで抜いて重ねる。   */
  function depthOfField(out, focus, radius, blurPx) {
    out.save();
    out.filter = 'blur(' + blurPx.toFixed(1) + 'px)';
    out.drawImage(scene, 0, 0);
    out.filter = 'none';
    out.restore();

    mctx.setTransform(1, 0, 0, 1, 0, 0);
    mctx.globalCompositeOperation = 'source-over';
    mctx.clearRect(0, 0, W, H);
    mctx.drawImage(scene, 0, 0);
    mctx.globalCompositeOperation = 'destination-in';
    const g = mctx.createRadialGradient(focus.x, focus.y, radius * 0.25, focus.x, focus.y, radius);
    g.addColorStop(0, 'rgba(0,0,0,1)');
    g.addColorStop(0.62, 'rgba(0,0,0,.92)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    mctx.fillStyle = g;
    mctx.fillRect(0, 0, W, H);
    mctx.globalCompositeOperation = 'source-over';
    out.drawImage(mask, 0, 0);
  }

  /* ---------- 仕上げ ----------
     opt = { focus:{x,y}, dof:0..1, bloom:0..1, warm:0..1, vignette:0..1, night:bool } */
  function composite(out, opt) {
    if (!ready) return;
    opt = opt || {};
    const soft = supportsBlur();
    out.setTransform(1, 0, 0, 1, 0, 0);
    out.globalCompositeOperation = 'source-over';
    out.globalAlpha = 1;
    out.clearRect(0, 0, W, H);

    // 1. 本体（必要なら被写界深度つき）
    const dof = opt.dof || 0;
    if (soft && dof > 0.01 && opt.focus) {
      depthOfField(out, opt.focus, opt.focusR || W * 0.34, 1.2 + dof * 2.6);
    } else {
      out.drawImage(scene, 0, 0);
    }

    // 2. ブルーム（広いにじみ＋狭い芯の二段）
    const bl = opt.bloom == null ? 1 : opt.bloom;
    if (bl > 0.01) {
      extract();
      if (soft) {
        h2ctx.setTransform(1, 0, 0, 1, 0, 0);
        h2ctx.globalCompositeOperation = 'source-over';
        h2ctx.clearRect(0, 0, half2.width, half2.height);
        h2ctx.filter = 'blur(6px)';
        h2ctx.drawImage(half, 0, 0);
        h2ctx.filter = 'none';
        out.globalCompositeOperation = 'lighter';
        out.globalAlpha = 0.30 * bl;
        out.drawImage(half2, 0, 0, W, H);
        out.globalAlpha = 0.18 * bl;
        h2ctx.clearRect(0, 0, half2.width, half2.height);
        h2ctx.filter = 'blur(2px)';
        h2ctx.drawImage(half, 0, 0);
        h2ctx.filter = 'none';
        out.drawImage(half2, 0, 0, W, H);
      } else {
        // filter が使えない端末は、拡大縮小のにじみで代用する
        out.globalCompositeOperation = 'lighter';
        out.globalAlpha = 0.24 * bl;
        out.imageSmoothingEnabled = true;
        out.drawImage(half, -3, -3, W + 6, H + 6);
        out.imageSmoothingEnabled = false;
      }
      out.globalAlpha = 1;
      out.globalCompositeOperation = 'source-over';
    }

    // 3. 色調
    //    影側を色のついた暗さで沈め（multiply）、そのうえで明暗差を立てる（overlay）。
    //    soft-light だと全体が眠くなるので使わない。
    const warm = opt.warm == null ? 1 : opt.warm;
    if (warm > 0.01) {
      const sh = out.createLinearGradient(W * 0.75, 0, W * 0.15, H);
      if (opt.night) {
        sh.addColorStop(0, 'rgba(255,255,255,0)');
        sh.addColorStop(1, 'rgba(96,110,190,' + (0.30 * warm).toFixed(3) + ')');
      } else {
        sh.addColorStop(0, 'rgba(255,255,255,0)');
        sh.addColorStop(1, 'rgba(104,96,168,' + (0.26 * warm).toFixed(3) + ')');
      }
      out.globalCompositeOperation = 'multiply';
      out.fillStyle = sh;
      out.fillRect(0, 0, W, H);

      const hi = out.createLinearGradient(0, 0, W * 0.7, H);
      hi.addColorStop(0, 'rgba(255,206,132,' + (0.30 * warm).toFixed(3) + ')');
      hi.addColorStop(0.5, 'rgba(128,128,128,0)');
      hi.addColorStop(1, 'rgba(52,86,166,' + (0.26 * warm).toFixed(3) + ')');
      out.globalCompositeOperation = 'overlay';
      out.fillStyle = hi;
      out.fillRect(0, 0, W, H);
      out.globalCompositeOperation = 'source-over';
    }

    // 4. 周辺減光
    const vg = opt.vignette == null ? 1 : opt.vignette;
    if (vg > 0.01) {
      const r = out.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.30, W / 2, H / 2, Math.max(W, H) * 0.72);
      r.addColorStop(0, 'rgba(0,0,0,0)');
      r.addColorStop(1, 'rgba(24,12,30,' + (0.46 * vg).toFixed(3) + ')');
      out.fillStyle = r;
      out.fillRect(0, 0, W, H);
    }
    adds.length = 0;
  }

  /* =========================================================
     粒子（火花・砂ぼこり・水しぶき）
     ========================================================= */
  const parts = [];
  const MAX = 220;

  function spawn(x, y, kind, ang, power) {
    if (!ready || parts.length >= MAX) return;
    power = power == null ? 1 : power;
    const n = kind === 'spark' ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const sp = (kind === 'spark' ? 26 : 12) * (0.5 + Math.random()) * power;
      const a = ang + (Math.random() - 0.5) * (kind === 'spark' ? 0.9 : 1.9);
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: kind === 'spark' ? 0.30 + Math.random() * 0.22
            : kind === 'spray' ? 0.44 + Math.random() * 0.3
            : 0.6 + Math.random() * 0.4,
        age: 0, kind: kind,
        sz: kind === 'dust' ? 1.6 + Math.random() * 2.2 : 1 + Math.random()
      });
    }
  }

  function stepParticles(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.age += dt;
      if (p.age >= p.life) { parts.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      const drag = p.kind === 'spark' ? 0.90 : 0.94;
      p.vx *= drag; p.vy *= drag;
      if (p.kind === 'dust') { p.sz += dt * 5; }
    }
  }

  /* 粒子はカメラ変換の中で描く（世界座標） */
  function drawParticles(g) {
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const k = 1 - p.age / p.life;
      if (p.kind === 'spark') {
        g.fillStyle = 'rgba(255,' + Math.round(150 + 105 * k) + ',80,' + (0.9 * k).toFixed(2) + ')';
        g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
      } else if (p.kind === 'spray') {
        g.fillStyle = 'rgba(215,235,255,' + (0.5 * k).toFixed(2) + ')';
        g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
      } else {
        g.fillStyle = 'rgba(206,186,150,' + (0.42 * k).toFixed(2) + ')';
        g.fillRect(Math.round(p.x), Math.round(p.y), p.sz, p.sz);
      }
    }
  }

  function clearParticles() { parts.length = 0; }
  function count() { return parts.length; }

  return { init, begin, composite, addLight, spawn, stepParticles, drawParticles,
           clearParticles, count, supportsBlur };
})();

<script>
/* ===== src/geom.js ===== */
/* =========================================================
   コース幾何の解析
   サーキット形状から曲率・コーナー・ストレートを求め、
   描画（raceview）とレース計算（race）の両方で共有する
   ========================================================= */
window.GP = window.GP || {};

GP.geom = (function () {
  'use strict';

  const SUB = 14;              // 制御点あたりの分割数
  const cache = {};
  const polyCache = {};

  /* 解析用の正規化ポリライン（1000x1000）。形状だけで決まるので使い回す */
  function polyOf(track) {
    if (!polyCache[track.name]) polyCache[track.name] = buildPoly(track.path, 1000, 1000, 0);
    return polyCache[track.name];
  }

  /* ---------- Catmull-Rom で閉ループを滑らかに再サンプル ---------- */
  function buildPoly(path, w, h, pad) {
    const p = path.map(pt => [pad + pt[0] * (w - pad * 2), pad + pt[1] * (h - pad * 2)]);
    const n = p.length, out = [];
    const at = i => p[(i % n + n) % n];
    for (let i = 0; i < n; i++) {
      const p0 = at(i - 1), p1 = at(i), p2 = at(i + 1), p3 = at(i + 2);
      for (let s = 0; s < SUB; s++) {
        const t = s / SUB, t2 = t * t, t3 = t2 * t;
        out.push([
          0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
          0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)
        ]);
      }
    }
    const N = out.length;
    const ds = new Float64Array(N);   // 各点から次の点までの長さ
    const cum = new Float64Array(N + 1);
    let len = 0;
    for (let i = 0; i < N; i++) {
      const a = out[i], b = out[(i + 1) % N];
      ds[i] = Math.hypot(b[0] - a[0], b[1] - a[1]);
      cum[i] = len;
      len += ds[i];
    }
    cum[N] = len;
    return { pts: out, ds: ds, cum: cum, len: len, n: N };
  }

  /* ---------- 曲率（進行方向の変化量／距離）---------- */
  function curvature(poly) {
    const N = poly.n, k = new Float64Array(N);
    const ang = new Float64Array(N);
    for (let i = 0; i < N; i++) {
      const a = poly.pts[i], b = poly.pts[(i + 1) % N];
      ang[i] = Math.atan2(b[1] - a[1], b[0] - a[0]);
    }
    for (let i = 0; i < N; i++) {
      let d = ang[(i + 1) % N] - ang[i];
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      k[i] = Math.abs(d) / Math.max(0.5, poly.ds[i]);
    }
    // 前後にならして、分割の粗さによるギザつきを消す
    const sm = new Float64Array(N);
    const W = 3;
    for (let i = 0; i < N; i++) {
      let acc = 0;
      for (let j = -W; j <= W; j++) acc += k[(i + j + N * 2) % N];
      sm[i] = acc / (W * 2 + 1);
    }
    return sm;
  }

  /* ---------- コース解析（コーナー・ストレート・DRS区間）---------- */
  function analyze(track) {
    if (cache[track.name]) return cache[track.name];
    const poly = polyOf(track);
    const k = curvature(poly);
    const N = poly.n;

    // 全コースで同じ基準になるよう、絶対値で正規化する
    // （1000x1000で描いたときの実測レンジ 0.000〜0.032 が根拠）
    const K_REF = 0.030;
    const norm = new Float64Array(N);
    for (let i = 0; i < N; i++) norm[i] = Math.min(1, k[i] / K_REF);

    // 曲率がしきい値を超える区間をコーナーとしてまとめる
    const CORNER = 0.0085 / K_REF;
    const corners = [];
    let i = 0, guard = 0;
    while (norm[i] > CORNER && guard++ < N) i = (i + 1) % N;   // 直線から数え始める
    const start = i;
    let run = null;
    for (let step = 0; step < N; step++) {
      const idx = (start + step) % N;
      if (norm[idx] > CORNER) {
        if (!run) run = { from: idx, to: idx, peak: norm[idx], len: poly.ds[idx] };
        else { run.to = idx; run.peak = Math.max(run.peak, norm[idx]); run.len += poly.ds[idx]; }
      } else if (run) { corners.push(run); run = null; }
    }
    if (run) corners.push(run);

    // ストレート（コーナーとコーナーの間）
    const straights = [];
    for (let c = 0; c < corners.length; c++) {
      const a = corners[c], b = corners[(c + 1) % corners.length];
      let from = (a.to + 1) % N, len = 0, idx = from, steps = 0;
      while (idx !== b.from && steps++ < N) { len += poly.ds[idx]; idx = (idx + 1) % N; }
      straights.push({ from: from, to: b.from, len: len });
    }
    straights.sort((x, y) => y.len - x.len);
    const longest = straights[0] || { from: 0, to: 0, len: 0 };

    let straightLen = 0;
    for (let j = 0; j < N; j++) if (norm[j] <= CORNER) straightLen += poly.ds[j];

    // セクター境界：1/3・2/3 地点にいちばん近い「直線上の点」に置く
    const bound = [0, 0];
    [1 / 3, 2 / 3].forEach((frac, bi) => {
      const target = poly.len * frac;
      let idx = 0;
      while (idx < N && poly.cum[idx] < target) idx++;
      // コーナーの途中を避け、前後を探して直線に寄せる
      let best = idx, bestK = norm[idx % N];
      for (let d = 1; d <= Math.round(N * 0.06); d++) {
        [(idx + d) % N, (idx - d + N) % N].forEach(j => {
          if (norm[j] < bestK - 0.02) { bestK = norm[j]; best = j; }
        });
      }
      bound[bi] = best;
    });
    const sectors = [
      { from: 0, to: bound[0] },
      { from: bound[0], to: bound[1] },
      { from: bound[1], to: N }
    ];

    const info = {
      kappa: norm,
      n: N,
      sectors: sectors,
      bounds: bound,
      corners: corners,
      straights: straights,
      longest: longest,
      // 全長に占める最長ストレートの割合。追い抜きやすさの根拠になる
      longestShare: poly.len > 0 ? longest.len / poly.len : 0,
      straightShare: poly.len > 0 ? straightLen / poly.len : 0,
      cornerCount: corners.length
    };
    cache[track.name] = info;
    return info;
  }

  /* ---------- 車ごとの速度プロファイル ----------
     コーナーでは曲率と「コーナー性能」で頭打ちになり、
     立ち上がりは「加速性能」、直線の伸びは「最高速性能」で決まる。
     戻り値は各点の通過時刻（1周を 1.0 に正規化した累積）。          */
  function speedProfile(track, stats) {
    const info = analyze(track);
    const poly = polyOf(track);
    const N = poly.n, k = info.kappa;

    const tot = Math.max(1, stats.speed + stats.corner + stats.accel);
    const sp = stats.speed / tot, co = stats.corner / tot, ac = stats.accel / tot;

    // コーナリング上限速度
    const v = new Float64Array(N);
    const vmax = 1 + sp * 1.30;
    for (let i = 0; i < N; i++) {
      v[i] = vmax / (1 + k[i] * (3.4 - co * 2.4));
    }
    // 加速・減速の制限（閉ループなので2周ぶん回して収束させる）
    const accel = 0.055 + ac * 0.075;     // 立ち上がりの鋭さ
    const brake = 0.150 + co * 0.060;     // ブレーキング性能
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < N; i++) {
        const p = (i - 1 + N) % N;
        v[i] = Math.min(v[i], v[p] + accel * poly.ds[p]);
      }
      for (let i = N - 1; i >= 0; i--) {
        const nx = (i + 1) % N;
        v[i] = Math.min(v[i], v[nx] + brake * poly.ds[i]);
      }
    }
    // 通過時刻の累積（1周＝1.0に正規化）
    const cumT = new Float64Array(N + 1);
    let t = 0;
    for (let i = 0; i < N; i++) { cumT[i] = t; t += poly.ds[i] / Math.max(0.05, v[i]); }
    cumT[N] = t;
    for (let i = 0; i <= N; i++) cumT[i] /= t;
    // このマシンが1周のうち各セクターに費やす時間の割合。
    // コーナーの多いセクターはダウンフォース型ほど短くなる。
    const b = info.bounds;
    const share = [cumT[b[0]], cumT[b[1]] - cumT[b[0]], 1 - cumT[b[1]]];
    return { cumT: cumT, v: v, n: N, vmax: vmax, share: share };
  }

  return { buildPoly, polyOf, curvature, analyze, speedProfile };
})();
