    sim: function (g, lv, col, fy, rnd) {
      const n = lv >= 7 ? 2 : 1;
      for (let i = 0; i < n; i++) {
        const x = 70 + i * 170;
        g.fillStyle = '#3a3d46'; g.fillRect(x - 44, fy - 12, 88, 12);       // 土台
        g.fillStyle = '#4e535e';
        for (let k = 0; k < 3; k++) g.fillRect(x - 34 + k * 30, fy - 30, 8, 20);  // 脚
        g.fillStyle = mix(col, -0.22);
        g.beginPath(); g.ellipse(x, fy - 34, 42, 26, 0, Math.PI, 0); g.fill();
        g.fillStyle = col;
        g.beginPath(); g.ellipse(x, fy - 34, 38, 22, 0, Math.PI, 0); g.fill();
        g.fillStyle = 'rgba(255,255,255,.28)';
        g.beginPath(); g.ellipse(x - 10, fy - 42, 16, 8, 0, Math.PI, 0); g.fill();
        g.fillStyle = '#12202c'; g.fillRect(x - 26, fy - 36, 52, 14);        // 画面
        g.fillStyle = 'rgba(120,220,255,.55)';
        g.fillRect(x - 22, fy - 32, 44, 2); g.fillRect(x - 18, fy - 28, 30, 2);
      }
      if (lv >= 3) {                                                         // 解析席
        const dx = W - 130;
        g.fillStyle = '#4a4034'; g.fillRect(dx, fy - 22, 96, 22);
        g.fillStyle = '#241a10'; g.fillRect(dx + 8, fy - 52, 36, 30);
        g.fillStyle = '#12202c'; g.fillRect(dx + 10, fy - 50, 32, 26);
        g.fillStyle = '#241a10'; g.fillRect(dx + 52, fy - 46, 36, 24);
        g.fillStyle = '#12202c'; g.fillRect(dx + 54, fy - 44, 32, 20);
        for (let i = 0; i < 3; i++) {
          g.fillStyle = 'rgba(120,220,255,.6)';
          g.fillRect(dx + 13, fy - 46 + i * 7, 8 + (i * 9) % 20, 2);
        }
      }
      return [150, 250, 340].slice(0, 1 + Math.floor(lv / 4));
    },

    /* マーケティング室：机とスポンサーの壁、トロフィー */
    market: function (g, lv, col, fy, rnd) {
      const desks = Math.min(4, 1 + Math.floor(lv / 2.6));
      for (let i = 0; i < desks; i++) {
        const x = 24 + i * 74;
        g.fillStyle = '#4a4034'; g.fillRect(x, fy - 20, 58, 20);
        g.fillStyle = '#5e5344'; g.fillRect(x + 1, fy - 19, 56, 6);
        g.fillStyle = '#241a10'; g.fillRect(x + 12, fy - 40, 26, 20);        // 画面
        g.fillStyle = '#12202c'; g.fillRect(x + 14, fy - 38, 22, 16);
        g.fillStyle = 'rgba(120,220,255,.55)'; g.fillRect(x + 16, fy - 34, 14, 2);
      }
      // スポンサーの壁
      const cols = 3 + Math.floor(lv * 0.6);
      for (let i = 0; i < cols; i++) {
        const x = W - 180 + (i % 4) * 44, y = 40 + Math.floor(i / 4) * 22;
        if (x > W - 12) continue;
        g.fillStyle = ['#e04a3f', '#3a7ad9', '#4ea63f', '#ffc93c', '#b06fd0'][i % 5];
        g.fillRect(x, y, 38, 16);
        g.fillStyle = 'rgba(255,255,255,.35)'; g.fillRect(x, y, 38, 4);
      }
      if (lv >= 4) {                                                         // トロフィー棚
        const tx = W - 96;
        g.fillStyle = '#4a4034'; g.fillRect(tx, fy - 46, 84, 46);
        g.fillStyle = '#3a3229'; g.fillRect(tx + 2, fy - 30, 80, 2);
        for (let i = 0; i < Math.min(6, lv - 2); i++) {
          const x = tx + 8 + (i % 3) * 26, y = fy - (i < 3 ? 32 : 4);
          g.fillStyle = '#e8c24a'; g.fillRect(x, y - 12, 10, 8);
          g.fillRect(x + 3, y - 5, 4, 4); g.fillRect(x, y - 2, 10, 2);
          g.fillStyle = 'rgba(255,255,255,.45)'; g.fillRect(x + 1, y - 11, 3, 6);
        }
      }
      return [60, 140, 220].slice(0, 1 + Math.floor(lv / 3));
    },

    /* ユース：カートと黒板 */
    youth: function (g, lv, col, fy, rnd) {
      g.fillStyle = '#241a10'; g.fillRect(20, 40, 130, 62);                  // 黒板
      g.fillStyle = '#26463a'; g.fillRect(23, 43, 124, 56);
      g.fillStyle = 'rgba(255,255,255,.55)';
      g.fillRect(32, 54, 60, 2); g.fillRect(32, 62, 88, 2); g.fillRect(32, 70, 44, 2);
      // コースの見取り図らしきもの
      g.strokeStyle = 'rgba(255,220,120,.7)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(36, 88); g.lineTo(70, 80); g.lineTo(104, 92); g.lineTo(134, 82); g.stroke();
      // カート。レベルで台数が増える
      const karts = Math.min(4, 1 + Math.floor(lv / 2.6));
      for (let i = 0; i < karts; i++) {
        const x = 190 + i * 78, y = fy - 4;
        g.fillStyle = '#17181c';
        g.fillRect(x - 18, y - 8, 8, 8); g.fillRect(x + 10, y - 8, 8, 8);
        g.fillStyle = mix(col, -0.18); g.fillRect(x - 14, y - 16, 30, 9);
        g.fillStyle = ['#e04a3f', '#3a7ad9', '#4ea63f', '#ffc93c'][i % 4];
        g.fillRect(x - 12, y - 16, 26, 6);
        g.fillStyle = '#2b2e36'; g.fillRect(x - 4, y - 22, 8, 6);            // シート
        g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(x - 12, y - 16, 26, 2);
      }
      return [170, 260, 350].slice(0, 1 + Math.floor(lv / 3));
    },

    /* ピット設備：ジャッキに載ったマシンと工具棚 */
    pit: function (g, lv, col, fy, rnd) {
      const cx = 150, cy = fy - 16;
      g.fillStyle = '#3a3d46'; g.fillRect(cx - 66, cy + 8, 132, 8);          // ジャッキ
      g.fillRect(cx - 58, cy + 2, 10, 8); g.fillRect(cx + 48, cy + 2, 10, 8);
      g.fillStyle = mix(col, -0.18); g.fillRect(cx - 56, cy - 16, 112, 18);
      g.fillStyle = col; g.fillRect(cx - 52, cy - 16, 104, 13);
      g.fillStyle = 'rgba(255,255,255,.30)'; g.fillRect(cx - 52, cy - 16, 104, 3);
      g.fillStyle = '#2b2e36'; g.fillRect(cx - 66, cy - 20, 16, 5);
      g.fillRect(cx + 50, cy - 22, 18, 6);
      // 外したタイヤ
      for (let i = 0; i < 4; i++) {
        const x = cx - 40 + i * 26;
        g.fillStyle = '#17181c'; g.fillRect(x, fy - 8, 18, 8);
        g.fillStyle = '#2a2c33'; g.fillRect(x, fy - 8, 18, 2);
      }
      // 工具棚。レベルで増える
      const cab = Math.min(4, 1 + Math.floor(lv / 2.6));
      for (let i = 0; i < cab; i++) {
        const x = W - 40 - i * 46;
        g.fillStyle = '#241a10'; g.fillRect(x - 1, fy - 43, 38, 43);
        g.fillStyle = mix(col, -0.05); g.fillRect(x, fy - 42, 36, 42);
        for (let r = 0; r < 4; r++) {
          g.fillStyle = 'rgba(0,0,0,.30)'; g.fillRect(x + 2, fy - 38 + r * 10, 32, 2);
          g.fillStyle = 'rgba(255,255,255,.28)'; g.fillRect(x + 14, fy - 35 + r * 10, 8, 2);
        }
      }
      return [70, 240, 330].slice(0, 1 + Math.floor(lv / 3));
    }
  };

  /* ---------- 描画 ---------- */
  function render(cv, g2, key) {
    const dusk = document.body.getAttribute('data-skin') === 'hd';
    const lv = Math.max(1, Math.min(10, (g2.facilities && g2.facilities[key]) || 1));
    const out = cv.getContext('2d');
    out.imageSmoothingEnabled = false;
    if (dusk) GP.fx.init(W, H);
    const g = dusk ? GP.fx.begin() : out;
    g.imageSmoothingEnabled = false;
    const rnd = seeded(lv * 31 + key.length * 7);
    const col = g2.color || '#e04a3f';

    const fy = room(g, lv, col, dusk);
    const spots = (ROOMS[key] || ROOMS.factory)(g, lv, col, fy, rnd);

    // 働いている人。レベルが上がるほど増える
    (spots || []).forEach((x, i) => worker(g, x, fy, col, i * 1.7 + lv));

    // いちばん手前に自分が立つ
    if (GP.base && GP.base.drawActor) {
      GP.base.drawActor(g, { x: W - 34, y: H - 6, dir: 'left', frame: 0,
                             moving: false, color: col });
    }

    // レベルの表示
    g.font = 'bold 10px sans-serif'; g.textAlign = 'left';
    g.fillStyle = 'rgba(20,14,8,.62)'; g.fillRect(6, 6, 62, 14);
    g.fillStyle = '#ffe9b0'; g.fillText('Lv.' + lv + ' / 10', 11, 16);

    if (!dusk) return;
    GP.fx.composite(out, { dof: 0, bloom: 0.9, warm: 1.0, vignette: 0.85, night: true });
  }

  return { render, W, H };
})();

</script>
<script>
/* ===== src/ui.js ===== */
/* =========================================================
   UI 描画
   ========================================================= */
window.GP = window.GP || {};

GP.ui = (function () {
  'use strict';
  const D = GP.data, S = GP.state;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const money = n => Math.round(n).toLocaleString('ja-JP');

  /* ---------- トップバー ---------- */
  function renderTop(g) {
    const nextIdx = g.nextRace % D.TRACKS.length;
    const rw = S.raceWeek(g.nextRace);
    const left = Math.max(0, rw - g.week);
    $('tTeam').textContent = g.team;
    $('tTeamDot').style.background = g.color;
    $('tFunds').textContent = money(g.funds);
    $('tFans').textContent = money(g.fans);
    $('tRp').textContent = money(g.rp);
    $('tSeason').textContent = g.season;
    $('tWeek').textContent = g.week;
    if (g.nextRace >= D.TRACKS.length) {
      $('tNext').innerHTML = 'シーズン終了';
      $('tNext').className = '';
    } else if (left === 0) {
      $('tNext').innerHTML = '★ 今週レース！';
      $('tNext').className = 'race-imminent';
    } else {
      // 1コマンド＝1週なので、残り週数がそのまま「あと何回動けるか」になる
      let pips = '';
      for (let i = 0; i < left; i++) pips += '<i></i>';
      $('tNext').innerHTML = '第' + (g.nextRace + 1) + '戦まで <b>あと' + left + '週</b>' +
        '<span class="pips" title="レースまでに実行できるコマンド数">' + pips + '</span>' +
        '<em>コマンドあと' + left + '回</em>';
      $('tNext').className = left <= 1 ? 'race-soon' : '';
    }
    const ht = S.hypeTier(g);
    $('tHypeIc').textContent = ht.icon;
    $('tHypeVal').textContent = Math.round(g.hype || 0);
    $('tHypeBar').style.width = Math.round(g.hype || 0) + '%';
    $('tHypeBar').style.background = ht.color;
    $('tHypeBox').title = 'メディアでの扱い：' + ht.name +
      '（スポンサー収入 ×' + S.hypeBonus(g).toFixed(2) + '）';
    const tk = g.tickets || 0;
    $('tTicket').textContent = tk;
    $('tTicketBox').style.display = tk ? '' : 'none';
    $('tTicketBox').classList.toggle('has', tk > 0);
    const dm = S.diffOf(g);
    const md = $('tMode');
    md.textContent = dm.icon + dm.name;
    md.style.background = dm.color;
    const sc = GP.base.scale(g);
    const el = $('tRank');
    if (el && el.textContent !== sc.rank) {
      el.textContent = sc.rank;
      el.classList.remove('grow');
      void el.offsetWidth;
      el.classList.add('grow');
    }
    $('tFunds').parentElement.classList.toggle('danger', g.funds < 0);
  }

  /* ---------- 次戦カード ---------- */
  function nextRaceCard(g) {
    if (g.nextRace >= D.TRACKS.length) {
      return '<div class="card"><div class="card-h">🏁 シーズン最終節</div>' +
        '<div class="pad">全' + D.TRACKS.length + '戦が終了しました。「次の週へ」でシーズンを締めましょう。</div></div>';
    }
    const t = D.TRACKS[g.nextRace];
    const sc = S.carScore(g, t);
    const left = Math.max(0, S.raceWeek(g.nextRace) - g.week);
    const pips = left > 0 ? new Array(left + 1).join('<i></i>') : '';
    return '<div class="card"><div class="card-h">🏁 第' + (g.nextRace + 1) + '戦 ' + t.country + ' ' + esc(t.name) + '</div>' +
      '<div class="pad">' +
      '<div class="countdown' + (left === 0 ? ' now' : '') + '">' +
      (left === 0
        ? '<b>★ 今週が決勝です</b><span>「レースへ向かう！」を押してください</span>'
        : '<b>準備できるのは あと ' + left + ' 回</b>' +
          '<span class="pips">' + pips + '</span>' +
          '<span>コマンドを1つ選ぶと1週進みます</span>') +
      '</div>' +
      '<div class="track-mini" id="trackMini"></div>' +
      '<div class="tinfo"><span>周回数 <b>' + t.laps + '</b></span><span>難易度 <b>' + '★'.repeat(Math.round(t.risk * 2)) + '</b></span></div>' +
      '<div class="seclegend">' +
      '<span><i style="background:' + SECTOR_COLORS[0] + '"></i>S1</span>' +
      '<span><i style="background:' + SECTOR_COLORS[1] + '"></i>S2</span>' +
      '<span><i style="background:' + SECTOR_COLORS[2] + '"></i>S3</span>' +
      (t.landmarks ? '<em>◯ ' + t.landmarks.map(esc).join(' ／ ') + '</em>' : '') +
      '</div>' +
      '<p class="desc">' + esc(t.desc) + '</p>' +
      '<div class="req">求められる性能：' +
      reqBar('最高速', t.weight.speed) + reqBar('コーナー', t.weight.corner) + reqBar('加速', t.weight.accel) +
      '</div>' +
      '<div class="score">このコースでのマシン評価 <b>' + Math.round(sc) + '</b></div>' +
      '</div></div>';
  }
  function reqBar(name, v) {
    return '<div class="reqrow"><span>' + name + '</span><i><b style="width:' +
      Math.round(v * 180) + '%"></b></i><em>' + Math.round(v * 100) + '%</em></div>';
  }

  /* ---------- マシンパネル ---------- */
  function stars(n) { return '★'.repeat(n) + '☆'.repeat(5 - n); }

  function partTraitChips(p) {
    if (!p.traits || !p.traits.length) return '';
    return p.traits.map(k => {
      const t = D.PART_TRAITS.find(x => x.key === k);
      return t ? '<span class="ptr" title="' + esc(t.desc) + '">' + t.icon + t.name + '</span>' : '';
    }).join('');
  }

  /* パーツ1行（装備画面・保管一覧でも使う） */
  function partRow(g, p, opts) {
    opts = opts || {};
    const c = D.PART_CATS.find(x => x.key === p.cat);
    const rr = D.RARITY[p.rarity - 1];
    const cap = S.partCap(g, p);
    const pct = Math.min(100, p.power / cap * 100);
    return '<div class="part">' +
      '<span class="p-ic ic-art" style="background:' + c.color + '">' + partIcon(c.key, 18, p.rar) + '</span>' +
      '<span class="p-nm">' + esc(p.name) +
        '<small><span class="p-rar" style="color:' + rr.color + '">' + stars(p.rarity) + '</span> ' + c.name + '</small></span>' +
      '<span class="p-lv">' + Math.round(p.power) + '<small>/' + cap + '</small></span>' +
      '<span class="p-bar"><i style="width:' + pct + '%;background:' + c.color + '"></i></span>' +
      '<span class="p-cond ' + (p.cond < 45 ? 'bad' : p.cond < 70 ? 'warn' : '') + '">' + Math.round(p.cond) + '%</span>' +
      (opts.trailing || '') +
      (partTraitChips(p) ? '<span class="p-trs">' + partTraitChips(p) + '</span>' : '') +
      '</div>';
  }

  function carCard(g) {
    const st = S.carStats(g), rel = S.reliability(g);
    const gen = D.CAR_GENS[g.carGen];
    let parts = '';
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      parts += p ? partRow(g, p)
        : '<div class="part empty"><span class="p-ic ic-art">' + partIcon(c.key, 18, 0) + '</span>' +
          '<span class="p-nm">' + c.name + '<small>未装着</small></span></div>';
    });
    const ers = S.ersOf(g);
    const cap = S.bodyCap(g);
    let bodyRows = '';
    D.BODY_ATTRS.forEach(a => {
      const v = (g.body && g.body[a.key]) || 0;
      const pct = Math.min(100, v / cap * 100);
      bodyRows += '<div class="battr" title="' + esc(a.desc) + '">' +
        '<span>' + a.icon + a.name + '</span>' +
        '<i><b style="width:' + pct + '%;background:' + a.color + '"></b></i>' +
        '<em>' + (Math.round(v * 10) / 10) + '<small>/' + cap + '</small></em></div>';
    });
    return '<div class="card"><div class="card-h">🏎️ マシン <b class="gen">' + gen.name + '</b></div><div class="pad">' +
      '<div class="statrow">' + statBar('最高速', st.speed, '#e04a3f') + statBar('コーナー', st.corner, '#3a7ad9') + statBar('加速', st.accel, '#4ea63f') + '</div>' +
      '<div class="ersrow" title="エレクトロニクスの性能で決まります。直線での放電に使われ、前車に迫るときは多く消費します">' +
      '<span>🔋 バッテリー</span>' +
      '<em>容量 <b>' + Math.round(ers.capacity) + '</b></em>' +
      '<em>回生 <b>' + ers.recover + '</b>/周</em>' +
      '<em>放電 <b>' + ers.deploy + '</b>/周</em></div>' +
      '<div class="rel">信頼性 <b class="' + (rel < 55 ? 'bad' : rel < 75 ? 'warn' : 'good') + '">' + Math.round(rel) + '%</b>' +
      '<small>低いとリタイアしやすい。「整備」で回復。</small></div>' +
      '<div class="sub small">車体の熟成</div><div class="bodyattrs">' + bodyRows + '</div>' +
      '<div class="sub small">装着パーツ</div>' +
      '<div class="parts">' + parts + '</div>' +
      (g.inventory.length ? '<div class="invnote">📦 保管パーツ ' + g.inventory.length + ' 個（「マシン」で装着・合成）</div>' : '') +
      '</div></div>';
  }
  function statBar(name, v, col) {
    const pct = Math.min(100, v / 1.6);
    return '<div class="sb"><span>' + name + '</span><i><b style="width:' + pct + '%;background:' + col + '"></b></i><em>' + Math.round(v) + '</em></div>';
  }

  /* ---------- ドライバーカード ---------- */
  function driverCards(g) {
    let h = '<div class="card"><div class="card-h">🧑‍✈️ 所属ドライバー</div><div class="pad drvwrap">';
    g.drivers.forEach((d, i) => { h += driverCard(d, i); });
    if (g.drivers.length < 2) h += '<div class="drv empty">シートが空いています<br><small>「人事」から雇いましょう</small></div>';
    h += '</div></div>';
    return h;
  }
  function driverCard(d, i) {
    const r = Math.round(S.driverRating(d));
    const p = S.persOf(d), na = S.nationOf(d);
    return '<div class="drv">' +
      '<div class="drv-head">' + face(d, 34) +
      '<span class="drv-id"><span class="drv-nm">' + esc(d.name) + '</span>' +
      '<span class="drv-sub">' + na.flag + ' ' + d.age + '歳 ／ <b title="' + esc(p.desc) + '">' + p.icon + p.name + '</b></span></span>' +
      '</div>' +
      '<div class="skills">' + skillChips(d) + '</div>' +
      '<div class="drv-stats">' +
      mini('速さ', d.speed) + mini('技術', d.technique) + mini('体力', d.stamina) + mini('精神', d.mental) +
      '</div>' +
      '<div class="drv-foot">' +
      '<span>総合 <b>' + r + '</b></span>' +
      '<span>調子 <b class="' + (d.form >= 108 ? 'good' : d.form <= 88 ? 'bad' : '') + '">' + formLabel(d.form) + '</b></span>' +
      '<span>今季 <b>' + d.seasonPoints + 'pt</b></span>' +
      '</div>' +
      '<div class="drv-sal">給料 ' + money(d.salary) + '万/週</div>' +
      '</div>';
  }
  /* =========================================================
     ドライバーの顔（種から作るドット絵。SVGなので拡大しても崩れない）
     ========================================================= */
  const SKIN  = ['#f2c9a0', '#e0a878', '#c8865a', '#9a6440', '#6e4630', '#f7dcc0'];
  const HAIR  = ['#2b1c12', '#4a2f1a', '#8a5a2a', '#c8a040', '#d8d2c8', '#8a2a2a', '#2a4a8a', '#1c1c1c'];
  const EYES  = ['#3a2a18', '#2a4a70', '#2f5a3a', '#5a3a6a', '#1c1c22'];
  const SUITS = ['#c8362c', '#2f66c0', '#3f9440', '#d8a020', '#9a4fc0', '#2aa0b8'];

  /* ---------- パーツのアイコン ----------
     カテゴリごとに、そのものの形を16×16のドット絵で描く。
     絵文字だと端末ごとに絵が変わってしまうので、自前で持つ。
     rar（レア度 0..4）が上がるほど、金属の照りと縁の輝きが強くなる。   */
  function partIcon(key, px, rar) {
    px = px || 20; rar = rar || 0;
    const r = (x, y, w, h, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"/>';
    const shine = 0.10 + rar * 0.10;                       // レアほど光る
    const hi = 'rgba(255,255,255,' + (0.30 + shine).toFixed(2) + ')';
    let g = '';

    if (key === 'pu') {
      // パワーユニット：Vバンクのエンジンブロック
      g += r(3, 5, 10, 8, '#5a5f6a') + r(3, 5, 10, 2, '#7c828e');
      g += r(2, 7, 1, 5, '#454a54') + r(13, 7, 1, 5, '#454a54');
      g += r(4, 2, 2, 4, '#8d94a0') + r(7, 2, 2, 4, '#8d94a0') + r(10, 2, 2, 4, '#8d94a0'); // 排気管
      g += r(4, 2, 2, 1, hi) + r(7, 2, 2, 1, hi) + r(10, 2, 2, 1, hi);
      g += r(4, 8, 8, 1, '#2f333b') + r(4, 10, 8, 1, '#2f333b');                            // 冷却フィン
      g += r(5, 13, 6, 2, '#3a3f48');                                                       // オイルパン
      g += r(3, 5, 3, 1, hi);

    } else if (key === 'aero') {
      // エアロ：多段のリアウイングと翼端板
      g += r(2, 4, 12, 2, '#2b2f38') + r(2, 4, 12, 1, hi);        // 上段
      g += r(3, 8, 10, 2, '#343945') + r(3, 8, 10, 1, hi);        // 下段
      g += r(1, 3, 2, 9, '#4a5160') + r(1, 3, 1, 9, '#5f6778');   // 翼端板
      g += r(13, 3, 2, 9, '#4a5160');
      g += r(7, 6, 2, 3, '#2b2f38');                              // 支柱
      g += r(4, 12, 8, 2, '#242830') + r(4, 12, 8, 1, 'rgba(255,255,255,.18)');  // ディフューザー

    } else if (key === 'chas') {
      // シャシー：モノコックの骨組み
      g += r(3, 3, 10, 11, '#4a4f5a');
      g += r(4, 4, 8, 9, '#6a707d');
      g += r(4, 4, 8, 2, hi);
      g += r(6, 6, 4, 5, '#343945');                              // コクピット開口
      g += r(2, 5, 1, 7, '#3a3f48') + r(13, 5, 1, 7, '#3a3f48');
      g += r(3, 13, 10, 2, '#2c3038');                            // フロア
      // 織り目（カーボン）
      g += r(4, 8, 8, 1, 'rgba(0,0,0,.22)') + r(4, 11, 8, 1, 'rgba(0,0,0,.22)');

    } else if (key === 'susp') {
      // サスペンション：コイルスプリングとダンパー
      g += r(7, 2, 2, 12, '#5a606c');                             // シャフト
      g += r(7, 2, 1, 12, '#7a818e');
      for (let y = 3; y < 12; y += 2) {                           // コイル
        g += r(4, y, 8, 1, '#9aa2b0') + r(4, y, 8, 0.5, hi);
        g += r(4, y + 1, 8, 1, '#5e6572');
      }
      g += r(5, 1, 6, 2, '#454a54') + r(5, 13, 6, 2, '#454a54');  // 上下のマウント
      g += r(5, 1, 6, 1, hi);

    } else {
      // エレクトロニクス：基板とチップ
      g += r(2, 3, 12, 10, '#1e5a35') + r(2, 3, 12, 1, '#2f7a48');
      g += r(5, 6, 6, 5, '#22262e') + r(5, 6, 6, 1, '#3c414c');   // チップ
      g += r(6, 7, 4, 3, '#2f353f');
      for (let x = 3; x < 13; x += 3) {                           // 配線
        g += r(x, 4, 1, 2, '#c8a53a') + r(x, 11, 1, 2, '#c8a53a');
      }
      g += r(3, 8, 2, 1, '#c8a53a') + r(11, 8, 2, 1, '#c8a53a');
      g += r(4, 5, 1, 1, hi) + r(10, 5, 1, 1, hi);                // はんだの光
      if (rar >= 2) g += r(11, 4, 2, 2, '#7ce8ff');               // 動作ランプ
    }

    // レアなパーツは縁が光る
    const edge = rar >= 3 ? '<rect x="0.5" y="0.5" width="15" height="15" fill="none" stroke="rgba(255,224,150,'
                            + (0.35 + rar * 0.12).toFixed(2) + ')" stroke-width="1"/>' : '';
    return '<svg class="picon" viewBox="0 0 16 16" width="' + px + '" height="' + px +
      '" shape-rendering="crispEdges">' + g + edge + '</svg>';
  }

  /* ---------- ドライバーの顔 ----------
     24×24 のドット絵。d.face を種にして、肌・髪・目・髪型・特徴を決める。
     調子（form）で表情が変わり、レーシングスーツの色で個体差を出す。      */
  function face(d, px) {
    px = px || 34;
    let h = (d.face != null ? d.face : 0) >>> 0;
    // 種を撹拌してから使う。そのまま回すと、近い種で似た顔ばかりになる
    h ^= h >>> 15; h = Math.imul(h, 2246822519) >>> 0;
    h ^= h >>> 13; h = Math.imul(h, 3266489917) >>> 0;
    h ^= h >>> 16;
    const nx = m => { h = (Math.imul(h, 1103515245) + 12345) >>> 0; return (h >>> 8) % m; };
    const skin  = SKIN[nx(SKIN.length)];
    const hair  = HAIR[nx(HAIR.length)];
    const eye   = EYES[nx(EYES.length)];
    const suit  = SUITS[nx(SUITS.length)];
    const style = nx(6);           // 髪型
    const brow  = nx(2);           // 眉の高さ
    const extra = nx(7);           // ヒゲ・そばかす等
    const f = d.form == null ? 100 : d.form;

    // 肌と髪の陰影を作る
    const mix = (hex, amt) => {
      const n = parseInt(hex.slice(1), 16);
      const c = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
      return 'rgb(' + c((n >> 16) & 255) + ',' + c((n >> 8) & 255) + ',' + c(n & 255) + ')';
    };
    const skinSh = mix(skin, -0.11), skinHi = mix(skin, 0.09);
    const hairHi = mix(hair, 0.16),  hairSh = mix(hair, -0.10);
    const suitSh = mix(suit, -0.14), suitHi = mix(suit, 0.16);

    const r = (x, y, w, ht, c) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + ht + '" fill="' + c + '"/>';
    let g = '';

    // ---- 肩とレーシングスーツ ----
    g += r(2, 19, 20, 5, suitSh);
    g += r(3, 20, 18, 4, suit);
    g += r(3, 20, 18, 1, suitHi);                    // 肩の照り
    g += r(9, 19, 6, 5, mix(suit, -0.22));           // 襟の合わせ
    g += r(11, 19, 2, 5, '#e8e4d8');                 // ファスナー
    // ---- 首 ----
    g += r(9, 16, 6, 4, skinSh);
    g += r(10, 16, 4, 3, skin);

    // ---- 顔の輪郭 ----
    g += r(5, 4, 14, 14, skin);
    g += r(4, 6, 1, 9, skin) + r(19, 6, 1, 9, skin); // 耳
    g += r(15, 4, 4, 14, skinSh);                    // 右側は影
    g += r(5, 4, 3, 14, skinHi);                     // 左側に光
    g += r(5, 16, 14, 2, skinSh);                    // 顎の下

    // ---- 髪型 ----
    if (style === 0) {                                // 短髪
      g += r(4, 1, 16, 5, hair) + r(4, 5, 2, 5, hair) + r(18, 5, 2, 5, hair);
      g += r(5, 1, 8, 2, hairHi);
    } else if (style === 1) {                         // 立ち上げ
      g += r(5, 0, 14, 5, hair) + r(7, -1, 3, 2, hair) + r(13, -1, 3, 2, hair);
      g += r(6, 0, 7, 2, hairHi);
    } else if (style === 2) {                         // 長髪
      g += r(4, 1, 16, 5, hair) + r(2, 4, 3, 13, hair) + r(19, 4, 3, 13, hair);
      g += r(5, 1, 8, 2, hairHi) + r(19, 5, 1, 10, hairSh);
    } else if (style === 3) {                         // 分け目
      g += r(4, 1, 16, 4, hair) + r(4, 4, 3, 4, hair) + r(18, 4, 2, 4, hair);
      g += r(4, 4, 7, 2, hair) + r(5, 1, 6, 2, hairHi);
    } else if (style === 4) {                         // 坊主／短く刈る
      g += r(5, 2, 14, 3, hair) + r(4, 4, 2, 3, hair) + r(18, 4, 2, 3, hair);
      g += r(6, 2, 7, 1, hairHi);
    } else {                                          // 結んだ髪
      g += r(4, 1, 16, 5, hair) + r(4, 5, 2, 4, hair) + r(18, 5, 2, 4, hair);
      g += r(19, 8, 4, 7, hair) + r(20, 9, 2, 5, hairSh) + r(5, 1, 8, 2, hairHi);
    }

    // ---- 眉と目（調子で表情が変わる）----
    const ey = f < 88 ? 12 : 11;
    g += r(7, ey - 3 + brow, 4, 1, hairSh) + r(13, ey - 3 + brow, 4, 1, hairSh);
    if (f >= 112) {                                   // 好調：目を細めて笑う
      g += r(7, ey, 4, 1, '#2a2028') + r(13, ey, 4, 1, '#2a2028');
    } else {
      g += r(7, ey, 4, 3, '#f4f2ee') + r(13, ey, 4, 3, '#f4f2ee');   // 白目
      g += r(8, ey + 1, 2, 2, eye) + r(14, ey + 1, 2, 2, eye);       // 虹彩
      g += r(8, ey + 1, 1, 1, '#ffffff') + r(14, ey + 1, 1, 1, '#ffffff'); // 光
      g += r(7, ey, 4, 1, mix(skin, -0.20)) + r(13, ey, 4, 1, mix(skin, -0.20)); // まぶたの影
    }
    // ---- 鼻と口 ----
    g += r(11, ey + 3, 2, 2, skinSh);
    if (f >= 108)      g += r(9, ey + 6, 6, 1, '#8e3a30') + r(10, ey + 7, 4, 1, '#b05a48');
    else if (f <= 88)  g += r(9, ey + 7, 6, 1, '#7e3a34');
    else               g += r(10, ey + 6, 4, 1, '#8a4038');

    // ---- 個性 ----
    if (extra === 0) g += r(8, ey + 5, 8, 3, hairSh) + r(9, ey + 8, 6, 1, hairSh);   // ヒゲ
    if (extra === 1) g += r(6, ey + 2, 2, 1, mix(skin, -0.16)) + r(16, ey + 2, 2, 1, mix(skin, -0.16)); // そばかす
    if (extra === 2) g += r(6, ey - 1, 12, 4, 'rgba(26,26,34,.82)') + r(7, ey, 3, 1, 'rgba(255,255,255,.35)'); // サングラス
    if (extra === 3) g += r(4, 5, 16, 2, '#e8e4d8') + r(4, 5, 16, 1, '#ffffff');     // ハチマキ
    if (extra === 4) g += r(8, ey + 6, 8, 2, hairSh);                                // 口ひげ

    return '<svg class="face" viewBox="0 0 24 24" width="' + px + '" height="' + px + '" shape-rendering="crispEdges">' +
      '<rect width="24" height="24" fill="#3f4d61"/>' +
      '<rect width="24" height="13" fill="#54657e"/>' + g + '</svg>';
  }

  function skillChips(d) {
    if (!d.skills || !d.skills.length) return '<span class="skill none">スキルなし</span>';
    return d.skills.map(k => {
      const s = D.SKILLS.find(x => x.key === k);
      return s ? '<span class="skill" title="' + esc(s.desc) + '">' + s.icon + s.name + '</span>' : '';
    }).join('');
  }

  function mini(n, v) {
    return '<div class="mst"><span>' + n + '</span><i><b style="width:' + Math.min(100, v / 1.9) + '%"></b></i><em>' + Math.round(v) + '</em></div>';
  }
  function formLabel(f) {
    if (f >= 112) return '絶好調';
    if (f >= 104) return '好調';
    if (f >= 96) return '普通';
    if (f >= 88) return '不調';
    return '絶不調';
  }
  /* ---------- サイドパネル（タブ）---------- */
  let sideTab = 'log';
  function renderSide(g) {
    const tabs = [['log', '📜 日誌'], ['team', '📊 チーム順位'], ['drv', '🏅 ドライバー順位'], ['staff', '👥 スタッフ']];
    let h = '<div class="tabs">';
    tabs.forEach(t => { h += '<button class="tab' + (sideTab === t[0] ? ' on' : '') + '" data-tab="' + t[0] + '">' + t[1] + '</button>'; });
    h += '</div><div class="tabbody">';
    if (sideTab === 'log') {
      h += '<div class="loglist">' + g.log.slice(-70).reverse().map(l =>
        '<div class="logline ' + (l.t || '') + '">' + esc(l.s) + '</div>').join('') + '</div>';
    } else if (sideTab === 'team') {
      h += '<table class="rank"><tr><th>#</th><th>チーム</th><th>pt</th></tr>' +
        S.constructorTable(g).map((r, i) =>
          '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' +
          '<span class="rk-chip" style="background:' + r.color + '"></span>' + esc(r.name) +
          '</td><td>' + r.points + '</td></tr>').join('') + '</table>';
    } else if (sideTab === 'drv') {
      const rows = S.driverTable(g).slice(0, 22);
      h += '<table class="rank"><tr><th>#</th><th>ドライバー</th><th>チーム</th><th>pt</th></tr>' +
        rows.map((r, i) => '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + (i + 1) + '</td><td>' + esc(r.name) +
          '</td><td><span class="rk-chip" style="background:' + r.color + '"></span>' + esc(r.team) + '</td><td>' + r.points + '</td></tr>').join('') +
        '</table>';
    } else {
      h += '<div class="stafflist">';
      g.staff.forEach(s => {
        const t = D.STAFF_TYPES.find(x => x.key === s.type);
        h += '<div class="staff"><span class="s-ic">' + t.icon + '</span><span class="s-nm">' + esc(s.name) +
          '<small>' + t.name + '</small></span><span class="s-sk">技能 ' + s.skill + '</span><span class="s-sal">' + money(s.salary) + '万</span></div>';
      });
      if (!g.staff.length) h += '<p class="desc">スタッフがいません。</p>';
      h += '</div><div class="facs">';
      D.FACILITIES.forEach(f => {
        h += '<div class="fac"><span>' + f.icon + ' ' + f.name + '</span><b>Lv.' + g.facilities[f.key] + '</b></div>';
      });
      h += '</div>';
      h += '<div class="spons"><div class="sub">スポンサー</div>';
      g.sponsors.forEach(s => {
        const bits = [];
        if (s.per) bits.push('💰' + money(s.per));
        if (s.rp) bits.push('🔬' + s.rp);
        if (s.fan) bits.push('👥' + money(s.fan));
        h += '<div class="spon">' + s.icon + ' ' + esc(s.name) + '<em>' + bits.join(' ') + '</em></div>';
      });
      h += '</div>';
    }
    h += '</div>';
    $('sidePanel').innerHTML = h;
    Array.prototype.forEach.call($('sidePanel').querySelectorAll('.tab'), b => {
      b.onclick = () => { sideTab = b.dataset.tab; renderSide(g); };
    });
  }
  /* ---------- ミニコース図 ---------- */
  const SECTOR_COLORS = ['#f0a020', '#4ea63f', '#3a7ad9'];

  function drawMini(track) {
    const el = $('trackMini');
    if (!el || !track) return;
    const w = 260, h = 108, pad = 14;
    const poly = GP.geom.buildPoly(track.path, w, h, pad);
    const geo = GP.geom.analyze(track);
    const pts = poly.pts, n = poly.n;
    const seg = (from, to) => {
      let d = '', k = from, steps = 0;
      const span = (to - from + n) % n;
      while (steps <= span) {
        const p = pts[k % n];
        d += (steps ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1);
        k++; steps++;
      }
      return d;
    };
    let outline = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
    for (let i = 1; i < n; i++) outline += 'L' + pts[i][0].toFixed(1) + ' ' + pts[i][1].toFixed(1);
    outline += 'Z';

    // セクターごとに色分けし、どこで速さが要るのか一目で分かるようにする
    let secPaths = '';
    (geo.sectors || []).forEach((sc, i) => {
      secPaths += '<path class="sec" d="' + seg(sc.from, sc.to) + '" fill="none" stroke="' + SECTOR_COLORS[i] +
        '" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>';
    });
    // 名物コーナーの位置
    let marks = '';
    (geo.corners || []).slice().sort((a, b) => b.peak - a.peak)
      .slice(0, (track.landmarks || []).length).forEach(cn => {
        const mid = pts[Math.round(cn.from + ((cn.to - cn.from + n) % n) / 2) % n];
        marks += '<circle cx="' + mid[0].toFixed(1) + '" cy="' + mid[1].toFixed(1) +
          '" r="3.2" fill="#fff" stroke="#4a2f1a" stroke-width="1.6"/>';
      });
    const start = pts[0];
    el.innerHTML = '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="xMidYMid meet">' +
      '<path d="' + outline + '" fill="none" stroke="#4a2f1a" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>' +
      secPaths + marks +
      '<circle cx="' + start[0].toFixed(1) + '" cy="' + start[1].toFixed(1) + '" r="4.5" fill="#e04a3f" stroke="#4a2f1a" stroke-width="2"/></svg>';
  }

  /* =========================================================
     収支ダッシュボード
     ========================================================= */
  function finance(g) {
    const f = S.finances(g);
    const cyc = S.raceWeek(0);
    const rows = [
      ['👥 スタッフ給料', f.staff], ['👔 首脳陣の報酬', f.managers],
      ['🧑‍✈️ ドライバー給料', f.drivers], ['🎓 育成の費用', f.youth],
      ['🏗️ 施設の維持費', f.facilities],
    ].concat(f.engine ? [['🔌 PU供給料', f.engine]] : []).concat([
      ['📋 その他', f.other]
    ]);
    const raw = rows.reduce((a, r) => a + r[1], 0);
    let h = '<div class="sub">💹 収支</div>' +
      '<div class="fin"><div class="fin-col"><div class="fin-h">毎週の支出</div>';
    rows.forEach(r => {
      h += '<div class="fin-row"><span>' + r[0] + '</span><b>' + money(r[1]) + '</b></div>';
    });
    if (f.cut > 0) {
      h += '<div class="fin-row cut"><span>🚚 ロジスティクス削減</span><b>-' +
        Math.round(f.cut * 100) + '%</b></div>';
    }
    h += '<div class="fin-row total"><span>合計</span><b>' + money(f.weekly) + '万 / 週</b></div>' +
      '</div><div class="fin-col"><div class="fin-h">レース1回あたり</div>' +
      '<div class="fin-row"><span>📣 スポンサー収入</span><b class="good">+' + money(f.sponsorPerRace) + '</b></div>' +
      (f.sponsorRpPerRace ? '<div class="fin-row"><span>🔬 スポンサーの研究P</span><b class="good">+' + f.sponsorRpPerRace + '</b></div>' : '') +
      '<div class="fin-row"><span>💸 ' + cyc + '週ぶんの支出</span><b class="bad">-' + money(f.cycleCost) + '</b></div>' +
      '<div class="fin-row total"><span>差し引き</span><b class="' + (f.net >= 0 ? 'good' : 'bad') + '">' +
      (f.net >= 0 ? '+' : '') + money(f.net) + '万</b></div>' +
      '<p class="desc">※ここに賞金が加わります。賞金は順位しだいなので、' +
      'この差し引きがマイナスでも上位に入れば黒字になります。</p>' +
      '</div></div>';
    if (f.net < 0) {
      h += '<p class="note">スポンサー収入だけでは ' + money(-f.net) + '万 足りません。' +
        '順位を上げて賞金と注目度を稼ぐか、支出を見直しましょう。</p>';
    }
    return h;
  }

  /* =========================================================
     チャンピオンシップ順位表
     実際のF1と同じ配点（25-18-15-12-10-8-6-4-2-1）＋
     10位以内で完走したファステストラップに +1
     ========================================================= */
  function standings(g) {
    const rounds = g.results.filter(r => r.season === g.season);
    let h = '<div class="sub">🏆 ドライバーズランキング</div>';

    // ラウンドごとの獲得ポイントを名前で引けるようにする
    const byRound = {};
    rounds.forEach((r, i) => {
      r.rows.forEach(row => {
        byRound[row.name] = byRound[row.name] || [];
        byRound[row.name][i] = { pts: row.pts, pos: row.pos, dnf: row.dnf, fl: row.fl };
      });
    });

    const stats = {};
    g.drivers.forEach(d => { stats[d.name] = d; });
    g.rivals.forEach(t => t.drivers.forEach(d => { stats[d.name] = d; }));

    const rows = S.driverTable(g);
    h += '<div class="tablewrap"><table class="rank champ"><tr>' +
      '<th>#</th><th>ドライバー</th><th>チーム</th><th title="優勝">🏆</th>' +
      '<th title="表彰台">🥉</th><th title="ポールポジション">P</th>' +
      '<th title="ファステストラップ">⚡</th><th>pt</th></tr>';
    rows.forEach((r, i) => {
      const d = stats[r.name] || {};
      h += '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + (i + 1) + '</td>' +
        '<td class="nm">' + esc(r.name) + '</td>' +
        '<td><span class="rk-chip" style="background:' + r.color + '"></span>' + esc(r.team) + '</td>' +
        '<td>' + (d.wins || 0) + '</td><td>' + (d.podiums || 0) + '</td>' +
        '<td>' + (d.poles || 0) + '</td><td>' + (d.fastestLaps || 0) + '</td>' +
        '<td class="pt">' + r.points + '</td></tr>';
    });
    h += '</table></div>';

    h += '<div class="sub">🏭 コンストラクターズランキング</div>';
    h += '<div class="tablewrap"><table class="rank champ"><tr><th>#</th><th>チーム</th><th>pt</th></tr>';
    S.constructorTable(g).forEach((r, i) => {
      h += '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td>' + (i + 1) + '</td>' +
        '<td class="nm"><span class="rk-chip" style="background:' + r.color + '"></span>' + esc(r.name) + '</td>' +
        '<td class="pt">' + r.points + '</td></tr>';
    });
    h += '</table></div>';

    // ラウンド別のポイント推移（上位ドライバーぶん）
    if (rounds.length) {
      h += '<div class="sub">📈 ラウンド別の獲得ポイント</div>';
      h += '<div class="tablewrap"><table class="rank grid"><tr><th class="nm">ドライバー</th>';
      rounds.forEach(r => { h += '<th title="' + esc(r.track) + '">R' + r.round + '</th>'; });
      h += '<th>計</th></tr>';
      rows.slice(0, 12).forEach(r => {
        h += '<tr class="' + (r.isPlayer ? 'me' : '') + '"><td class="nm">' + esc(r.name) + '</td>';
        rounds.forEach((rd, i) => {
          const c = (byRound[r.name] || [])[i];
          if (!c) { h += '<td class="dim">-</td>'; return; }
          const cls = c.dnf ? 'dnf' : c.pos === 1 ? 'gold' : c.pos <= 3 ? 'pod' : c.pts ? 'pts' : 'dim';
          h += '<td class="' + cls + '" title="' + (c.dnf ? 'リタイア' : c.pos + '位') +
            (c.fl ? ' / ファステストラップ' : '') + '">' + (c.dnf ? '×' : (c.pts || '·')) + '</td>';
        });
        h += '<td class="pt">' + r.points + '</td></tr>';
      });
      h += '</table></div>';
      h += '<p class="desc">セルの数字はその戦で得たポイント。🏆金＝優勝、緑＝表彰台、× はリタイア。</p>';
    }
    return h;
  }

  /* ---------- 特別戦の招待カード ---------- */
  function specialCard(g, sp) {
    if (!sp || !g.special) return '';
    const t = D.TRACKS[g.special.trackIndex];
    const laps = Math.max(4, Math.round(t.laps * sp.lapMul));
    return '<div class="card special"><div class="card-h">' + sp.icon + ' 特別戦の招待 — ' + esc(sp.name) + '</div>' +
      '<div class="pad">' +
      '<p class="lead">' + esc(sp.desc) + '</p>' +
      '<div class="sp-meta"><span>会場 <b>' + t.country + ' ' + esc(t.name) + '</b></span>' +
      '<span>距離 <b>' + laps + '周</b></span>' +
      '<span>エントリー費 <b>💰' + money(sp.entry) + '万</b></span></div>' +
      '<p class="note">' + esc(sp.note) + '</p>' +
      '<p class="desc">選手権のポイントは動きません。参加すると1週を消費します。</p>' +
      '<div class="sp-btns">' +
      '<button class="btn primary" id="specialGo"' + (g.funds < sp.entry ? ' disabled' : '') + '>' + sp.icon + ' 参加する</button>' +
      '<button class="btn" id="specialSkip">見送る</button></div>' +
      '</div></div>';
  }

  /* ---------- 全体再描画 ---------- */
  function renderAll(g, special) {
    renderTop(g);
    $('viewPanel').innerHTML = specialCard(g, special) + hubCard(g) + nextRaceCard(g) + carCard(g) + driverCards(g);
    if (g.nextRace < D.TRACKS.length) drawMini(D.TRACKS[g.nextRace]);
    renderSide(g);
  }

  /* ---------- 本拠地（ここが操作の起点になる）----------
     建物を押すと、その設備の画面が開く。何が開くかは main.js が決める。 */
  function hubCard(g) {
    const sc = GP.base.scale(g);
    // レースウィークは、本拠地ではなくサーキットのパドックを歩く
    const race = g.nextRace < D.TRACKS.length && g.week === GP.state.raceWeek(g.nextRace);
    const head = race
      ? '<div class="card-h">🏁 パドック <b class="hubrank">' + esc(D.TRACKS[g.nextRace].name) + '</b></div>'
      : '<div class="card-h">🏠 チーム本拠地 <b class="hubrank">' + esc(sc.rank) + '</b></div>';
    return '<div class="card hub">' + head +
      '<div class="pad">' +
      '<div class="basewrap"><canvas id="hubCv" width="' + GP.base.W + '" height="' + GP.base.H + '"></canvas></div>' +
      '<div class="hubbar">' +
      '<div class="hubhint" id="hubHint">矢印キーで歩く／画面をタップでそこへ移動。建物の下で「入る」</div>' +
      '<button class="btn hubenter" id="hubEnter" disabled>▲ 入る</button>' +
      '</div></div></div>';
  }

  /* ---------- ログ ---------- */
  function log(g, s, type) {
    g.log.push({ s: '[S' + g.season + ' W' + g.week + '] ' + s, t: type || '' });
    if (g.log.length > 400) g.log.splice(0, g.log.length - 400);
  }

  /* ---------- トースト ---------- */
  function toast(text, type) {
    if (GP.sound) {
      if (type === 'bad') GP.sound.play('bad', 300);
      else if (type === 'warn') GP.sound.play('warn', 300);
    }
    const el = document.createElement('div');
    el.className = 'toast ' + (type || '');
    el.innerHTML = text;
    $('toastLayer').appendChild(el);
    setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, 2200);
  }

  /* ---------- 数値ポップ ---------- */
  function pop(text, type) {
    const el = document.createElement('div');
    el.className = 'numpop ' + (type || '');
    el.textContent = text;
    el.style.left = (40 + Math.random() * 20) + '%';
    $('toastLayer').appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }

  /* ---------- モーダル ---------- */
  function modal(title, body, buttons, opts) {
    opts = opts || {};
    const m = $('modal');
    m.className = 'show' + (opts.wide ? ' wide' : '');
    $('modalTitle').innerHTML = title;
    $('modalBody').innerHTML = body;
    const bar = $('modalBtns');
    bar.innerHTML = '';
    (buttons || [{ label: '閉じる', fn: closeModal }]).forEach(b => {
      const el = document.createElement('button');
      el.className = 'btn ' + (b.cls || '');
      el.innerHTML = b.label;
      el.disabled = !!b.disabled;
      el.onclick = b.fn;
      bar.appendChild(el);
    });
    return $('modalBody');
  }
  function closeModal() { $('modal').className = ''; }

  return { renderAll, hubCard, partIcon, renderTop, renderSide, log, toast, pop, modal, closeModal,
           money, esc, driverCard, drawMini, partRow, skillChips, stars, partTraitChips, face, standings, finance, $ };
})();

</script>
<script>
/* ===== src/main.js ===== */
/* =========================================================
   ゲーム本体：週の進行・各コマンド・レース進行
   ========================================================= */
window.GP = window.GP || {};

(function () {
  'use strict';
  const D = GP.data, S = GP.state, U = GP.ui, R = GP.race, RV = GP.raceview;
  const $ = id => document.getElementById(id);
  const money = U.money, esc = U.esc;
  let g = null;

  /* =======================================================
     週の進行
     ======================================================= */
  function isRaceWeek() { return g.nextRace < D.TRACKS.length && g.week === S.raceWeek(g.nextRace); }

  function endWeek() {
    // 固定費
    const cost = S.weeklyCost(g);
    g.funds -= cost;
    if (g.funds < 0) {
      U.log(g, '⚠️ 資金が底をついた！（' + money(g.funds) + '万）', 'bad');
      U.toast('⚠️ 資金がマイナスです！', 'bad');
      if (g.funds < -20000) return gameOver();
    }
    // 研究ポイントの自然増
    g.rp += 2 + Math.round(S.staffBonus(g, 'analyst'));
    // 下部組織の若手が育つ
    S.growYouth(g);
    // コンディション変動（放っておけば平常に戻る。悪循環にはまり込まないように）
    const drift = d => { d.form = S.clamp(d.form + (100 - d.form) * 0.14 + S.rnd(-4.5, 5), 62, 122); };
    g.drivers.forEach(d => { drift(d); levelCheck(d); });
    g.rivals.forEach(t => t.drivers.forEach(drift));   // ライバルも同じ条件で
    // ファンの自然減と、話題の風化
    g.fans = Math.max(0, g.fans - Math.round(g.fans * 0.006));
    S.addHype(g, -(g.hype || 0) * 0.035);

    g.week++;
    g.special = null;
    randomEvent();
    offerSpecial();
    offerSponsor();

    if (g.week > S.SEASON_WEEKS) return seasonEnd();
    S.save(g);
    render();
    if (isRaceWeek()) U.toast('🏁 今週はレースウィーク！', 'good');
  }

  function levelCheck(d) {
    while (d.exp >= 40 * d.expLv) {
      d.exp -= 40 * d.expLv;
      d.expLv++;
      const keys = ['speed', 'technique', 'stamina', 'mental'];
      const up = {};
      keys.forEach(k => { const v = S.rint(1, 4); d[k] = S.clamp(d[k] + v, 1, 199); up[k] = v; });
      d.salary = Math.round((d.speed + d.technique + d.stamina + d.mental) / 4 * 0.95 + 18);
      U.log(g, '⭐ ' + d.name + ' がレベルアップ！ (Lv.' + d.expLv + ')', 'good');
      U.pop('⭐ ' + d.name + ' Lv.' + d.expLv, 'good');
      GP.sound.play('levelup', 200);
      // レベルアップでスキルを閃くことがある
      const room = (d.skills || []).length < S.SKILL_MAX;
      if (room && Math.random() < 0.32) {
        const cand = S.learnableSkills(d);
        if (cand.length) {
          const sk = S.pick(cand);
          S.teachSkill(d, sk.key);
          U.log(g, '🎓 ' + d.name + ' がスキル「' + sk.name + '」を習得！', 'good');
          U.toast('🎓 ' + d.name + ' が ' + sk.icon + sk.name + ' を習得！', 'good');
        }
      }
    }
  }

  /* ---------- ランダムイベント（カイロ風の小さな事件） ---------- */
  const EVENTS = [
    { p: 0.06, run: () => { const m = S.rint(300, 1400); g.funds += m; return '💰 グッズが売れた！ +' + money(m) + '万'; } },
    { p: 0.05, run: () => { const f = S.rint(80, 400); g.fans += f; return '📺 テレビ特集が組まれた！ ファン +' + money(f); } },
    { p: 0.05, run: () => { const r = S.rint(6, 20); g.rp += r; return '💡 若手エンジニアがひらめいた！ 研究P +' + r; } },
    { p: 0.04, run: () => { const c = S.pick(D.PART_CATS); const p = g.equipped[c.key]; if (!p) return null;
        p.cond = S.clamp(p.cond - S.rint(8, 18), 10, 100); return '🔧 ' + p.name + 'に不具合が見つかった…'; } },
    { p: 0.04, run: () => { const d = S.pick(g.drivers); if (!d) return null; d.form = S.clamp(d.form + 12, 62, 122); return '😄 ' + d.name + ' の調子が上向いてきた！'; } },
    { p: 0.03, run: () => { const d = S.pick(g.drivers); if (!d) return null; d.form = S.clamp(d.form - 12, 62, 122); return '🤒 ' + d.name + ' が体調を崩している…'; } },
    { p: 0.03, run: () => { const m = S.rint(400, 1600); g.funds -= m; return '🧾 設備の修繕費がかかった… -' + money(m) + '万'; } },
    { p: 0.03, run: () => { const c = S.pick(D.PART_CATS); const p = g.equipped[c.key]; if (!p) return null;
        p.power = Math.round((p.power + 2) * 10) / 10; return '📐 ' + p.name + 'の設計を見直した！ 性能+2'; } },
    { p: 0.02, run: () => { const f = Math.round(g.fans * 0.06) + 50; g.fans += f; return '🎪 ファン感謝祭が大盛況！ ファン +' + money(f); } },
    { p: 0.02, run: () => { const d = S.pick(g.drivers); if (!d) return null; d.exp += 25; levelCheck(d); return '📚 ' + d.name + ' が自主練に励んだ！'; } }
  ];
  function randomEvent() {
    for (const e of EVENTS) {
      if (Math.random() < e.p) {
        const msg = e.run();
        if (msg) { U.log(g, msg); U.toast(msg); }
        return;
      }
    }
  }

  /* ---------- スポンサーからのオファー ----------
     注目度が高いと、まだ契約していない大手から向こうが声を掛けてくる     */
  function offerSponsor() {
    // 期限切れのオファーは引っ込む
    if (g.sponsorOffer && g.sponsorOffer.until != null && g.week > g.sponsorOffer.until) {
      U.log(g, '📞 ' + g.sponsorOffer.name + ' からのオファーは期限切れになった…', 'warn');
      g.sponsorOffer = null;
    }
    if (g.sponsorOffer) return;
    const slots = 2 + g.facilities.market;
    if (g.sponsors.length >= slots) return;
    const have = g.sponsors.map(x => x.name);
    const cand = D.SPONSORS.filter(sp => have.indexOf(sp.name) < 0 && S.sponsorOpen(g, sp));
    if (!cand.length) return;
    // 注目度が高いほど声が掛かりやすい
    if (Math.random() > 0.06 + (g.hype || 0) / 100 * 0.22) return;
    const sp = cand[cand.length - 1];        // 条件を満たす中でいちばん大きいところ
    g.sponsorOffer = { name: sp.name, adv: Math.round(sp.per * 8), until: g.week + 4 };
    GP.sound.play('confirm');
    U.log(g, '📞 ' + sp.name + ' から契約のオファーが届いた！（「営業」で確認）', 'good');
    U.toast('📞 ' + sp.name + ' からオファー！', 'good');
  }

  /* ---------- 特別戦の誘い ---------- */
  function offerSpecial() {
    if (isRaceWeek() || g.nextRace >= D.TRACKS.length) return;
    if (g.week >= S.SEASON_WEEKS - 1) return;          // 最終盤には来ない
    if (Math.random() > 0.24) return;
    const pool = D.SPECIALS.filter(x => g.season >= x.minSeason);
    if (!pool.length) return;
    const sp = S.pick(pool);
    g.special = { key: sp.key, trackIndex: S.rint(0, D.TRACKS.length - 1) };
    U.log(g, sp.icon + ' 「' + sp.name + '」への招待が届いた！', 'good');
    U.toast(sp.icon + ' ' + sp.name + ' への招待が届いた！', 'good');
  }

  function specialOf(g2) {
    return g2.special ? D.SPECIALS.find(x => x.key === g2.special.key) : null;
  }

  function enterSpecial() {
    const sp = specialOf(g);
    if (!sp) return;
    if (g.funds < sp.entry) return U.toast('エントリー費が足りません', 'bad');
    g.funds -= sp.entry;
    beginRace(g.special.trackIndex, sp);
  }

  /* =======================================================
     コマンド：開発
     ======================================================= */
  const improveCost = p => Math.round(D.PART_CATS.find(c => c.key === p.cat).cost * (1 + p.power / 20));
  const designCost = () => ({
    money: Math.round(1000 + g.carGen * 2200),
    rp: Math.round(26 + g.carGen * 24)
  });

  let useTicket = false;

  function cmdDevelop() {
    const tk = g.tickets || 0;
    if (!tk) useTicket = false;
    const fc = S.focusOf(g);
    let body = interiorHTML('factory') +
      '<div class="sub">開発リソースの配分</div>' +
      '<p class="desc">今季の熟成に注ぐか、来季のマシンに前倒しで着手するか。' +
      '来季に回したぶんは、次の新型マシンの初期性能になります。</p>' +
      '<div class="focusrow">';
    D.FOCUS_LEVELS.forEach(f => {
      body += '<button class="focusbtn' + (f.key === g.focus ? ' on' : '') + '" data-focus="' + f.key + '"' +
        ' title="' + esc(f.desc) + '"><b>' + f.icon + ' ' + f.name + '</b>' +
        '<small>今季 ' + Math.round(f.cur * 100) + '%／来季 ' + Math.round(f.next * 100) + '%</small></button>';
    });
    const prog = Math.round(S.nextCarProgress(g) * 100);
    body += '</div>' +
      '<div class="nextcar"><span>🌱 来季マシンの仕込み</span>' +
      '<i><b style="width:' + prog + '%"></b></i><em>' + prog + '%</em></div>';
    if (tk) {
      body += '<div class="ticketbar' + (useTicket ? ' on' : '') + '" id="tkToggle">' +
        '<span class="tk-ic">🎫</span>' +
        '<span class="tk-body"><b>開発チケット ×' + tk + '</b>' +
        '<small>1枚使うと、次の開発・設計を資金も研究Pも使わずに行えます</small></span>' +
        '<span class="tk-sw">' + (useTicket ? '使う' : '使わない') + '</span></div>';
    }
    body += '<div class="sub">装着中パーツの改良</div><div class="pick">';
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (!p) {
        body += '<div class="pickbtn done"><span class="pb-ic ic-art" style="background:' + c.color + '">' + U.partIcon(c.key, 26, 0) + '</span>' +
          '<span class="pb-body"><b>' + c.name + '</b><small>パーツが未装着です</small></span><span class="pb-cost">—</span></div>';
        return;
      }
      const cost = improveCost(p), cap = S.partCap(g, p);
      const capped = p.power >= cap;
      const ok = useTicket || (g.funds >= cost && g.rp >= c.rp);
      // 供給を受けているパワーユニットは、こちらでは手を入れられない
      const locked = c.key === 'pu' && p.supplied;
      body += '<button class="pickbtn" data-k="imp:' + c.key + '"' + ((ok && !locked) ? '' : ' disabled') + '>' +
        '<span class="pb-ic ic-art" style="background:' + c.color + '">' + U.partIcon(c.key, 26, p.rar) + '</span>' +
        '<span class="pb-body"><b>' + esc(p.name) + '</b>' +
        '<small>' + c.name + '／性能 ' + Math.round(p.power) + ' / 上限 ' + cap +
        (locked ? ' <em class="warn">供給中は開発できません</em>'
                : (capped ? ' <em class="warn">上限到達</em>' : '')) + '</small></span>' +
        '<span class="pb-cost">' + (useTicket ? '<b class="free">🎫 無料</b>' : '💰' + money(cost) + '<br>🔬' + c.rp) + '</span></button>';
    });
    // ---- 車体開発 ----
    const cap = S.bodyCap(g);
    body += '</div><div class="sub">車体の熟成</div>' +
      '<p class="desc">パーツとは別に、車体そのものを煮詰めます。' +
      '上限は現在のマシン（' + D.CAR_GENS[g.carGen].name + '）で ' + cap + ' です。<br>' +
      '新型マシンを作ると上限が上がりますが、育て直しになります。</p><div class="pick">';
    D.BODY_ATTRS.forEach(a => {
      const v = (g.body && g.body[a.key]) || 0;
      const cost = bodyCost(v);
      const capped = v >= cap;
      const ok = useTicket || (g.funds >= cost && g.rp >= 8);
      const pct = Math.min(100, v / cap * 100);
      body += '<button class="pickbtn" data-k="bdy:' + a.key + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="pb-ic" style="background:' + a.color + '">' + a.icon + '</span>' +
        '<span class="pb-body"><b>' + a.name + '</b>' +
        '<small>' + a.desc + '<br><span class="skbar"><i style="width:' + pct + '%;background:' + a.color + '"></i></span> ' +
        Math.round(v * 10) / 10 + ' / ' + cap + (capped ? ' <em class="warn">上限到達</em>' : '') + '</small></span>' +
        '<span class="pb-cost">' + (useTicket ? '<b class="free">🎫 無料</b>' : '💰' + money(cost) + '<br>🔬8') + '</span></button>';
    });

    const dc = designCost();
    body += '</div><div class="sub">新しいパーツを設計する</div>' +
      '<p class="desc">デザイナーの腕が良いほど高レアリティのパーツができます。' +
      '完成したパーツは保管され、「マシン」から装着・合成できます。</p><div class="pick">';
    D.PART_CATS.forEach(c => {
      const ok = useTicket || (g.funds >= dc.money && g.rp >= dc.rp);
      body += '<button class="pickbtn" data-k="des:' + c.key + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="pb-ic ic-art" style="background:' + c.color + '">' + U.partIcon(c.key, 26, 0) + '</span>' +
        '<span class="pb-body"><b>' + esc(c.names[Math.min(c.names.length - 1, g.carGen)]) + ' を設計</b>' +
        '<small>' + c.name + '／' + D.CAR_GENS[g.carGen].name + '世代</small></span>' +
        '<span class="pb-cost">' + (useTicket ? '<b class="free">🎫 無料</b>' : '💰' + money(dc.money) + '<br>🔬' + dc.rp) + '</span></button>';
    });
    body += '</div>';
    U.modal('🔧 マシン開発', body, [{ label: 'やめる', fn: U.closeModal }]);
    paintInterior();
    const tg = $('tkToggle');
    if (tg) tg.onclick = () => { useTicket = !useTicket; GP.sound.play('tap'); cmdDevelop(); };
    Array.prototype.forEach.call($('modalBody').querySelectorAll('.focusbtn'), b => {
      b.onclick = () => {
        g.focus = b.dataset.focus;
        GP.sound.play('tap');
        const f = S.focusOf(g);
        U.log(g, '📐 開発方針を「' + f.icon + f.name + '」にした。');
        S.save(g); render(); cmdDevelop();
      };
    });
    bindPick(k => {
      const [kind, key] = k.split(':');
      if (kind === 'imp') doImprove(key);
      else if (kind === 'bdy') doBody(key);
      else doDesign(key);
    });
  }

  const bodyCost = v => Math.round(380 + v * 34);

  function doBody(key) {
    const a = D.BODY_ATTRS.find(x => x.key === key);
    if (!a || !g.body) return;
    const v = g.body[key] || 0;
    const cap = S.bodyCap(g);
    const cost = bodyCost(v);
    const free = spendTicket();
    if (!free) {
      if (g.funds < cost || g.rp < 8) return;
      g.funds -= cost; g.rp -= 8;
    }
    const facBonus = 1 + g.facilities.factory * 0.10 + g.facilities.tunnel * 0.06;
    const engBonus = 1 + S.staffBonus(g, 'engineer') * 0.12 + S.mgr(g, 'technical') * 0.008;
    const drvBonus = 1 + g.drivers.reduce((acc, d) => acc + S.persOf(d).dev, 0);
    const fc = S.focusOf(g);
    let gain = S.rnd(2.6, 4.2) * facBonus * engBonus * drvBonus;
    let crit = false;
    if (Math.random() < 0.10) { gain *= 2.2; crit = true; }
    if (v >= cap) gain *= 0.14;
    const toNext = gain * fc.next;
    gain = Math.round(gain * fc.cur * 10) / 10;
    g.nextCar = (g.nextCar || 0) + toNext;
    g.body[key] = Math.round((v + gain) * 10) / 10;

    U.closeModal();
    GP.sound.play(crit ? 'crit' : 'confirm');
    U.log(g, a.icon + ' 車体の' + a.name + ' +' + gain.toFixed(1) + (crit ? '  ✨大きな発見！' : ''), crit ? 'good' : '');
    U.pop('+' + gain.toFixed(1) + ' ' + a.name, crit ? 'crit' : 'good');
    if (crit) U.toast('✨ 車体の' + a.name + 'で大きな発見！', 'good');
    if (g.body[key] >= cap) U.toast('この車体は煮詰まりました。新型マシンが必要です。', 'warn');
    endWeek();
  }

  /* チケットを1枚消費する。使わない場合は false を返す */
  function spendTicket() {
    if (!useTicket || !(g.tickets > 0)) return false;
    g.tickets--;
    useTicket = false;
    GP.sound.play('coin');
    U.log(g, '🎫 開発チケットを1枚使った。（残り ' + g.tickets + ' 枚）');
    return true;
  }

  function doImprove(key) {
    const c = D.PART_CATS.find(x => x.key === key);
    const p = g.equipped[key];
    if (!p) return;
    const cost = improveCost(p), cap = S.partCap(g, p);
    const free = spendTicket();
    if (!free) {
      if (g.funds < cost || g.rp < c.rp) return;
      g.funds -= cost; g.rp -= c.rp;
    }

    const facBonus = 1 + g.facilities.factory * 0.10 +
      ((key === 'aero' || key === 'susp') ? g.facilities.tunnel * 0.12 : 0);
    const engBonus = 1 + S.staffBonus(g, 'engineer') * 0.14;
    // ドライバーのフィードバック（職人肌ほど的確）
    const drvBonus = 1 + g.drivers.reduce((a, d) => a + S.persOf(d).dev, 0);
    const fc = S.focusOf(g);
    let gain = S.rnd(3.4, 5.6) * facBonus * engBonus * drvBonus;
    let crit = false;
    if (Math.random() < 0.12) { gain *= 2.2; crit = true; }
    if (p.power >= cap) gain *= 0.16;
    // 来季に回したぶんは今季に乗らない
    const toNext = gain * fc.next;
    gain = Math.round(gain * fc.cur * 10) / 10;
    g.nextCar = (g.nextCar || 0) + toNext;

    p.power = Math.round((p.power + gain) * 10) / 10;
    p.cond = S.clamp(p.cond - S.rnd(2.5, 7) * (S.hasT(p, 'tough') ? 0.6 : 1), 10, 100);

    U.closeModal();
    const msg = c.icon + ' ' + p.name + ' の性能 +' + gain.toFixed(1) + (crit ? '  ✨ひらめき大成功！' : '');
    U.log(g, msg, crit ? 'good' : '');
    U.pop('+' + gain.toFixed(1), crit ? 'crit' : 'good');
    GP.sound.play(crit ? 'crit' : 'confirm');
    if (crit) U.toast('✨ ひらめいた！ 開発が大成功！', 'good');
    if (p.power >= cap) U.toast('このパーツは限界です。新型マシンか、より高レアなパーツが必要です。', 'warn');
    endWeek();
  }

  function doDesign(key) {
    const c = D.PART_CATS.find(x => x.key === key);
    const dc = designCost();
    if (g.inventory.length >= 24) { U.toast('保管庫がいっぱいです。「マシン」で合成・破棄しましょう。', 'warn'); return; }
    const free = spendTicket();
    if (!free) {
      if (g.funds < dc.money || g.rp < dc.rp) return;
      g.funds -= dc.money; g.rp -= dc.rp;
    }

    const rarity = S.rollRarity(g);
    const part = S.makePart(key, g.carGen, rarity);
    g.inventory.push(part);

    const rr = D.RARITY[rarity - 1];
    U.closeModal();
    U.log(g, '📐 ' + part.name + '（' + rr.name + '）が完成！ 性能 ' + Math.round(part.power), rarity >= 3 ? 'good' : '');
    GP.sound.play(rarity >= 4 ? 'crit' : 'confirm');
    if (rarity >= 4) U.toast('🎉 ' + rr.name + 'パーツ「' + part.name + '」が完成！', 'good');
    else U.toast('📐 ' + part.name + '（' + rr.name + '）が完成', rarity >= 3 ? 'good' : '');
    U.pop(U.stars(rarity), rarity >= 4 ? 'crit' : 'good');

    // 装着中より強ければすすめる
    const cur = g.equipped[key];
    if (!cur || S.partScore(part) > S.partScore(cur)) {
      U.toast('装着中の ' + (cur ? cur.name : '—') + ' より強力です！「マシン」で装着しましょう。', 'good');
    }
    endWeek();
  }

  /* =======================================================

      '<span class="pb-body"><b>データ解析</b><small>1週かけて研究ポイントを稼ぐ</small></span>' +

    body += '<div class="sub">新型マシンの開発</div>';
    body += '<p class="desc">現在のマシン：<b>' + cur.name + '</b>' +

        '<br>車体は新造され、前の知見を4割引き継いで再スタートします</small></span>' +
        '<span class="pb-cost">💰' + money(nx.cost) + '<br>🔬' + nx.rp + '</span></button></div>';
    }
    // ---- パワーユニットの供給 ----
    // 自前で育てるか、強いチームから買うか。買えばすぐ速くなるが、

    body += '<div class="sub">パワーユニットの供給</div>';

        '<small>性能 ' + (mine ? Math.round(mine.power) : '-') +
        '／供給料 💰' + money(g.engine.fee) + '万 毎戦</small></div>' +
        '<p class="desc">供給中は、自分でパワーユニットを開発・交換できません。' +
        '契約を切ると、自前のパワーユニットに戻ります。</p>' +
        '<div class="pick"><button class="pickbtn" data-k="__engoff">' +
        '<span class="pb-ic engic">✂️</span>' +
        '<span class="pb-body"><b>供給契約を切る</b>' +
        '<small>' + (g.engine.season === g.season ? '今季中の解約は違約金がかかります' : '違約金なし') +
        '</small></span><span class="pb-cost">' +
        (g.engine.season === g.season ? '💰' + money(engineBreakFee()) : '無料') +
        '</span></button></div>';

      const offers = engineOffers();

        body += '<p class="desc">いまは、こちらより強いパワーユニットを' +
          '分けてくれるチームがありません。</p>';

        body += '<p class="desc">強いチームからパワーユニットを買えます。' +
          'すぐに速くなりますが、供給中は自分で開発できず、毎戦の供給料がかかります。</p>' +
          '<div class="pick">';
        offers.forEach(o => {
          const ok = g.funds >= o.upfront;
          body += '<button class="pickbtn" data-k="__eng:' + esc(o.team) + '"' + (ok ? '' : ' disabled') + '>' +
            '<span class="pb-ic engic" style="border-color:' + o.color + '">🔌</span>' +
            '<span class="pb-body"><b>' + esc(o.team) + ' 製</b>' +
            '<small>性能 ' + o.power + '（いまの自前は ' + o.mine + '）' +
            '／供給料 💰' + money(o.fee) + '万 毎戦</small></span>' +

      }

    U.modal('🔬 研究開発', body, [{ label: 'やめる', fn: U.closeModal }]);

    bindPick(k => {
      if (k === '__gain') return doResearchGain();
      if (k === '__engoff') return doEngineOff();
      if (k.indexOf('__eng:') === 0) return doEngineOn(k.slice(6));
      return doNewCar();
    });
  }

  /* ---- エンジン供給 ---- */
  function engineBreakFee() {
    return Math.round((g.engine ? g.engine.fee : 0) * 6 + 900);
  }

  /* こちらより強いパワーユニットを持つチームの一覧。
     速いチームほど高く売る。                                        */
  function engineOffers() {
    const track = D.TRACKS[Math.min(g.nextRace, D.TRACKS.length - 1)];
    const teams = S.allTeams(g, track).filter(t => !t.isPlayer);
    if (!teams.length) return [];
    const scores = teams.map(t => t.car);
    const lo = Math.min.apply(null, scores), hi = Math.max.apply(null, scores);
    const cap = D.CAR_GENS[g.carGen].cap;
    const mine = g.equipped.pu ? Math.round(g.equipped.pu.power) : 0;
    return teams.map(t => {
      const rank01 = hi > lo ? (t.car - lo) / (hi - lo) : 0.5;
      const power = Math.round(cap * (0.55 + rank01 * 0.62));
      return {
        team: t.name, color: t.color, power: power, mine: mine, rank01: rank01,
        upfront: Math.round(1200 + power * 78 + rank01 * 2600),
        fee: Math.round(120 + power * 7 + rank01 * 190)
      };
    }).filter(o => o.power > mine + 2)
      .sort((a, b) => b.power - a.power)
      .slice(0, 4);
  }

  function doEngineOn(teamName) {
    const o = engineOffers().find(x => x.team === teamName);
    if (!o || g.funds < o.upfront) return;
    g.funds -= o.upfront;
    // 自前のパワーユニットは預けておき、契約を切ったら戻す
    g.engineStash = g.equipped.pu || null;
    g.equipped.pu = S.makePart('pu', g.carGen, 3, { power: o.power, name: o.team + ' PU' });
    g.equipped.pu.supplied = true;
    g.equipped.pu.name = o.team + ' 製 PU';
    g.engine = { team: o.team, fee: o.fee, power: o.power, season: g.season };
    U.closeModal();
    U.log(g, '🔌 ' + o.team + ' からパワーユニットの供給を受けることにした（性能 ' + o.power + '）');
    U.toast('🔌 ' + o.team + ' 製 PU を搭載', 'good');
    GP.sound.play('good');
    S.save(g); render();
  }

  function doEngineOff() {
    if (!g.engine) return;
    const fee = g.engine.season === g.season ? engineBreakFee() : 0;
    if (fee > g.funds) return U.toast('違約金が払えません', 'bad');
    g.funds -= fee;
    g.equipped.pu = g.engineStash || S.makePart('pu', g.carGen, 1, {});
    g.engineStash = null;
    const was = g.engine.team;
    g.engine = null;
    U.closeModal();
    U.log(g, '✂️ ' + was + ' との供給契約を切り、自前のパワーユニットに戻した' +
      (fee ? '（違約金 ' + money(fee) + '万）' : ''));
    S.save(g); render();
  }

  function doResearchGain() {
    const gain = Math.round(12 + S.staffBonus(g, 'analyst') * 4 + g.facilities.sim * 2 + S.rnd(-2, 6));
    g.rp += gain;
    U.closeModal();
    U.log(g, '🔬 データ解析を行った。研究P +' + gain);
    U.pop('🔬+' + gain, 'good');
    endWeek();
  }

  function doNewCar() {
    const nx = D.CAR_GENS[g.carGen + 1];
    if (!nx || g.rp < nx.rp || g.funds < nx.cost) return;
    g.rp -= nx.rp; g.funds -= nx.cost; g.carGen++;
    // 新車のシェイクダウンで各パーツのコンディションが整う
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (p) p.cond = S.clamp(p.cond + 15, 10, 100);
    });
    // 車体を新造する。前の車体の知見を4割引き継ぐ
    const prev = g.body;
    const stock = g.nextCar || 0;
    g.body = S.makeBody(g, prev, stock);
    if (stock > 0) {
      U.log(g, '🌱 前もって進めていた来季ぶんの開発が、新型マシンに反映された。', 'good');
    }
    g.nextCar = 0;
    U.closeModal();
    U.log(g, '🎊 新型マシン「' + nx.name + '」がロールアウト！ 車体の上限が ' +
      S.bodyCap(g) + ' に上がった（前の知見を引き継いで再スタート）', 'good');
    GP.sound.play('crit');
    U.toast('🎊 新型マシン「' + nx.name + '」ロールアウト！', 'good');
    U.pop('🏎️ ' + nx.name, 'crit');
    endWeek();
  }

  /* =======================================================
     コマンド：整備
     ======================================================= */
  function cmdMaintain() {
    const sum = D.PART_CATS.reduce((a, c) => a + (g.equipped[c.key] ? g.equipped[c.key].power : 0), 0);
    const cost = Math.round(400 + sum * 6);
    const body = interiorHTML('pit') +
      '<p class="lead">マシンを分解整備して信頼性を回復します。</p>' +
      '<div class="bigbox">現在の信頼性 <b>' + Math.round(S.reliability(g)) + '%</b></div>' +
      '<p class="desc">費用：💰' + money(cost) + '万（1週消費）<br>各パーツのコンディションが大きく回復します。</p>';
    U.modal('🛠️ 分解整備', body, [
      { label: '整備する', cls: 'primary', disabled: g.funds < cost, fn: () => doMaintain(cost) },
      { label: 'やめる', fn: U.closeModal }
    ]);
    paintInterior();
  }
  function doMaintain(cost) {
    g.funds -= cost;
    const mech = 1 + S.staffBonus(g, 'mechanic') * 0.2 + g.facilities.pit * 0.08;
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (p) p.cond = S.clamp(p.cond + S.rnd(16, 26) * mech, 10, 100);
    });
    U.closeModal();
    U.log(g, '🛠️ 分解整備を行った。信頼性 ' + Math.round(S.reliability(g)) + '%', 'good');
    U.pop('🛠️ 信頼性UP', 'good');
    endWeek();
  }

  /* =======================================================
     コマンド：練習
     ======================================================= */
  function cmdTrain() {
    if (!g.drivers.length) return U.toast('ドライバーがいません', 'bad');
    const menu = [['speed', '速さ', '🏎️'], ['technique', '技術', '🎯'], ['stamina', '体力', '💪'], ['mental', '精神', '🧠']];
    let body = interiorHTML('sim') +
      '<p class="lead">ドライバーと鍛える能力を選んでください。</p>';
    g.drivers.forEach((d, i) => {
      body += '<div class="trainrow"><div class="tr-nm">' + esc(d.name) + '<small>調子 ' + Math.round(d.form) + '</small></div><div class="tr-btns">';
      menu.forEach(m => { body += '<button class="pickbtn small" data-k="' + i + ':' + m[0] + '">' + m[2] + ' ' + m[1] + '</button>'; });
      body += '</div></div>';
    });
    const cost = 250 + g.facilities.sim * 60;
    body += '<p class="desc">費用：💰' + money(cost) + '万（1週消費）</p>';

    const scost = Math.round(2600 + g.season * 900);
    body += '<div class="sub">スキル特訓</div>' +
      '<p class="desc">集中特訓で新しいスキルを習得させます（1週消費・費用 💰' + money(scost) + '万）。<br>' +
      'トレーナーとシミュレーターが優秀なほど、良いスキルを覚えやすくなります。</p><div class="pick">';
    g.drivers.forEach((d, i) => {
      const full = (d.skills || []).length >= S.SKILL_MAX;
      const cand = S.learnableSkills(d);
      const ok = !full && cand.length && g.funds >= scost;
      body += '<button class="pickbtn" data-k="skill:' + i + '"' + (ok ? '' : ' disabled') + '>' +
        '<span class="pb-ic" style="background:#8a6ad0">🎓</span>' +
        '<span class="pb-body"><b>' + esc(d.name) + ' に特訓</b>' +
        '<small>習得済み ' + (d.skills || []).length + ' / ' + S.SKILL_MAX +
        (full ? '（スキル枠が満杯）' : '') + '</small></span>' +
        '<span class="pb-cost">💰' + money(scost) + '</span></button>';
    });
    body += '</div>';

    U.modal('💪 トレーニング', body, [{ label: 'やめる', fn: U.closeModal }], { wide: true });
    paintInterior();
    bindPick(k => {
      if (k.indexOf('skill:') === 0) doSkillTrain(+k.split(':')[1], scost);
      else doTrain(k, cost);
    });
  }

  function doSkillTrain(idx, cost) {
    const d = g.drivers[idx];
    if (!d || g.funds < cost) return;
    const cand = S.learnableSkills(d);
    if (!cand.length || (d.skills || []).length >= S.SKILL_MAX) return;
    g.funds -= cost;

    // トレーナーと施設が良いほど候補から複数回引き、良いスキルを引き当てやすい
    const tries = 1 + Math.min(3, Math.floor(S.staffBonus(g, 'trainer') * 0.8 + g.facilities.sim * 0.3));
    let best = null;
    for (let i = 0; i < tries; i++) {
      const pick = S.pick(cand);
      if (!best || Math.random() < 0.5) best = pick;
    }
    S.teachSkill(d, best.key);
    d.exp += 15; d.form = S.clamp(d.form - S.rnd(2, 6), 62, 122);
    levelCheck(d);
    U.closeModal();
    U.log(g, '🎓 ' + d.name + ' がスキル「' + best.name + '」を習得！', 'good');
    GP.sound.play('levelup');
    U.toast('🎓 ' + best.icon + ' ' + best.name + ' を習得！', 'good');
    U.pop('🎓 ' + best.name, 'crit');
    endWeek();
  }
  function doTrain(k, cost) {
    if (g.funds < cost) return U.toast('資金が足りません', 'bad');
    const [i, stat] = k.split(':');
    const d = g.drivers[+i];
    g.funds -= cost;
    const bonus = (1 + g.facilities.sim * 0.14 + S.staffBonus(g, 'trainer') * 0.16) * S.persOf(d).train;
    let gain = Math.round(S.rnd(2.2, 4.4) * bonus * (1 - d[stat] / 320) * 10) / 10;
    gain = Math.max(0.5, gain);
    if (Math.random() < 0.10) { gain *= 2.4; U.toast('🔥 特訓が実を結んだ！', 'good'); }
    d[stat] = S.clamp(d[stat] + gain, 1, 199);
    d.form = S.clamp(d.form - S.rnd(0, 4), 62, 122);
    d.exp += 8;
    d.salary = Math.round((d.speed + d.technique + d.stamina + d.mental) / 4 * 0.95 + 18);
    levelCheck(d);
    U.closeModal();
    const nm = { speed: '速さ', technique: '技術', stamina: '体力', mental: '精神' }[stat];
    U.log(g, '💪 ' + d.name + ' の' + nm + ' +' + gain.toFixed(1));
    U.pop('+' + gain.toFixed(1) + ' ' + nm, 'good');
    endWeek();
  }

     コマンド：営業（スポンサー）

      '<div class="hypebox"><span>' + ht.icon + ' メディアでの扱い <b style="color:' + ht.color + '">' + ht.name + '</b></span>' +
      '<span>スポンサー収入 <b>×' + S.hypeBonus(g).toFixed(2) + '</b></span></div>';
