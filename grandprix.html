<script>
/* ===== src/state.js ===== */
/* =========================================================
   ゲーム状態・ルール計算
   ========================================================= */
window.GP = window.GP || {};

GP.state = (function () {
  'use strict';
  const D = GP.data;
  const SAVE_KEY = 'gp_monogatari_save_v6';

  /* ---------- 乱数ユーティリティ ---------- */
  const rnd  = (a, b) => a + Math.random() * (b - a);
  const rint = (a, b) => Math.floor(rnd(a, b + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* =======================================================
     パーツ（アイテム）
     ======================================================= */
  let partSeq = 0;
  function makePart(catKey, gen, rarity, opts) {
    opts = opts || {};
    const cat = D.PART_CATS.find(c => c.key === catKey);
    const rr = D.RARITY[rarity - 1];
    const power = opts.power != null ? opts.power
      : Math.round((10 + gen * 13) * rr.mult * rnd(0.92, 1.10) * 10) / 10;
    const traits = [];
    if (opts.traits) traits.push.apply(traits, opts.traits);
    else {
      // レアリティが高いほど追加効果が付きやすい
      if (Math.random() < 0.10 + rarity * 0.07) traits.push(pick(D.PART_TRAITS).key);
      if (rarity >= 4 && Math.random() < 0.30) {
        const t = pick(D.PART_TRAITS).key;
        if (traits.indexOf(t) < 0) traits.push(t);
      }
    }
    return {
      id: 'p' + (++partSeq) + Math.random().toString(36).slice(2, 6),
      cat: catKey,
      name: cat.names[Math.min(cat.names.length - 1, gen)],
      gen: gen, rarity: rarity,
      power: power,
      cond: opts.cond != null ? opts.cond : 100,
      traits: traits
    };
  }

  const hasT = (p, k) => p.traits && p.traits.indexOf(k) >= 0;

  /* パーツ1つが生む3性能 */
  function partStats(p) {
    const cat = D.PART_CATS.find(c => c.key === p.cat);
    const st = {
      speed:  p.power * cat.gain.speed,
      corner: p.power * cat.gain.corner,
      accel:  p.power * cat.gain.accel
    };
    if (hasT(p, 'boost')) st.speed  *= 1.14;
    if (hasT(p, 'sharp')) st.corner *= 1.14;
    if (hasT(p, 'light')) st.accel  *= 1.16;
    return st;
  }

  /* 改良の上限（マシン世代 × レアリティ） */
  function partCap(g, p) {
    return Math.round(D.CAR_GENS[g.carGen].cap * D.RARITY[p.rarity - 1].capMult);
  }

  /* パーツの総合評価（表示用） */
  function partScore(p) {
    const st = partStats(p);
    return Math.round(st.speed + st.corner + st.accel);
  }

  /* 設計時のレアリティ抽選（デザイナーの腕で上振れする） */
  function rollRarity(g) {
    const dz = staffBonus(g, 'designer') + g.facilities.factory * 0.35 + mgr(g, 'technical') * 0.06;
    const w = [
      Math.max(6, 58 - dz * 5),
      26 + dz * 0.6,
      11 + dz * 2.0,
      4 + dz * 1.7,
      1 + dz * 0.8
    ];
    const total = w.reduce((a, b) => a + b, 0);
    let r = Math.random() * total;
    for (let i = 0; i < w.length; i++) { r -= w[i]; if (r <= 0) return i + 1; }
    return 1;
  }

  /* 才能の抽選。若手ほど当たり外れが大きい */
  function rollPotential(youth) {
    const r = Math.random();
    if (youth) {
      if (r < 0.34) return 1;
      if (r < 0.64) return 2;
      if (r < 0.86) return 3;
      if (r < 0.97) return 4;
      return 5;
    }
    if (r < 0.42) return 1;
    if (r < 0.76) return 2;
    if (r < 0.93) return 3;
    if (r < 0.99) return 4;
    return 5;
  }
  const potOf = d => D.POTENTIAL[(d.pot || 2) - 1] || D.POTENTIAL[1];

  /* ---------- 名前生成（同じ姓が並ばないようにする）---------- */
  let takenLast = new Set();
  const surnameOf = n => String(n).split('・').slice(1).join('・') || n;
  function resetNames(keepNames) {
    takenLast = new Set((keepNames || []).map(surnameOf));
  }
  function freshName() {
    for (let i = 0; i < 80; i++) {
      const last = pick(D.LAST);
      if (!takenLast.has(last)) { takenLast.add(last); return pick(D.FIRST) + '・' + last; }
    }
    return pick(D.FIRST) + '・' + pick(D.LAST);
  }

  /* ---------- ドライバー生成 ---------- */
  function makeDriver(level, opts) {
    opts = opts || {};
    const base = 18 + level * 9;
    const sp = (v) => clamp(Math.round(v + rnd(-7, 7)), 5, 190);
    const d = {
      id: 'd' + Math.random().toString(36).slice(2, 9),
      name: opts.name || freshName(),
      age: opts.age || rint(19, 34),
      speed: sp(base), technique: sp(base), stamina: sp(base), mental: sp(base),
      exp: 0, expLv: 1,
      form: 100,             // コンディション 60-120
      salary: 0,
      seasonPoints: 0, wins: 0, podiums: 0, races: 0,
      poles: 0, fastestLaps: 0, dnfs: 0, best: 99,
      nation: opts.nation || rint(0, D.NATIONS.length - 1),
      pot: opts.pot || rollPotential(opts.youth),
      pers: opts.pers || pick(D.PERSONALITIES).key,
      face: rint(0, 999999),          // 顔の見た目を決める種
      skills: opts.skills || rollSkills(level)
    };
    d.salary = Math.round((d.speed + d.technique + d.stamina + d.mental) / 4 * 0.95 + 18);
    return d;
  }

  /* ---------- スキル抽選 ---------- */
  const SKILL_MAX = 5;
  function rollSkills(level) {
    const n = level >= 6 ? 2 : (level >= 3 && Math.random() < 0.5 ? 2 : 1);
    const out = [];
    while (out.length < n) {
      const k = pick(D.SKILLS).key;
      if (out.indexOf(k) < 0) out.push(k);
    }
    return out;
  }
  const hasSkill = (d, k) => d.skills && d.skills.indexOf(k) >= 0;
  const persOf = d => D.PERSONALITIES.find(x => x.key === d.pers) || D.PERSONALITIES[0];
  const nationOf = d => D.NATIONS[d.nation] || D.NATIONS[0];

  /* レース結果を受けての調子の変化。性格で振れ幅が変わる */
  function reactToResult(d, pos, dnf) {
    const p = persOf(d);
    let delta;
    if (dnf) delta = -rnd(6, 12) * p.down;
    else if (pos === 1) delta = rnd(9, 16) * p.up;
    else if (pos <= 3) delta = rnd(5, 11) * p.up;
    else if (pos <= 10) delta = rnd(-1, 4) * (pos <= 6 ? p.up : p.down);
    else delta = -rnd(2, 6) * p.down;
    d.form = clamp(d.form + delta, 62, 122);
    return delta;
  }

  /* レース後のひとこと */
  function quoteFor(d, pos, dnf, avoid) {
    const set = D.QUOTES[d.pers] || D.QUOTES.cool;
    const bucket = (!dnf && pos === 1) ? 'win' : (!dnf && pos <= 10) ? 'ok' : 'bad';
    const lines = set[bucket].filter(l => !avoid || avoid.indexOf(l) < 0);
    return pick(lines.length ? lines : set[bucket]);
  }
  function learnableSkills(d) {
    return D.SKILLS.filter(s => !hasSkill(d, s.key));
  }
  function teachSkill(d, key) {
    if (!d.skills) d.skills = [];
    if (d.skills.length >= SKILL_MAX || hasSkill(d, key)) return false;
    d.skills.push(key);
    return true;
  }

  /* ---------- ドライバー総合力 ---------- */
  function driverRating(d) {
    let r = (d.speed * 0.34 + d.technique * 0.30 + d.stamina * 0.18 + d.mental * 0.18) * (d.form / 100);
    if (hasSkill(d, 'genius')) r *= 1.08;
    return r;
  }

  /* ---------- マシン性能の導出（装着パーツ＋マシン世代のベース）---------- */
  function carStats(g) {
    const s = { speed: 0, corner: 0, accel: 0 };
    // 空力コンセプトが良いほど、エアロパーツの効きも上がる
    const aeroBoost = 1 + bodyVal(g, 'aeroBody') * 0.004;
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (!p) return;
      const ps = partStats(p);
      // コンディションが落ちたパーツは本来の性能を出しきれない
      const f = (0.82 + p.cond / 100 * 0.18) * (c.key === 'aero' ? aeroBoost : 1);
      s.speed += ps.speed * f;
      s.corner += ps.corner * f;
      s.accel += ps.accel * f;
    });
    // 車体そのものが生む性能
    const bs = bodyStats(g);
    s.speed += bs.speed; s.corner += bs.corner; s.accel += bs.accel;
    return s;
  }

  /* =======================================================
     車体（マシン本体）
     ======================================================= */
  function bodyCap(g2) {
    return Math.round(D.CAR_GENS[g2.carGen].cap * D.BODY_CAP_RATIO);
  }
  /* 新しい車体を作る。前の知見を一部引き継ぐ */
  function makeBody(g2, prev, stock) {
    const cap = Math.round(D.CAR_GENS[g2.carGen].cap * D.BODY_CAP_RATIO);
    const b = { cond: 100 };
    // 事前に積み上げてあった「来季ぶんの開発」を4項目に振り分ける
    const advance = (stock || 0) * D.CARRY_TO_NEXT / D.BODY_ATTRS.length;
    D.BODY_ATTRS.forEach(a => {
      const carried = prev ? prev[a.key] * D.BODY_CARRY : 0;
      b[a.key] = Math.round(Math.min(cap, Math.max(cap * 0.15, carried) + advance) * 10) / 10;
    });
    return b;
  }
  /* 車体が生む3性能 */
  function bodyStats(g2) {
    const s = { speed: 0, corner: 0, accel: 0 };
    const b = g2.body || {};
    D.BODY_ATTRS.forEach(a => {
      const v = b[a.key] || 0;
      s.speed += v * a.gain.speed;
      s.corner += v * a.gain.corner;
      s.accel += v * a.gain.accel;
    });
    return s;
  }
  const bodyVal = (g2, key) => (g2.body && g2.body[key]) || 0;

  /* 開発リソースの配分 */
  function focusOf(g2) {
    return D.FOCUS_LEVELS.find(f => f.key === (g2.focus || 'now')) || D.FOCUS_LEVELS[0];
  }
  /* 来季マシンの仕上がり具合（0-100%）。次の車体の初期値に乗る */
  function nextCarProgress(g2) {
    const cap = Math.round(D.CAR_GENS[Math.min(D.CAR_GENS.length - 1, g2.carGen + 1)].cap * D.BODY_CAP_RATIO);
    return Math.max(0, Math.min(1, (g2.nextCar || 0) / (cap * 4)));
  }

  /* ---------- ERS（バッテリー）----------
     エレクトロニクスの性能と世代から、容量と1周あたりの回生量が決まる  */
  function ersOf(g2) {
    const p = g2.equipped && g2.equipped.elec;
    const pw = p ? p.power * (0.82 + p.cond / 100 * 0.18) : 10;
    // 冷却が良いほど電気を多く回せる。バッテリー開発はそれより直接効く
    return ersFrom(pw + bodyVal(g2, 'cooling') * 0.45 + bodyVal(g2, 'battery') * 0.95);
  }
  function ersFrom(power) {
    const E = D.ERS;
    return {
      capacity: Math.round(E.baseCapacity + power * E.capPerPower),
      recover: Math.round((E.recoverBase + power * E.recoverPerPower) * 10) / 10,
      deploy: Math.round((E.deployBase + power * E.deployPerPower) * 10) / 10,
      power: Math.round(power * 10) / 10
    };
  }

  /* ---------- マシン信頼性（0-100）---------- */
  function reliability(g) {
    let sum = 0, bonus = 0, n = 0;
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (!p) { sum += 40; n++; return; }
      sum += p.cond; n++;
      if (hasT(p, 'cool')) bonus += 4;
      if (hasT(p, 'tough')) bonus += 2;
    });
    const avg = sum / Math.max(1, n);
    const bodyRel = (bodyVal(g, 'rigidity') + bodyVal(g, 'cooling')) * 0.11;
    return clamp(avg + bonus + bodyRel + g.facilities.pit * 2.5 + staffBonus(g, 'mechanic') * 1.2 + mgr(g, 'pitchief') * 0.15, 5, 99);
  }

  /* ---------- パーツの消耗（レース後）---------- */
  function wearParts(g, amount) {
    D.PART_CATS.forEach(c => {
      const p = g.equipped[c.key];
      if (!p) return;
      const w = amount * (hasT(p, 'tough') ? 0.55 : 1);
      p.cond = clamp(p.cond - w, 5, 100);
    });
  }

  /* ---------- 3性能とコース適性からマシンスコアを出す ---------- */
  function carScoreOf(s, track) {
    return s.speed * track.weight.speed + s.corner * track.weight.corner + s.accel * track.weight.accel;
  }
  function carScore(g, track) { return carScoreOf(carStats(g), track); }

  /* ---------- スタッフ効果 ---------- */
  function staffBonus(g, key) {
    return g.staff.filter(s => s.type === key).reduce((a, s) => a + s.skill, 0) / 20;
  }

  /* =======================================================
     注目度（メディア露出）
     良い結果を出すほど話題になり、スポンサー収入が増え、
     大手が声を掛けてくるようになる。放っておくと少しずつ忘れられる。
     ======================================================= */
  function hypeTier(g2) {
    const h = g2.hype || 0;
    return D.HYPE_TIERS.find(t => h < t.max) || D.HYPE_TIERS[D.HYPE_TIERS.length - 1];
  }

  /* スポンサー収入にかかる倍率 */
  function hypeBonus(g2) {
    return 1 + (g2.hype || 0) / 100 * 0.6;
  }

  function addHype(g2, v) {
    g2.hype = clamp((g2.hype || 0) + v, 0, 100);
    return g2.hype;
  }

  /* 契約できるスポンサーか（ファン数と注目度の両方が要る） */
  function sponsorOpen(g2, sp) {
    return g2.fans >= sp.fans && (g2.hype || 0) >= (sp.hype || 0);
  }

  /* =======================================================
     マネジメント層
     ======================================================= */
  function makeManager(key, quality) {
    const m = D.MANAGERS.find(x => x.key === key) || D.MANAGERS[0];
    const skill = clamp(Math.round(10 + (quality || 0) * 0.32 + rnd(-5, 9)), 5, 60);
    return {
      id: 'm' + Math.random().toString(36).slice(2, 8),
      role: key, name: pick(D.FIRST) + '・' + pick(D.LAST),
      skill: skill,
      salary: Math.round(m.salary * (0.5 + skill / 46))
    };
  }
  /* 役職に就いている人の技能。空席なら0 */
  function mgr(g2, key) {
    const m = g2.managers && g2.managers[key];
    return m ? m.skill : 0;
  }

  /* ---------- 収支の内訳 ---------- */
  function finances(g2) {
    const staff = g2.staff.reduce((a, s) => a + s.salary, 0);
    const mgrs = D.MANAGERS.reduce((a, m) => a + (g2.managers && g2.managers[m.key] ? g2.managers[m.key].salary : 0), 0);
    const drivers = g2.drivers.reduce((a, d) => a + d.salary, 0);
    const youth = (g2.youth || []).reduce((a, d) => a + d.salary, 0);
    const facilities = D.FACILITIES.reduce((a, f) => a + g2.facilities[f.key] * 12, 0);
    // パワーユニットの供給料。1戦ぶんを週あたりにならす
    const engine = g2.engine ? Math.round(g2.engine.fee / raceWeek(0)) : 0;
    const other = 150;
    const raw = staff + mgrs + drivers + youth + facilities + engine + other;
    // ロジスティクス責任者は運営全体の費用を下げる
    const cut = Math.min(0.35, mgr(g2, 'logistics') * 0.010);
    const weekly = Math.round(raw * (1 - cut));

    // 1戦あたりのスポンサー収入（注目度・マーケ室・プリンシパル・難易度込み）
    const diff = diffOf(g2);
    const boost = hypeBonus(g2) * (1 + mgr(g2, 'principal') * 0.006);
    const scale = (1 + g2.facilities.market * 0.07) * boost * diff.sponsor;
    const perRace = Math.round(g2.sponsors.reduce((a, sp) => a + (sp.per || 0) * scale, 0));
    const rpRace = Math.round(g2.sponsors.reduce((a, sp) => a + (sp.rp || 0) * scale, 0));

    const PREP = raceWeek(0);                       // レース1回あたりの週数
    return {
      staff: staff, managers: mgrs, drivers: drivers, youth: youth,
      facilities: facilities, engine: engine, other: other, cut: cut,
      weekly: weekly,
      sponsorPerRace: perRace,
      sponsorRpPerRace: rpRace,
      // レース1回ぶん（準備週＋レース週）の収支
      cycleCost: weekly * PREP,
      cycleIncome: perRace,
      net: perRace - weekly * PREP
    };
  }

  /* ---------- 週あたりの固定費 ---------- */
  function weeklyCost(g) { return finances(g).weekly; }

  /* ---------- ライバルチーム生成 ---------- */
  function makeRivals(season, keepNames, diff) {
    resetNames(keepNames);
    const dp = diff ? diff.rivalPower : 1;
    const dg = diff ? diff.rivalGrow : 1;
    return D.RIVALS.map((r, i) => {
      const lv = (3 + season * 2.1 * dg) * r.power * dp;
      const base = (18 * r.power + season * 10 * r.power * dg) * dp + rnd(-4, 4);
      const t = {
        name: r.name, color: r.color, isPlayer: false, char: r.char,
        // 3性能の絶対値。コース適性込みの速さは carScoreOf() で算出する
        stats: {
          speed:  base * 3 * r.bias.speed,
          corner: base * 3 * r.bias.corner,
          accel:  base * 3 * r.bias.accel
        },
        rel: clamp(72 + r.power * 18 + season * 1.2 + rnd(-8, 8), 40, 97),
        // 作戦の性格。チームごとに固定なので、対戦を重ねると読めるようになる
        style: D.STRAT_STYLE_KEYS[(i + season) % D.STRAT_STYLE_KEYS.length],
        points: 0,
        drivers: [makeDriver(lv), makeDriver(lv * 0.92)]
      };
      t.drivers.forEach(d => { d.team = t.name; });
      return t;
    });
  }

  /* ---------- カレンダー ---------- */
  const PREP_WEEKS = 3;      // レース間の準備週
  function raceWeek(i) { return (i + 1) * (PREP_WEEKS + 1); }   // 第i戦(0-index)の週
  const SEASON_WEEKS = D.TRACKS.length * (PREP_WEEKS + 1);

  /* ---------- 新規ゲーム ---------- */
  const diffOf = g2 => D.DIFFICULTIES.find(x => x.key === (g2 && g2.mode)) || D.DIFFICULTIES[1];

  function newGame(teamName, color, mode) {
    const diff = D.DIFFICULTIES.find(x => x.key === mode) || D.DIFFICULTIES[1];
    const g = {
      version: 6,
      team: teamName || 'ニューカマーGP',
      color: color || '#e04a3f',
      season: 1,
      week: 1,
      mode: diff.key,
      funds: Math.round(17000 * diff.funds),
      tickets: 0,           // 開発チケット
      hype: 4,              // 注目度（メディア露出）0-100
      dryStreak: 0,         // 入賞できていないレース数
      youth: [],            // 下部組織の若手
      managers: {},         // 役職（空席から始まる）
      fans: 500,
      rp: 20,                       // 研究ポイント
      nextRace: 0,                  // 次のレースのindex
      points: 0,                    // 今季コンストラクターズポイント
      titles: { drivers: 0, teams: 0 },
      history: [],
      carGen: 0,
      body: null,
      focus: 'now',         // 開発リソースの配分
      nextCar: 0,           // 来季マシンに積み上げた開発量
      equipped: {}, inventory: [], facilities: {}, staff: [], drivers: [], sponsors: [],
      standings: [], results: [],
      log: [],
      flags: { firstWin: false, tutorial: true },
      trainedThisWeek: false
    };
    D.PART_CATS.forEach(c => { g.equipped[c.key] = makePart(c.key, 0, 1, { power: 10, cond: 92, traits: [] }); });
    g.body = makeBody(g, null);
    D.FACILITIES.forEach(f => { g.facilities[f.key] = 1; });

    resetNames([]);
    g.drivers = [makeDriver(2.2, { age: rint(22, 27) }), makeDriver(1.6, { age: rint(20, 25) })];
    // 開始時の2人はスキルも性格も別々にする
    if (g.drivers[0].skills[0] === g.drivers[1].skills[0]) {
      g.drivers[1].skills = [pick(D.SKILLS.filter(x => x.key !== g.drivers[0].skills[0])).key];
    }
    if (g.drivers[0].pers === g.drivers[1].pers) {
      g.drivers[1].pers = pick(D.PERSONALITIES.filter(x => x.key !== g.drivers[0].pers)).key;
    }
    g.drivers.forEach(d => { d.team = g.team; });

    g.staff = [makeStaff('engineer'), makeStaff('mechanic'), makeStaff('designer')];
    g.sponsors = [Object.assign({}, D.SPONSORS[0])];
    // イージーは産油国の大口スポンサーが最初から付く
    if (diff.oilSponsor) g.sponsors.push(Object.assign({}, D.OIL_SPONSOR));

    g.rivals = makeRivals(1, g.drivers.map(d => d.name), diff);
    // 最初から若手を1人抱えている
    g.youth = [makeYouth(1)];
    return g;
  }

  function makeStaff(type, quality) {
    const t = D.STAFF_TYPES.find(s => s.key === type);
    // チームの規模が大きいほど、良い人材が応募してくる
    const skill = clamp(Math.round(rint(8, 22) + (quality || 0) * 0.28), 5, 60);
    return {
      id: 's' + Math.random().toString(36).slice(2, 8),
      type: type, name: pick(D.FIRST) + '・' + pick(D.LAST),
      skill: skill, salary: Math.round(t.salary * (0.6 + skill / 30))
    };
  }

  /* =======================================================
     下部組織（ユースアカデミー）
     ======================================================= */
  function makeYouth(level) {
    const d = makeDriver(Math.max(0.3, level * 0.55), {
      age: rint(16, 20), youth: true
    });
    d.isYouth = true;
    d.trained = 0;                       // 育成を受けた週数
    d.salary = Math.round(d.salary * 0.35);
    return d;
  }

  /* 抱えられる若手の人数 */
  function youthSlots(g2) {
    return 1 + Math.floor(((g2.facilities && g2.facilities.youth) || 1) / 2);
  }

  /* 毎週の成長。才能とアカデミーのレベルで伸びが変わる */
  function growYouth(g2) {
    const lv = (g2.facilities && g2.facilities.youth) || 1;
    const trainer = staffBonus(g2, 'trainer');
    const grown = [];
    (g2.youth || []).forEach(d => {
      // 若いうちほど伸びる。24歳を過ぎるとほとんど伸びなくなる
      const ageMul = d.age <= 21 ? 1 : d.age <= 23 ? 0.55 : 0.12;
      const rate = potOf(d).growth * (0.55 + lv * 0.16 + trainer * 0.05) * ageMul;
      ['speed', 'technique', 'stamina', 'mental'].forEach(k => {
        d[k] = clamp(d[k] + rnd(0.15, 0.75) * rate * (1 - d[k] / 300), 1, 199);
      });
      d.trained++;
      d.exp += Math.round(3 * rate);
      d.salary = Math.round(((d.speed + d.technique + d.stamina + d.mental) / 4 * 0.95 + 18) * 0.35);
      grown.push(d);
    });
    return grown;
  }

  /* トップチームへ昇格 */
  function promoteYouth(g2, id) {
    const d = (g2.youth || []).find(x => x.id === id);
    if (!d || g2.drivers.length >= 2) return null;
    g2.youth = g2.youth.filter(x => x.id !== id);
    d.isYouth = false;
    d.team = g2.team;
    d.salary = Math.round((d.speed + d.technique + d.stamina + d.mental) / 4 * 0.95 + 18);
    g2.drivers.push(d);
    return d;
  }

  /* ---------- 契約更改（シーズン明け）----------
     活躍した人ほど報酬を要求する。強くなるほど維持費が重くなり、
     勝ち続けても資金が無限には積み上がらないようにする              */
  function renegotiate(g2, rank) {
    const scale = D.FACILITIES.reduce((a, f) => a + (g2.facilities[f.key] || 1), 0);
    // チームが大きく、順位が良いほど要求は強くなる
    const teamPull = 1 + Math.max(0, (11 - rank)) * 0.018 + scale * 0.004
                       + Math.max(0, Math.log10(Math.max(10, g2.fans)) - 3) * 0.05;
    const notes = [];
    g2.drivers.forEach(d => {
      // 本人の成績ぶん
      const own = 1 + Math.min(0.45, d.seasonPoints * 0.0022) + d.wins * 0.03;
      const before = d.salary;
      d.salary = Math.round(d.salary * Math.min(1.65, teamPull * own));
      if (d.salary > before) notes.push(d.name + ' ' + before + '→' + d.salary + '万');
    });
    g2.staff.forEach(st => { st.salary = Math.round(st.salary * Math.min(1.35, teamPull)); });
    D.MANAGERS.forEach(m => {
      const cur = g2.managers && g2.managers[m.key];
      if (cur) cur.salary = Math.round(cur.salary * Math.min(1.40, teamPull));
    });
    return notes;
  }

  /* ---------- スタッフの成長（シーズン明け）---------- */
  function growStaff(g) {
    const grown = [];
    g.staff.forEach(st => {
      if (Math.random() < 0.55) {
        const up = rint(1, 3);
        st.skill += up;
        const t = D.STAFF_TYPES.find(x => x.key === st.type);
        st.salary = Math.round(t.salary * (0.6 + st.skill / 30));
        grown.push(st.name + '（技能 ' + st.skill + '）');
      }
    });
    return grown;
  }

  /* ---------- 全チーム（自分＋ライバル）---------- */
  function allTeams(g, track) {
    const mine = carStats(g);
    const me = {
      name: g.team, color: g.color, isPlayer: true, char: machineChar(mine),
      stats: mine, car: carScoreOf(mine, track), rel: reliability(g),
      points: g.points, drivers: g.drivers
    };
    // ライバルのマシン評価はコースとの相性でその都度変わる
    const rivals = g.rivals.map(r => {
      r.car = carScoreOf(r.stats, track);
      return r;
    });
    return [me].concat(rivals);
  }

  /* 自チームのマシンがどの型かを判定する（表示用） */
  function machineChar(s) {
    const tot = Math.max(1, s.speed + s.corner + s.accel);
    const sp = s.speed / tot, co = s.corner / tot, ac = s.accel / tot;
    if (sp > 0.38) return 'パワー型';
    if (co > 0.38) return 'ダウンフォース型';
    if (ac > 0.38) return 'トラクション型';
    if (sp > co && sp > ac) return 'ロードラッグ寄り';
    if (co > ac) return 'コーナー重視';
    return 'オールラウンド';
  }

  /* ---------- コンストラクターズ順位表 ---------- */
  function constructorTable(g) {
    const rows = [{ name: g.team, color: g.color, points: g.points, isPlayer: true }]
      .concat(g.rivals.map(r => ({ name: r.name, color: r.color, points: r.points, isPlayer: false })));
    rows.sort((a, b) => b.points - a.points);
    return rows;
  }

  /* ---------- ドライバーズ順位表 ---------- */
  function driverTable(g) {
    let rows = [];
    g.drivers.forEach(d => rows.push({ name: d.name, team: g.team, color: g.color, points: d.seasonPoints, isPlayer: true }));
    g.rivals.forEach(t => t.drivers.forEach(d =>
      rows.push({ name: d.name, team: t.name, color: t.color, points: d.seasonPoints, isPlayer: false })));
    rows.sort((a, b) => b.points - a.points);
    return rows;
  }

  /* ---------- セーブ・ロード ---------- */
  function save(g) {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(g)); return true; }
    catch (e) { return false; }
  }
  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      const g = JSON.parse(raw);
      return (g && g.version === 6) ? g : null;
    } catch (e) { return null; }
  }
  function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }

  return {
    rnd, rint, pick, clamp,
    makeDriver, makeStaff, makeRivals, driverRating, resetNames, growStaff,
    diffOf, potOf, rollPotential, renegotiate, makeYouth, youthSlots, growYouth, promoteYouth,
    hypeTier, hypeBonus, addHype, sponsorOpen,
    makeManager, mgr, finances, ersOf, ersFrom,
    bodyCap, makeBody, bodyStats, bodyVal, focusOf, nextCarProgress,
    makePart, partStats, partCap, partScore, rollRarity, wearParts, hasT,
    rollSkills, hasSkill, learnableSkills, teachSkill, SKILL_MAX,
    persOf, nationOf, reactToResult, quoteFor,
    carStats, carScore, carScoreOf, machineChar, reliability, staffBonus, weeklyCost,
    newGame, allTeams, constructorTable, driverTable,
    raceWeek, SEASON_WEEKS, PREP_WEEKS,
    save, load, wipe
  };
})();

</script>
<script>
/* ===== src/race.js ===== */
/* =========================================================
   レースシミュレーション（予選＋決勝）
   ラップ単位で全車のタイムを積み上げ、結果とドラマを生成する
   ========================================================= */
window.GP = window.GP || {};

GP.race = (function () {
  'use strict';
  const D = GP.data, S = GP.state;

  const STRATEGIES = {
    safe:    { name: '安全第一', icon: '🛡️', pace: -0.006, risk: 0.55, tyre: 0.80 },
    balance: { name: 'バランス', icon: '⚖️', pace: 0.000,  risk: 1.00, tyre: 1.00 },
    attack:  { name: '攻める',   icon: '🔥', pace: 0.009,  risk: 1.85, tyre: 1.25 }
  };

  /* ---------- エントリーリスト作成 ---------- */
  function buildEntries(g, track, weather, strategy) {
    const teams = S.allTeams(g, track);
    const list = [];
    teams.forEach((t, ti) => {
      t.drivers.forEach((d, di) => {
        const strat = t.isPlayer ? (strategy[d.id] || 'balance') : autoStrategy(t, track);
        const st = STRATEGIES[strat];
        const sk = k => S.hasSkill(d, k);
        let drv = S.driverRating(d);
        // スキルによる補正
        if (sk('rain') && (weather.key === 'rain' || weather.key === 'storm')) drv *= 1.18;
        const perf = t.car * 0.60 + drv * 0.40;

        const stats = t.stats || { speed: 1, corner: 1, accel: 1 };
        list.push({
          id: t.isPlayer ? d.id : (t.name + di),
          driver: d, team: t, color: t.color, isPlayer: !!t.isPlayer,
          num: list.length + 1,
          stats: stats,
          // このマシンがコース上でどう速度を出すか。区間タイムの配分もここから来る
          prof: GP.geom.speedProfile(track, stats),
          gen: t.isPlayer ? g.carGen : Math.min(D.CAR_GENS.length - 1, Math.round((t.car - 12) / 26)),
          perf: perf, strat: strat, st: st, sk: sk,
          startTyre: t.isPlayer ? (strategy['tyre_' + d.id] || null) : null,
          // 作戦の性格（ライバル）と、プレイヤーが選んだピット回数・タイヤの狙い
          style: t.style || 'balanced',
          stopPlan: t.isPlayer ? (strategy['stops_' + d.id] || 'auto') : null,
          tyrePlan: t.isPlayer ? (strategy['tbias_' + d.id] == null ? 1
                                  : parseInt(strategy['tbias_' + d.id], 10)) : null,
          rel: t.rel,
          tyreSkill: (sk('tyre') ? 0.55 : 1) * (1 - d.technique / 420),
          lapTimes: [], cum: [], pits: [], sectors: [], bestSec: [Infinity, Infinity, Infinity],
          dnf: false, dnfLap: -1, dnfReason: '',
          grid: 0, pos: 0, fastest: Infinity
        });
      });
    });
    return list;
  }

  const tyreOf = key => D.TYRES.find(t => t.key === key) || D.TYRES[1];

  /* このスティント（区間）を走りきるのに向いたタイヤを選ぶ。
     攻めるチームは寿命ぎりぎりの速いタイヤを、
     堅実なチームは余裕のある硬いタイヤを選ぶ                        */
  function pickTyre(stintLaps, weather, prefer, bias) {
    if (weather.key === 'storm') return 'wet';
    if (weather.key === 'rain') return 'inter';
    if (prefer && D.DRY_TYRES.indexOf(prefer) >= 0) return prefer;
    const fit = D.DRY_TYRES.map(k => tyreOf(k)).filter(t => t.life >= stintLaps * 0.9);
    if (!fit.length) return 'hard';
    // bias 0=攻め（寿命ぎりぎりの速いタイヤ） 1=バランス 2=堅実（余裕のある硬いタイヤ）
    const i = bias >= 2 ? fit.length - 1 : bias === 1 ? Math.floor((fit.length - 1) / 2) : 0;
    return fit[i].key;
  }

  function autoStrategy(team, track) {
    const r = Math.random();
    if (r < 0.2) return 'safe';
    if (r < 0.75) return 'balance';
    return 'attack';
  }

  /* ---------- 天候抽選 ---------- */
  function rollWeather(track) {
    const r = Math.random() * (0.9 + track.tyre * 0.1);
    if (r < 0.52) return D.WEATHER[0];
    if (r < 0.78) return D.WEATHER[1];
    if (r < 0.94) return D.WEATHER[2];
    return D.WEATHER[3];
  }

  /* ---------- 予選 ---------- */
  function qualify(entries, track, weather) {
    entries.forEach(e => {
      let q = e.perf;
      if (e.sk('qualify')) q *= 1.07;
      q *= (0.94 + Math.random() * 0.12) * weather.grip;
      q *= (1 - (1 - e.driver.mental / 260) * (weather.chaos - 1) * 0.08);
      e.qScore = q;
      e.qTime = track.base * (1 + (0.02 + (140 - q) * 0.0009));
    });
    entries.sort((a, b) => b.qScore - a.qScore);
    entries.forEach((e, i) => { e.grid = i + 1; });
    return entries.slice();
  }

  /* ---------- 決勝シミュレーション ---------- */
  function simulate(g, trackIndex, strategy, special) {
    const track = D.TRACKS[trackIndex];
    const weather = special && special.force
      ? (D.WEATHER.find(w => w.key === special.force) || rollWeather(track))
      : rollWeather(track);
    weather.wetTyres = (weather.key === 'rain' || weather.key === 'storm');
    const entries = buildEntries(g, track, weather, strategy);
    const grid = qualify(entries, track, weather);
    const laps = Math.max(4, Math.round(track.laps * (special ? special.lapMul : 1)));
    const events = [];
    const bestSector = [Infinity, Infinity, Infinity];   // セッション最速（紫）
    const bestSectorBy = [null, null, null];
    // 追い抜きやすさ：最長ストレートの長さ（実際の形状）と、コースの速度特性から決める
    const geo = GP.geom.analyze(track);
    const passEase = 0.25 + geo.longestShare * 1.1 + track.weight.speed * 0.5;
    const E = D.ERS;
    // ストレートが長いコースほど、放電を速さに変えやすい
    const ersScale = 0.7 + geo.longestShare * 1.6;
    const refPerf = Math.max.apply(null, entries.map(e => e.perf)) + 4;
    const pitLoss = 20.5 - g.facilities.pit * 0.7 - S.staffBonus(g, 'mechanic') * 0.4 - S.mgr(g, 'pitchief') * 0.06;
    const strategist = S.staffBonus(g, 'strategist');

    // ピット戦略とタイヤの割り当て
    entries.forEach(e => {
      const wear = track.tyre * e.st.tyre * e.tyreSkill;
      // コースとマシンから決まる「素直な」ストップ回数
      const natural = (wear > 1.05 || laps > 28) ? 2 : 1;
      let stops = natural;
      e.tyreBias = 1;
      e.react = 0.45;                     // アンダーカットを仕掛ける積極性

      if (e.isPlayer) {
        // プレイヤーは自分で選べる。'auto' ならコース任せ
        const want = e.stopPlan;
        if (want === '1' || want === '2' || want === '3') stops = parseInt(want, 10);
        e.tyreBias = e.tyrePlan == null ? 1 : e.tyrePlan;
        e.react = 0.5 + strategist * 0.12;
      } else {
        // ライバルはチームごとの性格に従う。性格はシーズンを通して変わらない
        const st = D.STRAT_STYLES[e.style] || D.STRAT_STYLES.balanced;
        if (st.random) {                  // 型破りなチームだけは毎回読めない
          stops = S.clamp(natural + S.rint(-1, 1), 1, 3);
          e.tyreBias = S.rint(0, 2);
        } else {
          stops = S.clamp(natural + st.stopBias, 1, 3);
          e.tyreBias = st.tyreBias;
        }
        e.react = st.react;
        e.pitShift = st.random ? S.rnd(-0.1, 0.1) : st.pitShift;
      }
      e.stops = stops;

      const blur = e.isPlayer ? Math.max(0, 1.6 - strategist * 0.5) : 1.4;
      const shift = e.pitShift || 0;
      e.pitPlan = [];
      for (let i = 1; i <= stops; i++) {
        // 等分だと毎回同じ周回になるので、性格ぶんの前倒し／引っ張りを乗せる
        const frac = i / (stops + 1) * (1 + shift);
        e.pitPlan.push(S.clamp(Math.round(laps * frac + S.rnd(-blur, blur)), 2, laps - 2));
      }
      e.pitPlan.sort((a, b) => a - b);
      e.pitLoss = pitLoss - (e.isPlayer ? strategist * 0.5 : 0);
      e.tyreAge = 0;
      e.startBoost = (e.sk('start') ? 2.2 : 0) + e.driver.technique / 200;

      // 各スティントの長さから履くタイヤを決める。最初のスティントだけは指定できる
      const bounds = [0].concat(e.pitPlan, [laps]);
      e.stints = [];
      for (let i = 0; i < bounds.length - 1; i++) {
        const len = bounds[i + 1] - bounds[i];
        const prefer = (i === 0 && e.isPlayer) ? e.startTyre : null;
        e.stints.push({ from: bounds[i] + 1, to: bounds[i + 1],
                        key: pickTyre(len, weather, prefer, e.tyreBias), laps: len });
      }
      // ドライレースでは2種類以上のタイヤを使わなければならない（実際のF1のルール）
      if (!weather.wetTyres && e.stints.length >= 2) {
        const keys = e.stints.map(x => x.key);
        if (keys.every(k => k === keys[0])) {
          // いちばん短いスティントを、別の銘柄に差し替える
          let si = 0;
          for (let i = 1; i < e.stints.length; i++) if (e.stints[i].laps < e.stints[si].laps) si = i;
          const st2 = e.stints[si];
          const alt = D.DRY_TYRES.map(k => tyreOf(k))
            .filter(t => t.key !== keys[0] && t.life >= st2.laps * 0.85);
          st2.key = alt.length ? alt[0].key
            : (keys[0] === 'hard' ? 'medium' : 'hard');
          st2.forced = true;
        }
      }
      e.tyreKey = e.stints[0].key;
      e.stintIdx = 0;
      e.lapTyre = [];       // 各周のタイヤと使用周回数（観戦画面の表示に使う）
      e.pitTime = [];       // 各周のピット停止時間
      e.lapErs = [];        // 各周のバッテリー残量
      // ERS：エレクトロニクスの性能が高いほど容量も回生量も大きい
      const elecPower = e.isPlayer
        ? S.ersOf(g).power
        : (e.stats.accel * 0.42 + e.stats.speed * 0.12);
      const ers = S.ersFrom(elecPower);
      e.ersCap = ers.capacity;
      e.ersRecover = ers.recover;
      e.ersDeploy = ers.deploy;
      e.battery = ers.capacity;   // 満充電でスタート
    });

    let order = grid.slice();
    const posHistory = [];

    for (let lap = 1; lap <= laps; lap++) {
      order.forEach(e => {
        if (e.dnf) return;

        // 基準ラップタイム
        let t = track.base * (1 + (refPerf - e.perf) * 0.00092);
        t *= (1 - e.st.pace);
        t /= weather.grip;

        // タイヤの銘柄によるペース差
        const ty = tyreOf(e.tyreKey);
        t *= ty.pace;

        // タイヤ摩耗。寿命を超えると急激にタレる
        e.tyreAge++;
        t += track.base * e.tyreAge * 0.00075 * track.tyre * e.tyreSkill * e.st.tyre * ty.wear;
        const over = e.tyreAge - ty.life;
        if (over > 0) t += track.base * over * over * 0.0006 * e.tyreSkill;
        e.lapTyre[lap - 1] = { key: e.tyreKey, age: e.tyreAge, life: ty.life };

        // スタミナ低下（終盤）— アイアンマンは影響を受けない
        if (lap > laps * 0.6 && !e.sk('stamina')) {
          t += track.base * 0.0006 * (1 - e.driver.stamina / 200) * (lap - laps * 0.6);
        }

        // ラストスパート
        if (e.sk('spurt') && lap > laps * 0.8) t *= 0.994;

        // ERS：溜まっている電気を放電して速さに変える。
        // 前の車に迫っているときは多めに使う（前周の差で判定）
        const want = e.ersDeploy * (e.chasing ? E.attackMul : 1);
        const use = Math.min(e.battery, want);
        e.battery = Math.min(e.ersCap, e.battery - use + e.ersRecover);
        t *= (1 - use * E.gainPerUnit * ersScale);
        e.lapErs[lap - 1] = { level: Math.round(e.battery), cap: e.ersCap, used: Math.round(use) };

        // ランダム（精密機械はブレが小さい）
        const jitter = e.sk('precise') ? 0.45 : 1;
        t += track.base * S.rnd(-0.0035, 0.0045) * jitter * weather.chaos * (1 - e.driver.mental / 400);

        // スタート（1周目）
        if (lap === 1) t += e.grid * 0.42 - e.startBoost + track.base * 0.10;

        // ピットイン（新しいタイヤに履き替える）
        let pitAdd = 0;
        if (e.pitPlan.indexOf(lap) >= 0) {
          const loss = e.pitLoss + S.rnd(-0.8, 2.2) + (Math.random() < 0.035 ? S.rnd(3, 9) : 0);
          t += loss;
          pitAdd = loss;
          e.tyreAge = 0;
          e.pits.push(lap);
          e.stintIdx = Math.min(e.stints.length - 1, e.stintIdx + 1);
          e.tyreKey = e.stints[e.stintIdx].key;
          if (e.isPlayer) {
            const nt = tyreOf(e.tyreKey);
            events.push({ lap, type: 'pit', car: e,
              text: e.driver.name + ' ピットイン！ ' + nt.name + 'に交換 (' + loss.toFixed(1) + '秒)' });
          }
        }
        e.pitTime[lap - 1] = pitAdd;

        e.lapTimes[lap - 1] = t;
        const prev = lap === 1 ? 0 : e.cum[lap - 2];
        e.cum[lap - 1] = prev + t;
        if (lap > 1 && t < e.fastest) e.fastest = t;

        // 区間タイム：走行ぶんはマシンの速度プロファイルの配分で割り、
        // ピットでの停止時間は最終セクターにまとめて足す
        const sh = e.prof.share;
        const drive = t - pitAdd;
        const sec = [drive * sh[0], drive * sh[1], drive * sh[2] + pitAdd];
        e.sectors[lap - 1] = sec;
        for (let k = 0; k < 3; k++) {
          if (lap > 1 && sec[k] < e.bestSec[k]) e.bestSec[k] = sec[k];
          if (lap > 1 && sec[k] < bestSector[k]) { bestSector[k] = sec[k]; bestSectorBy[k] = e.id; }
        }
      });

      // ブロッキング（前車に詰まると遅くなる＝抜きにくいコースほど顕著）
      const running = order.filter(e => !e.dnf).sort((a, b) => a.cum[lap - 1] - b.cum[lap - 1]);
      running.forEach(e => { e.chasing = false; });
      for (let i = 1; i < running.length; i++) {
        const gap = running[i].cum[lap - 1] - running[i - 1].cum[lap - 1];
        // 2秒以内なら次の周はERSを多めに使って仕掛ける
        if (gap > 0 && gap < 2.0) running[i].chasing = true;
        // ---- 追い抜きの攻防 ----
        // 0.8秒以内まで詰めたら仕掛ける。コースの性格で、
        // 「ストレートで刺す」か「コーナーで飛び込む」かが変わる。
        if (gap > 0 && gap < 0.55) {
          const atk = running[i], def = running[i - 1];
          // ストレートが長いコースほど、直線勝負になりやすい
          const onStraight = Math.random() < Math.min(0.88, 0.15 + passEase * 0.85);
          const batt = atk.ersCap ? atk.battery / atk.ersCap : 0;

          let p = 0.035 + (atk.perf - def.perf) * 0.007 + (0.55 - gap) * 0.22;
          if (onStraight) {
            // 直線：電気が残っているほど伸びる。スリップストリームも効く
            p += 0.07 + batt * 0.16 + geo.longestShare * 0.46;
          } else {
            // コーナー：腕とマシンのコーナー性能がものを言う
            p += (atk.driver.technique - def.driver.technique) * 0.004
               + (atk.stats.corner - def.stats.corner) * 0.0012;
          }
          if (atk.sk('passer')) p += 0.12;
          if (def.sk('heart')) p -= 0.08;             // 勝負強い相手は簡単には譲らない
          if (atk.st && atk.st.push) p += (atk.st.push - 1) * 0.10;
          // コースの抜きやすさで全体を大きく上下させる。
          // 市街地では滅多に抜けず、直線の長いコースでは何度も入れ替わる。
          p *= 0.18 + passEase * 1.24;
          p = S.clamp(p, 0.01, 0.80);

          if (Math.random() < p) {
            // 成功：前に出る。詰まっていた時間もここで解ける
            atk.cum[lap - 1] = def.cum[lap - 1] - S.rnd(0.08, 0.28);
            atk.passes = (atk.passes || 0) + 1;
            if (atk.isPlayer || def.isPlayer) {
              events.push({ lap: lap, type: 'pass', car: atk,
                text: atk.driver.name + (onStraight
                  ? ' ストレートで ' + def.driver.name + ' を刺した！'
                  : ' コーナーで ' + def.driver.name + ' の内に飛び込んだ！') });
            }
          } else {
            // 失敗：抜けずに詰まる。コーナーで無理をすると足を痛める
            let stuck = (0.55 - gap) * (2.1 - passEase * 0.8);
            if (atk.sk('passer')) stuck *= 0.55;
            atk.cum[lap - 1] += stuck;
            if (!onStraight && Math.random() < 0.05 + (atk.st ? (atk.st.push - 1) * 0.05 : 0)) {
              const miss = S.rnd(0.7, 2.3);
              atk.cum[lap - 1] += miss;
              atk.tyreAge += 0.6;                     // 無理をするとタイヤも傷む
              if (atk.isPlayer) {
                events.push({ lap: lap, type: 'miss', car: atk,
                  text: atk.driver.name + ' 仕掛けきれずにコースを外れかけた…（-' +
                        miss.toFixed(1) + '秒）' });
              }
            }
          }
        }

        // ---- アンダーカット ----
        // 前の車に詰まっていて、抜きにくいコースで、自分のピット予定が近いなら、
        // 1周早く入って新しいタイヤで前に出ることを狙う。
        // 逆に前の車が先に入ったら、こちらは引っ張って（オーバーカット）応じる。
        const me = running[i], ahead = running[i - 1];
        if (!me.dnf && me.pitPlan.length && gap > 0 && gap < 2.6 && passEase < 0.95) {
          const next = me.pitPlan.find(l => l > lap);
          if (next != null && next - lap <= 3 && next > lap + 1 &&
              Math.random() < me.react * 0.34) {
            me.pitPlan[me.pitPlan.indexOf(next)] = lap + 1;
            me.pitPlan.sort((a, b) => a - b);
            me.undercut = (me.undercut || 0) + 1;
            if (me.isPlayer || ahead.isPlayer) {
              events.push({ lap: lap + 1, type: 'pit', car: me,
                text: me.driver.name + ' アンダーカットを狙って1周早くピットへ！' });
            }
          }
        }
      }

      // リタイア判定
      order.forEach(e => {
        if (e.dnf || lap < 2) return;
        const mech = (100 - e.rel) / 100 * 0.0022 * track.risk * (e.sk('feeler') ? 0.55 : 1);
        const crash = (1 - e.driver.mental / 230) * 0.0011 * track.risk * weather.chaos * e.st.risk
                      * (e.sk('heart') ? 0.40 : 1);
        const r = Math.random();
        if (r < mech) {
          e.dnf = true; e.dnfLap = lap; e.dnfReason = S.pick(['エンジンブロー', 'ギアボックストラブル', '油圧系トラブル', 'MGU-K故障', 'ブレーキトラブル']);
          events.push({ lap, type: 'dnf', car: e, text: e.driver.name + ' が' + e.dnfReason + 'でリタイア…' });
        } else if (r < mech + crash) {
          e.dnf = true; e.dnfLap = lap; e.dnfReason = S.pick(['クラッシュ', 'コースアウト', '接触']);
          events.push({ lap, type: 'dnf', car: e, text: e.driver.name + ' が' + e.dnfReason + '！ ここでレースを終える…' });
        }
      });

      // 順位変動の記録
      const newOrder = order.filter(e => !e.dnf).sort((a, b) => a.cum[lap - 1] - b.cum[lap - 1]);
      if (lap > 1) {
        newOrder.forEach((e, i) => {
          const prevIdx = posHistory[posHistory.length - 1].indexOf(e.id);
          if (prevIdx >= 0 && prevIdx > i && e.isPlayer) {
            const victim = newOrder[i + 1];
            if (victim) events.push({ lap, type: 'pass', car: e, text: e.driver.name + ' が ' + victim.driver.name + ' をオーバーテイク！ → ' + (i + 1) + '位' });
          }
        });
      }
      posHistory.push(newOrder.map(e => e.id));
      order = newOrder.concat(order.filter(e => e.dnf));
    }

    // 最終結果
    const finishers = entries.filter(e => !e.dnf).sort((a, b) => a.cum[laps - 1] - b.cum[laps - 1]);
    const retired = entries.filter(e => e.dnf).sort((a, b) => b.dnfLap - a.dnfLap);
    const classified = finishers.concat(retired);
    classified.forEach((e, i) => { e.pos = i + 1; });

    let fl = null;
    finishers.forEach(e => { if (!fl || e.fastest < fl.fastest) fl = e; });

    return {
      track, trackIndex, weather, laps, grid, entries, classified, finishers,
      events, fastestLap: fl, geo: geo, passEase: passEase, special: special || null,
      bestSector: bestSector, bestSectorBy: bestSectorBy,
      totalTime: laps * track.base * 1.05
    };
  }

  /* ---------- レース結果をゲームに反映 ---------- */
  function applyResult(g, res) {
    const notes = [];
    const sp = res.special;
    const diff = S.diffOf(g);
    let prize = 0, fanDelta = 0;

    // ファステストラップは10位以内で完走した場合のみ1点（実際のF1と同じ扱い）
    const flCar = res.fastestLap;
    const flScores = !!(flCar && !flCar.dnf && flCar.pos <= D.POINTS.length);

    res.classified.forEach(e => {
      let pts = (!e.dnf && e.pos <= D.POINTS.length) ? D.POINTS[e.pos - 1] : 0;
      const gotFL = flCar && e.id === flCar.id;
      if (gotFL && flScores) pts += D.FASTEST_LAP_POINT;
      // 特別戦は選手権とは無関係。ポイントも通算成績も動かない
      e.points = sp ? 0 : pts;
      e.flPoint = !sp && gotFL && flScores;
      if (!sp) {
        e.driver.seasonPoints += pts;
        e.driver.races++;
        if (e.grid === 1) e.driver.poles = (e.driver.poles || 0) + 1;
        if (gotFL) e.driver.fastestLaps = (e.driver.fastestLaps || 0) + 1;
        if (e.dnf) e.driver.dnfs = (e.driver.dnfs || 0) + 1;
        else {
          if (e.pos === 1) e.driver.wins++;
          if (e.pos <= 3) e.driver.podiums++;
          if (e.pos < (e.driver.best || 99)) e.driver.best = e.pos;
        }
      }
      // 結果を受けての調子の変化は全ドライバーに等しく起きる
      S.reactToResult(e.driver, e.pos, e.dnf);
      if (e.isPlayer) {
        if (!sp) g.points += pts;
        const base = (800 + pts * 470 + (e.dnf ? 0 : Math.max(0, 1300 - e.pos * 50))) * diff.prize;
        prize += sp ? base * sp.prize : base;
        let gain = 12 + Math.max(0, 22 - e.pos) + (e.dnf ? 0 : 8);
        if (sp) gain = Math.round(gain * sp.lapMul) + (sp.exp || 0);
        e.driver.exp += Math.round(gain * (S.hasSkill(e.driver, 'grower') ? 1.5 : 1));
      } else if (!sp) {
        e.team.points += pts;
      }
    });

    // ファン増減
    const best = res.classified.filter(e => e.isPlayer).sort((a, b) => a.pos - b.pos)[0];
    if (best) {
      if (best.pos === 1)      { fanDelta = Math.round(600 + g.fans * 0.16); notes.push('🏆 優勝！ 街中が歓喜に包まれた！'); }
      else if (best.pos <= 3)  { fanDelta = Math.round(300 + g.fans * 0.09); notes.push('🥉 表彰台！ ファンが増えた！'); }
      else if (best.pos <= 10) { fanDelta = Math.round(120 + g.fans * 0.04); notes.push(sp ? '完走。手応えは残った。' : 'ポイント獲得。着実にファンが増えている。'); }
      else                     { fanDelta = -Math.round(30 + g.fans * 0.02); notes.push(sp ? '結果は振るわなかった…' : 'ノーポイント…ファンが少し離れてしまった。'); }
      if (sp) fanDelta = Math.round(Math.max(0, fanDelta) * sp.fans + 60 * sp.fans);
    }

    // ---- 注目度（露出）----
    // 入賞できなくても、より上位でゴールすれば話題にはなる
    let hypeDelta = 0;
    res.classified.filter(e => e.isPlayer).forEach(e => {
      if (e.dnf) { hypeDelta -= 2; return; }
      hypeDelta += (D.HYPE_BY_POS[e.pos - 1] || 0.2);
      if (e.grid === 1) hypeDelta += 3;                       // ポールポジション
      if (e.flPoint || (res.fastestLap && res.fastestLap.id === e.id)) hypeDelta += 3;
      const gained = e.grid - e.pos;
      if (gained > 0) hypeDelta += Math.min(6, gained * 0.4); // 追い上げも評価される
    });
    if (sp) hypeDelta *= 0.6;                                  // 特別戦は選手権より扱いが小さい
    hypeDelta *= (1 + S.mgr(g, 'principal') * 0.004);          // 発信力のあるプリンシパルほど話題になる
    const beforeTier = S.hypeTier(g).name;
    S.addHype(g, hypeDelta);
    const afterTier = S.hypeTier(g).name;
    if (afterTier !== beforeTier) {
      notes.push('📣 メディアでの扱いが「' + afterTier + '」に変わった！ スポンサー収入が伸びる。');
      res.hypeUp = afterTier;
    }
    res.hypeDelta = hypeDelta;

    // スポンサー報酬（種別によって資金・研究P・ファンのどれが入るかが変わる）
    const hb = S.hypeBonus(g) * (1 + S.mgr(g, 'principal') * 0.006);
    const spScale = (1 + g.facilities.market * 0.07) * hb * (sp ? 0.4 : 1) * diff.sponsor;
    let sponsorIncome = 0, sponsorRp = 0, sponsorFans = 0;
    g.sponsors.forEach(s2 => {
      sponsorIncome += (s2.per || 0) * spScale;
      sponsorRp     += (s2.rp || 0) * spScale;
      sponsorFans   += (s2.fan || 0) * spScale;
      // 達成ボーナスは契約上、シーズンあたりの回数に上限がある
      const hits = s2.hits || 0;
      if (!sp && best && !best.dnf && best.pos <= s2.need && hits < D.SPONSOR_BONUS_CAP) {
        s2.hits = hits + 1;
        sponsorIncome += (s2.bonus || 0);
        sponsorRp += (s2.bonusRp || 0);
        const kind = D.SPONSOR_KINDS[s2.kind] || D.SPONSOR_KINDS.cash;
        notes.push(kind.icon + ' ' + s2.name + ' の目標達成ボーナス！ +' +
          Math.round(s2.bonus || 0) + '万' + (s2.bonusRp ? ' / 研究P +' + s2.bonusRp : '') +
          '（今季 ' + s2.hits + '/' + D.SPONSOR_BONUS_CAP + '回目）');
      }
    });
    sponsorIncome = Math.round(sponsorIncome);
    sponsorRp = Math.round(sponsorRp);
    sponsorFans = Math.round(sponsorFans);
    fanDelta += sponsorFans;

    // パーツの消耗
    S.wearParts(g, S.rnd(1.5, 4.5) * res.track.risk * (sp ? sp.wear : 1));

    // 入賞できない状態が続いたら、開発チケットが届く（選手権のみ）
    if (!sp) {
      const scored = res.classified.some(e => e.isPlayer && !e.dnf && e.points > 0);
      if (scored) {
        g.dryStreak = 0;
      } else {
        g.dryStreak = (g.dryStreak || 0) + 1;
        if (g.dryStreak >= diff.ticket) {
          g.dryStreak = 0;
          g.tickets = (g.tickets || 0) + 1;
          notes.push('🎫 苦戦が続いたチームに開発チケットが届いた！（開発・設計を1回無料で行える）');
          res.gotTicket = true;
        }
      }
    }

    // 初優勝フラグ
    if (!sp && best && best.pos === 1 && !g.flags.firstWin) {
      g.flags.firstWin = true;
      notes.push('🎉 チーム初優勝！ 記念すべき一勝が刻まれた！');
    }

    g.funds += prize + sponsorIncome;
    g.fans = Math.max(0, g.fans + fanDelta);
    g.rp += (sp ? sp.rp : 8) + Math.round(S.staffBonus(g, 'analyst') * 2) + sponsorRp;

    res.reward = { prize, sponsorIncome, sponsorRp, sponsorFans, fanDelta, notes };
    if (!sp) g.results.push({
      season: g.season, round: res.trackIndex + 1, track: res.track.name,
      weather: res.weather.name,
      rows: res.classified.slice(0, 22).map(e => ({
        pos: e.pos, name: e.driver.name, team: e.team.name, color: e.color,
        grid: e.grid, pts: e.points, dnf: e.dnf, isPlayer: e.isPlayer,
        fl: !!e.flPoint || !!(res.fastestLap && res.fastestLap.id === e.id)
      }))
    });
    return res.reward;
  }

  return { simulate, applyResult, STRATEGIES, rollWeather };
})();

<script>
/* ===== src/raceview.js ===== */
/* =========================================================
   レース観戦ビュー（Canvasでドット絵の車が周回する）
   ========================================================= */
window.GP = window.GP || {};

GP.raceview = (function () {
  'use strict';

  let cv, ctx, res, poly, trackArt = null, raf = null;
  let emissive = [];        // ネオンなど、明示的に光らせたいもの（世界座標）
  let standalone = false;   // レース外で1台だけ描いているとき（カメラが無い）
  let vt = 0, speed = 95, running = false, onEnd = null, lastTs = 0, lights = 0, chequer = 0, duration = 1;
  let shownEvents = 0;

  /* ---------- コース形状（geom.js と共有）---------- */
  function buildPoly(path, w, h, pad) { return GP.geom.buildPoly(path, w, h, pad); }

  /* コース上の距離割合 f (0..1) から座標と進行方向を得る */
  function pointAt(f) {
    f = f - Math.floor(f);
    const target = f * poly.len;
    let lo = 0, hi = poly.n;
    while (lo < hi - 1) { const m = (lo + hi) >> 1; if (poly.cum[m] <= target) lo = m; else hi = m; }
    return interp(lo, (target - poly.cum[lo]) / (poly.ds[lo] || 1));
  }

  /* 折れ線の index 番目から t だけ進んだ位置 */
  function interp(i, t) {
    const a = poly.pts[i % poly.n], b = poly.pts[(i + 1) % poly.n];
    return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t, ang: Math.atan2(b[1] - a[1], b[0] - a[0]), i: i };
  }

  /* ---------- 1周の中での位置 ----------
     各車の速度プロファイル（コーナーで減速し直線で伸びる）に沿って
     時間 → コース上の位置 を引く。プロファイルはマシンの3性能で変わるので、
     ダウンフォース型はコーナーで、パワー型は直線で前に出る。            */
  function placeInLap(e, frac) {
    const prof = e._prof;
    if (!prof) return pointAt(frac);
    frac = frac - Math.floor(frac);
    const cumT = prof.cumT;
    let lo = 0, hi = prof.n;
    while (lo < hi - 1) { const m = (lo + hi) >> 1; if (cumT[m] <= frac) lo = m; else hi = m; }
    const span = cumT[lo + 1] - cumT[lo] || 1;
    const r = interp(lo, (frac - cumT[lo]) / span);
    r.v = prof.v[lo] / prof.vmax;      // 0..1 の現在速度（描画に使う）
    // 少し先の向きとの差＝ハンドルの切れ角。前輪を曲げて描くのに使う
    const ah = interp((lo + 3) % prof.n, 0).ang;
    let d = ah - r.ang;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    r.steer = Math.max(-0.5, Math.min(0.5, d * 1.6));
    return r;
  }

  /* ---------- 各車の周回進捗 ---------- */
  function progress(e, t) {
    if (e.dnf && e.dnfLap > 0 && t >= (e.cum[e.dnfLap - 1] || 0)) {
      return { done: true, p: e.dnfLap };
    }
    const n = e.cum.length;
    if (t >= e.cum[n - 1]) return { done: true, p: n };
    let lap = 0;
    while (lap < n && e.cum[lap] <= t) lap++;
    const prev = lap === 0 ? 0 : e.cum[lap - 1];
    const lt = e.lapTimes[lap] || 1;
    return { done: false, p: lap + (t - prev) / lt };
  }

  /* いま何周目のどのあたりを走っているか */
  function lapInfo(e, t) {
    const n = e.cum.length;
    let lap = 0;
    while (lap < n && e.cum[lap] <= t) lap++;
    if (lap >= n) lap = n - 1;
    const prev = lap === 0 ? 0 : e.cum[lap - 1];
    return { lap: lap + 1, into: t - prev, lapTime: e.lapTimes[lap] || 1 };
  }

  /* ピット作業中か（その周のピット停止時間ぶんを、周の終わりに割り当てている） */
  function inPit(e, t) {
    if (e.dnf && t >= (e.cum[e.dnfLap - 1] || 0)) return false;
    const li = lapInfo(e, t);
    const pt = (e.pitTime || [])[li.lap - 1] || 0;
    if (pt <= 0) return false;
    return li.into > li.lapTime - pt;
  }

  /* いま履いているタイヤ */
  function tyreNow(e, t) {
    const li = lapInfo(e, t);
    return (e.lapTyre || [])[li.lap - 1] || (e.lapTyre || [])[0] || null;
  }

  function orderAt(t) {
    return res.entries.slice().map(e => {
      const pr = progress(e, t);
      return { e, p: pr.p, done: pr.done, out: e.dnf && t >= (e.cum[e.dnfLap - 1] || 0) };
    }).sort((a, b) => {
      if (a.out !== b.out) return a.out ? 1 : -1;
      return b.p - a.p;
    });
  }

  /* =========================================================
     コースの描き込み（背景・縁石・グリッド・ピット・DRS区間）
     静止物なので一度だけ裏画面に描き、毎フレームはコピーするだけにする
     ========================================================= */
  function normalAt(i) {
    const a = poly.pts[i % poly.n], b = poly.pts[(i + 1) % poly.n];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy) || 1;
    return { nx: -dy / L, ny: dx / L, x: a[0], y: a[1], dx: dx / L, dy: dy / L };
  }

  function strokeOn(g, width, color, dash) {
    g.strokeStyle = color; g.lineWidth = width; g.lineJoin = 'round'; g.lineCap = 'round';
    g.setLineDash(dash || []);
    g.beginPath();
    g.moveTo(poly.pts[0][0], poly.pts[0][1]);
    for (let i = 1; i < poly.n; i++) g.lineTo(poly.pts[i][0], poly.pts[i][1]);
    g.closePath(); g.stroke();
    g.setLineDash([]);
  }

  /* 彩度と明度をいじる（HD-2Dは地面を深く沈めて、光った所を際立たせる） */
  function grade(hex, satMul, valMul) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16 & 255) / 255, g2 = (n >> 8 & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g2, b), mn = Math.min(r, g2, b), l = (mx + mn) / 2;
    r = l + (r - l) * satMul; g2 = l + (g2 - l) * satMul; b = l + (b - l) * satMul;
    const cl = v => Math.max(0, Math.min(255, Math.round(v * valMul * 255)));
    return '#' + ((1 << 24) + (cl(r) << 16) + (cl(g2) << 8) + cl(b)).toString(16).slice(1);
  }

  /* レース画面用に色を作り直す。メニュー側のテーマ色はそのまま使う */
  function hdTheme(base) {
    return {
      sky:  grade(base.sky,  1.35, base.night ? 0.92 : 0.80),
      dot:  grade(base.dot,  1.45, base.night ? 0.86 : 0.72),
      edge: grade(base.edge, 1.9,  0.80),      // 白いランオフは光りすぎるので暖色に落とす
      road: grade(base.road, 1.25, 0.68),      // 路面を深く沈めて明暗差を作る
      night: base.night
    };
  }

  /* 世界座標へ移すカメラ変換。描画と発光レイヤーで同じものを使う */
  function camTransform(g) {
    g.translate(cv.width / 2, cv.height / 2);
    g.scale(cam.z, cam.z);
    g.translate(-cam.x, -cam.y);
  }

  function buildTrackArt() {
    emissive = [];
    const th = hdTheme(GP.data.THEMES[GP.data.TRACK_THEME[res.track.name] || 'grass']);
    const wet = res.weather.key === 'rain' || res.weather.key === 'storm';
    const c = document.createElement('canvas');
    c.width = cv.width; c.height = cv.height;
    const g = c.getContext('2d');

    // 地面
    g.fillStyle = wet && !th.night ? shade(th.sky, -0.22) : th.sky;
    g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = wet && !th.night ? shade(th.dot, -0.22) : th.dot;
    for (let y = 0; y < c.height; y += 8) for (let x = (y % 16 ? 0 : 4); x < c.width; x += 16) g.fillRect(x, y, 4, 4);

    // コースの外に景色を置く。
    // 影を実際のシルエットから作りたいので、いったん別レイヤーに描く。
    const pl = document.createElement('canvas');
    pl.width = c.width; pl.height = c.height;
    const pg = pl.getContext('2d');
    pg.imageSmoothingEnabled = false;
    drawScenery(pg, GP.data.TRACK_THEME[res.track.name] || 'grass', c.width, c.height);

    // 落ち影：同じ絵を真っ黒にして、光の向きへ少しずつずらして重ねる。
    // 一枚ずつは薄いが、重なって奥に伸びる影になる（HD-2Dらしさの要）。
    if (GP.fx.supportsBlur()) {
      const sil = document.createElement('canvas');
      sil.width = c.width; sil.height = c.height;
      const sg = sil.getContext('2d');
      sg.filter = 'brightness(0)';
      sg.drawImage(pl, 0, 0);
      sg.filter = 'none';
      g.save();
      g.globalAlpha = 0.10;
      for (let k = 1; k <= 6; k++) g.drawImage(sil, k * 2.4, k * 1.5);
      g.restore();
      // 景色そのものは彩度を上げ、明度を落として地面になじませる
      g.save();
      g.filter = 'saturate(1.3) brightness(0.86)';
      g.drawImage(pl, 0, 0);
      g.filter = 'none';
      g.restore();
    } else {
      g.save();
      g.globalAlpha = 0.16;
      for (let k = 1; k <= 4; k++) { g.globalAlpha = 0.055; g.drawImage(pl, k * 2.4, k * 1.5); }
      g.restore();
      g.drawImage(pl, 0, 0);
    }

    // ---- ランオフ ----
    strokeOn(g, 34, shade(th.edge, -0.06));
    strokeOn(g, 30, th.edge);
    // ランオフの砂利／アスファルトの粒
    g.save();
    g.beginPath();
    g.lineWidth = 30; g.lineJoin = 'round'; g.lineCap = 'round';
    g.moveTo(poly.pts[0][0], poly.pts[0][1]);
    for (let i = 1; i < poly.n; i++) g.lineTo(poly.pts[i][0], poly.pts[i][1]);
    g.closePath();
    g.clip();
    const rn2 = seeded(res.track.name + 'runoff');
    for (let i = 0; i < 900; i++) {
      const x = rn2() * c.width, y = rn2() * c.height;
      g.fillStyle = rn2() > 0.5 ? 'rgba(255,255,255,.10)' : 'rgba(0,0,0,.10)';
      g.fillRect(x, y, 2, 2);
    }
    g.restore();

    // ---- 路面 ----
    strokeOn(g, 24, shade(th.road, -0.22));                 // 路肩の締まり
    strokeOn(g, 22, wet ? shade(th.road, -0.18) : th.road);
    // コース幅を示す白線。ここで先に引いておく
    // （レーシングラインより後に引くと、路面色で塗り潰してしまう）
    strokeOn(g, 20.5, 'rgba(255,255,255,.40)');
    strokeOn(g, 19, wet ? shade(th.road, -0.18) : th.road);

    // アスファルトの粒。同じ模様が続かないよう、路面の内側だけに散らす
    g.save();
    g.beginPath();
    g.lineWidth = 21; g.lineJoin = 'round'; g.lineCap = 'round';
    g.moveTo(poly.pts[0][0], poly.pts[0][1]);
    for (let i = 1; i < poly.n; i++) g.lineTo(poly.pts[i][0], poly.pts[i][1]);
    g.closePath();
    g.clip();
    const rn3 = seeded(res.track.name + 'asphalt');
    for (let i = 0; i < 2600; i++) {
      const x = rn3() * c.width, y = rn3() * c.height;
      const v = rn3();
      g.fillStyle = v > 0.62 ? 'rgba(255,255,255,.055)'
                 : v > 0.30 ? 'rgba(0,0,0,.07)' : 'rgba(120,130,150,.05)';
      g.fillRect(x, y, 2, 2);
    }
    // 補修跡（つぎはぎ）
    for (let i = 0; i < 14; i++) {
      const t = rn3(), idx = Math.floor(t * poly.n), nm = normalAt(idx);
      g.save();
      g.translate(nm.x, nm.y); g.rotate(Math.atan2(nm.dy, nm.dx));
      g.fillStyle = 'rgba(20,22,28,.16)';
      g.fillRect(-6 - rn3() * 10, -9, 12 + rn3() * 20, 18);
      g.restore();
    }
    g.restore();

    // ---- レーシングライン ----
    // 何周も走ると、走行ラインにタイヤのゴムが乗って黒い筋になる。
    // コーナーではイン側へ寄るので、旋回の向きに合わせて線をずらす。
    const off = new Array(poly.n);
    for (let i = 0; i < poly.n; i++) {
      const a = poly.pts[(i - 3 + poly.n) % poly.n], b = poly.pts[i], d = poly.pts[(i + 3) % poly.n];
      const cross = (b[0] - a[0]) * (d[1] - b[1]) - (b[1] - a[1]) * (d[0] - b[0]);
      const k = (res.geo.kappa && res.geo.kappa[i]) || 0;
      off[i] = (cross > 0 ? -1 : 1) * Math.min(6.5, k * 9);
    }
    // 実際の走行ラインは滑らかなので、前後をならす
    const soff = new Array(poly.n);
    for (let i = 0; i < poly.n; i++) {
      let sum = 0;
      for (let d = -14; d <= 14; d++) sum += off[(i + d + poly.n) % poly.n];
      soff[i] = sum / 29;
    }
    for (const [w, alpha] of [[10, 0.13], [6, 0.17], [3, 0.14]]) {
      g.strokeStyle = 'rgba(24,22,26,' + alpha + ')';
      g.lineWidth = w; g.lineJoin = 'round'; g.lineCap = 'round';
      g.beginPath();
      for (let i = 0; i <= poly.n; i++) {
        const j = i % poly.n, nm = normalAt(j);
        const x = nm.x + nm.nx * soff[j], y = nm.y + nm.ny * soff[j];
        if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
      }
      g.closePath(); g.stroke();
    }

    // ---- 中央の破線 ----
    strokeOn(g, 2, 'rgba(255,255,255,.24)', [6, 10]);

    // ---- 縁石（コーナー区間の内外両側）----
    // 平らな赤白だと板に見えるので、下に影・内側に段差・上面に照りを入れて
    // 「路面から盛り上がっている」ように見せる。
    (res.geo.corners || []).forEach(cn => {
      let i = cn.from, steps = 0;
      const span = (cn.to - cn.from + poly.n) % poly.n;
      while (steps <= span && steps < poly.n) {
        const nm = normalAt(i);
        const red = (steps >> 1) % 2 === 0;
        for (const sgn of [1, -1]) {
          g.save();
          g.translate(nm.x + nm.nx * sgn * 12, nm.y + nm.ny * sgn * 12);
          g.rotate(Math.atan2(nm.dy, nm.dx));
          g.fillStyle = 'rgba(0,0,0,.34)';                     // 落ち影
          g.fillRect(-1.5, -2.8 + sgn * 0.8, 4.4, 6);
          g.fillStyle = red ? '#b32b1c' : '#c9c2ad';           // 側面（段差）
          g.fillRect(-1.5, -2.8, 4.2, 6);
          g.fillStyle = red ? '#e8402c' : '#f6f2e4';           // 上面
          g.fillRect(-1.5, -2.8, 4.2, 4.4);
          g.fillStyle = red ? 'rgba(255,150,120,.55)'          // 上面の照り
                            : 'rgba(255,255,255,.65)';
          g.fillRect(-1.5, -2.8, 4.2, 1.2);
          g.restore();
        }
        i = (i + 1) % poly.n; steps++;
      }
    });

    // DRS区間（最長ストレート）の路面表示
    const L = res.geo.longest;
    if (L && L.len > 0) {
      let i = L.from, steps = 0;
      const span = (L.to - L.from + poly.n) % poly.n;
      while (steps <= span && steps < poly.n) {
        if (steps % 6 < 3) {
          const nm = normalAt(i);
          g.fillStyle = 'rgba(90,190,255,.45)';
          g.fillRect(nm.x + nm.nx * 8 - 1, nm.y + nm.ny * 8 - 1, 2, 2);
          g.fillRect(nm.x - nm.nx * 8 - 1, nm.y - nm.ny * 8 - 1, 2, 2);
        }
        i = (i + 1) % poly.n; steps++;
      }
      const s0 = normalAt(L.from);
      g.fillStyle = '#5abeff'; g.strokeStyle = '#1a3a5a'; g.lineWidth = 1;
      g.save();
      g.translate(s0.x + s0.nx * 20, s0.y + s0.ny * 20);
      g.fillRect(-7, -4, 14, 8); g.strokeRect(-7, -4, 14, 8);
      g.fillStyle = '#0a2036'; g.font = 'bold 6px sans-serif'; g.textAlign = 'center';
      g.fillText('DRS', 0, 2);
      g.restore();
    }

    // ピットレーン：スタート地点を含む最長ストレートの内側に収める
    const pit = pitSpan();
    if (pit) {
      // ピットレーンに沿った線を引くための道具
      const lane = (dist, width, color, dash) => {
        g.strokeStyle = color; g.lineWidth = width;
        g.lineJoin = 'round'; g.lineCap = 'butt';
        g.setLineDash(dash || []);
        g.beginPath();
        for (let k = 0; k <= pit.len; k++) {
          const nm = normalAt((pit.from + k) % poly.n);
          const x = nm.x + nm.nx * pit.side * dist, y = nm.y + nm.ny * pit.side * dist;
          if (k === 0) g.moveTo(x, y); else g.lineTo(x, y);
        }
        g.stroke();
        g.setLineDash([]);
      };

      lane(20, 13, '#4c4f56');                       // 縁の締まり
      lane(20, 11, '#6d7078');                       // 路面
      lane(20, 11.5, 'rgba(255,255,255,.42)');       // いったん白で塗り
      lane(20, 10, '#6d7078');                       //   中を戻して両端に白線を残す
      lane(20, 1.2, 'rgba(255,255,255,.30)', [4, 5]);// 中央の破線

      // ピットボックス（各チームの作業区画）
      for (let k = 4; k < pit.len - 3; k += 7) {
        const nm = normalAt((pit.from + k) % poly.n);
        g.save();
        g.translate(nm.x + nm.nx * pit.side * 25, nm.y + nm.ny * pit.side * 25);
        g.rotate(Math.atan2(nm.dy, nm.dx));
        g.fillStyle = 'rgba(255,255,255,.34)';       // 区画の枠線
        g.fillRect(-3.4, -4.5, 6.8, 0.9);
        g.fillRect(-3.4, 3.6, 6.8, 0.9);
        g.fillRect(-3.4, -4.5, 0.9, 9);
        g.restore();
      }

      // ピットウォール（コース側の壁）。上面に照りを入れて立たせる
      lane(14, 2.6, '#8d8578');
      lane(13.4, 1.2, '#d8d2c0');

      // 入口と出口の白線
      [0, pit.len].forEach(k => {
        const nm = normalAt((pit.from + k) % poly.n);
        g.save();
        g.translate(nm.x + nm.nx * pit.side * 20, nm.y + nm.ny * pit.side * 20);
        g.rotate(Math.atan2(nm.dy, nm.dx));
        g.fillStyle = 'rgba(255,255,255,.60)';
        g.fillRect(-1, -5.5, 2, 11);
        g.restore();
      });
      for (let k = 5; k < pit.len - 4; k += 7) {
        const nm = normalAt((pit.from + k) % poly.n);
        g.save();
        g.translate(nm.x + nm.nx * pit.side * 28, nm.y + nm.ny * pit.side * 28);
        g.rotate(Math.atan2(nm.dy, nm.dx));
        g.fillStyle = '#efe6cc'; g.fillRect(-3, -4, 6, 8);
        g.fillStyle = '#4a2f1a'; g.fillRect(-3, -4, 6, 1);
        g.restore();
      }
    }

    // スタートグリッド（スタートラインの手前に千鳥で並べる）
    for (let n = 0; n < 22; n++) {
      const back = 6 + Math.floor(n / 2) * 7;
      const idx = (poly.n - back) % poly.n;
      const nm = normalAt(idx);
      const sgn = n % 2 === 0 ? 1 : -1;
      g.save();
      g.translate(nm.x + nm.nx * sgn * 5.5, nm.y + nm.ny * sgn * 5.5);
      g.rotate(Math.atan2(nm.dy, nm.dx));
      g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1;
      g.strokeRect(-2.5, -2, 5, 4);
      g.restore();
    }

    // セクター標識
    (res.geo.sectors || []).forEach((sc, si) => {
      const nm = normalAt(sc.from % poly.n);
      const col = ['#f0a020', '#4ea63f', '#3a7ad9'][si];
      g.save();
      g.translate(nm.x, nm.y); g.rotate(Math.atan2(nm.dy, nm.dx));
      g.fillStyle = col; g.fillRect(-1.5, -13, 3, 26);
      g.fillStyle = '#fffdf3'; g.strokeStyle = '#4a2f1a'; g.lineWidth = 1;
      g.fillRect(-6, -21, 12, 8); g.strokeRect(-6, -21, 12, 8);
      g.fillStyle = col; g.font = 'bold 7px sans-serif'; g.textAlign = 'center';
      g.fillText('S' + (si + 1), 0, -15);
      g.restore();
    });

    // 名物コーナーの表示（曲率の急なコーナーから順に名前を割り当てる）
    const marks = (res.geo.corners || []).slice().sort((a, b) => b.peak - a.peak)
      .slice(0, (res.track.landmarks || []).length);
    marks.forEach((cn, mi) => {
      const nm = normalAt(Math.round((cn.from + ((cn.to - cn.from + poly.n) % poly.n) / 2)) % poly.n);
      const label = res.track.landmarks[mi];
      const cxm = nm.x + nm.nx * 26, cym = nm.y + nm.ny * 26;
      if (cxm < 4 || cym < 4 || cxm > c.width - 4 || cym > c.height - 4) return;
      g.font = 'bold 8px sans-serif'; g.textAlign = 'center';
      const w2 = g.measureText(label).width + 8;
      g.fillStyle = 'rgba(74,47,26,.82)';
      g.fillRect(cxm - w2 / 2, cym - 6, w2, 11);
      g.fillStyle = '#ffeec4';
      g.fillText(label, cxm, cym + 2);
    });

    // スタート／フィニッシュライン
    const sf = normalAt(0);
    g.save();
    g.translate(sf.x, sf.y); g.rotate(Math.atan2(sf.dy, sf.dx));
    for (let i = -12; i < 12; i += 4) {
      g.fillStyle = ((i / 4) % 2 === 0) ? '#fff' : '#333';
      g.fillRect(-3, i, 6, 4);
    }
    g.restore();

    return c;
  }

  /* ---------- コース外の景色 ---------- */
  function seeded(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return function () { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  }

  function distToTrack(x, y) {
    let m = Infinity;
    for (let i = 0; i < poly.n; i += 2) {
      const dx = poly.pts[i][0] - x, dy = poly.pts[i][1] - y;
      const d = dx * dx + dy * dy;
      if (d < m) m = d;
    }
    return Math.sqrt(m);
  }

  function drawScenery(g, theme, W, H) {
    const rnd = seeded(res.track.name);
    const pit = pitSpan();
    // 観客席（メインストレートの、ピットと反対側）
    // コース側から順に、最前列→段々に高くなる座席→屋根、と重ねる。
    if (pit) {
      for (let k = 2; k < pit.len - 2; k += 9) {
        const nm = normalAt((pit.from + k) % poly.n);
        const sx = nm.x - nm.nx * pit.side * 31, sy = nm.y - nm.ny * pit.side * 31;
        if (sx < 10 || sy < 10 || sx > W - 10 || sy > H - 10) continue;
        g.save();
        g.translate(sx, sy);
        g.rotate(Math.atan2(nm.dy, nm.dx));
        g.scale(1, -pit.side);            // コース側がつねに手前になるように向きを揃える
        const CROWD = ['#e8564a', '#4a86e0', '#f5aa2a', '#58b84a', '#d0d0d8', '#c060c8'];
        g.fillStyle = '#3a352c'; g.fillRect(-6, -10, 12, 20);      // 土台の影
        // 段。奥へ行くほど明るくして、せり上がって見せる
        for (let t = 0; t < 4; t++) {
          const yy = -9 + t * 4.6;
          g.fillStyle = ['#6e6a5e', '#7c786a', '#8a8576', '#989282'][t];
          g.fillRect(-5, yy, 10, 4.4);
          g.fillStyle = 'rgba(0,0,0,.28)'; g.fillRect(-5, yy, 10, 0.9);  // 段の影
          for (let c2 = 0; c2 < 4; c2++) {                                // 観客
            if (((t * 7 + c2 * 3) % 5) === 0) continue;                   // ところどころ空席
            g.fillStyle = CROWD[(t * 3 + c2 * 2) % CROWD.length];
            g.fillRect(-4.2 + c2 * 2.4, yy + 1.4, 1.6, 2.2);
          }
        }
        // 屋根と、それを支える柱
        g.fillStyle = '#4a4a52'; g.fillRect(-6.5, 6.4, 1.3, 3.4); g.fillRect(5.2, 6.4, 1.3, 3.4);
        g.fillStyle = '#5e5f68'; g.fillRect(-7, 8.6, 14, 3.2);
        g.fillStyle = '#767781'; g.fillRect(-7, 8.6, 14, 1.1);
        g.restore();
      }
    }
    // 夜のコースには照明を立てる。路面を照らす円と、光源そのもの
    if (GP.data.THEMES[theme].night) {
      for (let i = 0; i < poly.n; i += 26) {
        const nm = normalAt(i);
        const lx = nm.x + nm.nx * 20, ly = nm.y + nm.ny * 20;
        if (lx < 6 || ly < 6 || lx > W - 6 || ly > H - 6) continue;
        const pool = g.createRadialGradient(lx, ly, 1, lx, ly, 34);
        pool.addColorStop(0, 'rgba(255,236,190,.30)');
        pool.addColorStop(1, 'rgba(255,236,190,0)');
        g.fillStyle = pool; g.beginPath(); g.arc(lx, ly, 34, 0, Math.PI * 2); g.fill();
        g.fillStyle = '#3a3f52'; g.fillRect(lx - 1, ly - 9, 2, 9);
        g.fillStyle = '#fff2c8'; g.fillRect(lx - 2, ly - 12, 5, 3);
        emissive.push({ x: lx - 2, y: ly - 12, w: 5, h: 3, c: '#fff2c8' });
      }
    }

    // 木・建物・岩など
    for (let i = 0; i < poly.n; i += 11) {
      for (const side of [1, -1]) {
        if (rnd() > 0.62) continue;
        const nm = normalAt(i);
        const d = 38 + rnd() * 34;
        const x = nm.x + nm.nx * side * d, y = nm.y + nm.ny * side * d;
        if (x < 10 || y < 10 || x > W - 10 || y > H - 10) continue;
        if (distToTrack(x, y) < 30) continue;
        drawProp(g, theme, x, y, rnd);
      }
    }
  }

  function drawProp(g, theme, x, y, rnd) {
    x = Math.round(x); y = Math.round(y);
    // 縁取り付きの箱。ドット絵は輪郭があると形が締まる
    const box = (bx, by, bw, bh, fill, line) => {
      g.fillStyle = line; g.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
      g.fillStyle = fill; g.fillRect(bx, by, bw, bh);
    };

    if (theme === 'street') {
      // ---- 街の建物：屋上のパラペットと設備、階ごとの窓 ----
      const w = 15 + Math.round(rnd() * 13), h = 18 + Math.round(rnd() * 20);
      const wall = ['#8e94a0', '#7c828e', '#9aa0ac', '#87909e'][Math.floor(rnd() * 4)];
      box(x - w / 2, y - h, w, h, wall, '#3f444c');
      g.fillStyle = 'rgba(255,255,255,.10)';                    // 左側に光を当てる
      g.fillRect(x - w / 2, y - h, Math.max(2, w * 0.28), h);
      for (let a = 2; a < w - 3; a += 5) {                      // 窓
        for (let b = 5; b < h - 3; b += 6) {
          g.fillStyle = ((a + b) % 3) ? 'rgba(255,240,180,.62)' : 'rgba(120,150,180,.55)';
          g.fillRect(x - w / 2 + a, y - h + b, 3, 3);
          g.fillStyle = 'rgba(0,0,0,.22)';
          g.fillRect(x - w / 2 + a, y - h + b + 3, 3, 1);       // 窓の下の影
        }
      }
      g.fillStyle = '#5c626c'; g.fillRect(x - w / 2, y - h, w, 2.5);          // 屋上
      g.fillStyle = '#6e7580'; g.fillRect(x - w / 2 - 1, y - h - 1.5, w + 2, 1.8);  // パラペット
      if (rnd() < 0.6) {                                                     // 屋上の設備
        g.fillStyle = '#4e545e'; g.fillRect(x - 2, y - h - 3.5, 5, 3);
        g.fillStyle = '#666d78'; g.fillRect(x - 2, y - h - 3.5, 5, 1);
      }

    } else if (theme === 'neon') {
      // ---- 夜の街：高い塔と、光る看板 ----
      const w = 12 + Math.round(rnd() * 12), h = 22 + Math.round(rnd() * 26);
      box(x - w / 2, y - h, w, h, '#2a3050', '#141931');
      g.fillStyle = 'rgba(120,150,220,.12)';
      g.fillRect(x - w / 2, y - h, Math.max(2, w * 0.3), h);
      const nc = ['#ff4fa0', '#4fd8ff', '#ffe14f', '#8cff6a', '#c66aff'][Math.floor(rnd() * 5)];
      // 縦看板と横看板
      g.fillStyle = nc;
      g.fillRect(x - w / 2 + 2, y - h + 3, w - 4, 3);
      emissive.push({ x: x - w / 2 + 2, y: y - h + 3, w: w - 4, h: 3, c: nc });
      if (rnd() < 0.5) {
        g.fillRect(x + w / 2 - 3.5, y - h + 8, 2.5, h * 0.4);
        emissive.push({ x: x + w / 2 - 3.5, y: y - h + 8, w: 2.5, h: h * 0.4, c: nc });
      } else {
        g.fillRect(x - w / 2 + 2, y - h + 9, Math.max(3, w - 8), 2.5);
        emissive.push({ x: x - w / 2 + 2, y: y - h + 9, w: Math.max(3, w - 8), h: 2.5, c: nc });
      }
      for (let b = 15; b < h - 3; b += 5) {                     // 灯りのついた窓
        for (let a = 2; a < w - 3; a += 4) {
          if (((a + b) % 3) === 0) continue;
          g.fillStyle = 'rgba(255,236,180,.42)';
          g.fillRect(x - w / 2 + a, y - h + b, 2, 2);
        }
      }
      g.fillStyle = '#3b4266'; g.fillRect(x - w / 2, y - h, w, 2);
      if (rnd() < 0.45) {                                       // 塔の頂の航空障害灯
        g.fillStyle = '#ff5a4a'; g.fillRect(x - 0.8, y - h - 3, 1.6, 3);
        emissive.push({ x: x - 0.8, y: y - h - 3, w: 1.6, h: 3, c: '#ff5a4a' });
      }

    } else if (theme === 'desert') {
      const k = rnd();
      if (k < 0.42) {
        // ヤシの木：幹に節を入れ、葉を左右に垂らす
        const th2 = 16 + Math.round(rnd() * 8);
        g.fillStyle = '#4a3620'; g.fillRect(x - 2, y - th2, 4, th2);
        g.fillStyle = '#7a5c32'; g.fillRect(x - 1, y - th2, 2, th2);
        g.fillStyle = '#5c4526';
        for (let b = 3; b < th2; b += 4) g.fillRect(x - 2, y - th2 + b, 4, 1);
        const leaf = (dx, dy, lw, lh, c) => { g.fillStyle = c; g.fillRect(x + dx, y - th2 + dy, lw, lh); };
        leaf(-12, -1, 10, 3, '#255c2e'); leaf(2, -1, 10, 3, '#255c2e');
        leaf(-9, -4, 8, 3, '#2f6b38');   leaf(1, -4, 8, 3, '#2f6b38');
        leaf(-6, -7, 5, 3, '#3f8a4a');   leaf(1, -7, 5, 3, '#3f8a4a');
        leaf(-2, -9, 4, 3, '#4a9a55');
        g.fillStyle = '#8a6a3a'; g.fillRect(x - 2, y - th2 - 1, 4, 2);   // 実
      } else if (k < 0.72) {
        // 岩：面ごとに明るさを変えて塊に見せる
        const w = 13 + Math.round(rnd() * 8), h = 8 + Math.round(rnd() * 5);
        box(x - w / 2, y - h, w, h, '#9a8358', '#635033');
        g.fillStyle = '#b9a077'; g.fillRect(x - w / 2 + 1, y - h + 1, w * 0.55, h * 0.45);
        g.fillStyle = '#c8b189'; g.fillRect(x - w / 2 + 2, y - h + 1, w * 0.3, 2);
        g.fillStyle = '#7a6544'; g.fillRect(x - w / 2, y - 2, w, 2);
      } else {
        // サボテン
        const h = 12 + Math.round(rnd() * 8);
        g.fillStyle = '#2f6b38'; g.fillRect(x - 2.5, y - h, 5, h);
        g.fillStyle = '#3f8a4a'; g.fillRect(x - 1.5, y - h, 2, h);
        g.fillStyle = '#2f6b38';
        g.fillRect(x - 7, y - h * 0.7, 4.5, 3); g.fillRect(x - 7, y - h * 0.7, 3, 7);
        g.fillRect(x + 2.5, y - h * 0.55, 4.5, 3); g.fillRect(x + 4, y - h * 0.55, 3, 6);
      }

    } else if (theme === 'alpine') {
      // ---- 針葉樹：三角を重ねて円錐にする ----
      const h = 20 + Math.round(rnd() * 10);
      g.fillStyle = '#43301a'; g.fillRect(x - 1.5, y - 5, 3, 5);
      for (let t = 0; t < 4; t++) {
        const yy = y - 5 - t * (h / 5.2), hw = 8 - t * 1.7;
        g.fillStyle = '#123a1c'; g.fillRect(x - hw - 1, yy - h / 4.4, hw * 2 + 2, h / 4.4 + 1);
        g.fillStyle = ['#1d5228', '#236030', '#2a6d37', '#31793d'][t];
        g.fillRect(x - hw, yy - h / 4.4, hw * 2, h / 4.4);
        g.fillStyle = 'rgba(210,235,255,.30)';                   // 左肩の雪
        g.fillRect(x - hw, yy - h / 4.4, hw * 0.7, 1.6);
      }

    } else {
      // ---- 広葉樹（芝・森）：幹・影の葉・本体・光の葉 の4層 ----
      const dark = theme === 'forest';
      const sc = 0.85 + rnd() * 0.5;
      const cw = Math.round(9 * sc), ch = Math.round(11 * sc);
      g.fillStyle = '#3a2712'; g.fillRect(x - 2, y - 8, 4, 8);          // 幹
      g.fillStyle = '#6a4a2a'; g.fillRect(x - 1, y - 8, 2, 8);
      const c0 = dark ? '#0f2d14' : '#173a1a';
      const c1 = dark ? '#1f5024' : '#2a6b2b';
      const c2 = dark ? '#2e6e33' : '#3f8c3c';
      const c3 = dark ? '#3f8543' : '#59a94f';
      g.fillStyle = c0;                                                 // 輪郭
      g.fillRect(x - cw - 1, y - 7 - ch, cw * 2 + 2, ch + 1);
      g.fillRect(x - cw * 0.6, y - 10 - ch, cw * 1.2, 4);
      g.fillStyle = c1;                                                 // 本体
      g.fillRect(x - cw, y - 7 - ch, cw * 2, ch);
      g.fillRect(x - cw * 0.55, y - 9.5 - ch, cw * 1.1, 3.5);
      g.fillStyle = c2;                                                 // 中間の葉
      g.fillRect(x - cw + 1, y - 6 - ch, cw * 1.2, ch * 0.55);
      g.fillStyle = c3;                                                 // 光の当たる葉
      g.fillRect(x - cw + 1.5, y - 5.5 - ch, cw * 0.7, ch * 0.3);
      g.fillRect(x - cw * 0.4, y - 9 - ch, cw * 0.5, 2.5);
      if (!dark && rnd() < 0.25) {                                      // たまに花や実
        g.fillStyle = '#f0d84a';
        g.fillRect(x - cw * 0.2, y - 4 - ch, 1.6, 1.6);
        g.fillRect(x + cw * 0.4, y - 6 - ch, 1.6, 1.6);
      }
    }
  }

  /* ピットレーンを敷く区間。最長ストレートの内側に収め、外向きの法線を選ぶ */
  function pitSpan() {
    const L = res.geo.longest;
    if (!L || L.len <= 0) return null;
    const span = (L.to - L.from + poly.n) % poly.n;
    if (span < 14) return null;
    const from = (L.from + 3) % poly.n;
    const len = Math.min(span - 6, Math.round(poly.n * 0.22));
    // コース全体の重心から見て外を向くほうへ寄せる
    let cx = 0, cy = 0;
    for (let i = 0; i < poly.n; i++) { cx += poly.pts[i][0]; cy += poly.pts[i][1]; }
    cx /= poly.n; cy /= poly.n;
    const mid = normalAt((from + (len >> 1)) % poly.n);
    const side = ((mid.x - cx) * mid.nx + (mid.y - cy) * mid.ny) >= 0 ? 1 : -1;
    return { from: from, len: len, side: side };
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    const f = v => Math.max(0, Math.min(255, Math.round(v + 255 * amt)));
    return 'rgb(' + f((n >> 16) & 255) + ',' + f((n >> 8) & 255) + ',' + f(n & 255) + ')';
  }

  /* =========================================================
     カメラ
     全体を見せるモードと、注目している車に寄るモードを持ち、
     切り替えは滑らかに補間する
     ========================================================= */
  let cam = { x: 0, y: 0, z: 1, tx: 0, ty: 0, tz: 1, mode: 'auto', focusId: null, label: '' };

  function setCamMode(m) {
    cam.mode = m;
    const bar = document.getElementById('rvCam');
    if (bar) Array.prototype.forEach.call(bar.children, b => b.classList.toggle('on', b.dataset.cam === m));
  }

  /* いま寄るべき相手を決める */
  function pickFocus(t) {
    const ord = orderAt(t);
    const alive = ord.filter(o => !o.out);
    if (!alive.length) return null;
    const mine = alive.filter(o => o.e.isPlayer);

    if (cam.mode === 'wide') return null;
    if (cam.mode === 'mine') return mine.length ? { list: mine.slice(0, 2), label: 'マイチーム' } : null;

    // auto：自チームが誰かと接近していればそのバトル、いなければ先頭争い
    for (let i = 0; i < alive.length; i++) {
      if (!alive[i].e.isPlayer) continue;
      const near = [];
      if (i > 0) near.push(alive[i - 1]);
      near.push(alive[i]);
      if (i < alive.length - 1) near.push(alive[i + 1]);
      const spread = Math.abs(near[0].p - near[near.length - 1].p) * res.track.base;
      if (near.length > 1 && spread < 2.2) {
        return { list: near, label: '⚔️ ' + alive[i].e.driver.name + ' のバトル' };
      }
    }
    const lead = alive.slice(0, 2);
    const gap = lead.length > 1 ? Math.abs(lead[0].p - lead[1].p) * res.track.base : 99;
    if (gap < 2.0) return { list: lead, label: '⚔️ 首位争い' };
    return mine.length ? { list: mine.slice(0, 1), label: mine[0].e.driver.name } : { list: lead.slice(0, 1), label: '先頭' };
  }

  /* カメラの目標位置を更新する */
  function updateCam(t) {
    const f = pickFocus(t);
    cam.label = f ? f.label : '';
    if (!f) { cam.tx = cv.width / 2; cam.ty = cv.height / 2; cam.tz = 1; }
    else {
      let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
      f.list.forEach(o => {
        const pt = placeInLap(o.e, o.p);
        minX = Math.min(minX, pt.x); maxX = Math.max(maxX, pt.x);
        minY = Math.min(minY, pt.y); maxY = Math.max(maxY, pt.y);
      });
      const pad = 90;
      const w = Math.max(160, maxX - minX + pad * 2), h = Math.max(120, maxY - minY + pad * 2);
      cam.tx = (minX + maxX) / 2; cam.ty = (minY + maxY) / 2;
      cam.tz = Math.max(1, Math.min(2.6, Math.min(cv.width / w, cv.height / h)));
    }
    // 滑らかに追従する
    const k = 0.07;
    cam.x += (cam.tx - cam.x) * k;
    cam.y += (cam.ty - cam.y) * k;
    cam.z += (cam.tz - cam.z) * k;
    // 画面の外が映らないように寄せる
    const halfW = cv.width / (2 * cam.z), halfH = cv.height / (2 * cam.z);
    cam.x = Math.max(halfW, Math.min(cv.width - halfW, cam.x));
    cam.y = Math.max(halfH, Math.min(cv.height - halfH, cam.y));
  }

  /* ---------- 毎フレームの描画 ---------- */
  function draw(t) {
    const w = cv.width, h = cv.height;
    const wet = res.weather.key === 'rain' || res.weather.key === 'storm';
    const night = !!(GP.data.THEMES[GP.data.TRACK_THEME[res.track.name] || 'grass'] || {}).night;

    updateCam(t);

    // 世界はいったん裏画面に描き、あとから光と色を乗せて画面に出す
    const out = ctx;
    const buf = GP.fx.begin();
    if (buf) ctx = buf;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, w, h);
    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.scale(cam.z, cam.z);
    ctx.translate(-cam.x, -cam.y);

    if (trackArt) ctx.drawImage(trackArt, 0, 0); else { ctx.fillStyle = '#7fbf5a'; ctx.fillRect(0, 0, w, h); }

    // 雨演出
    if (wet) {
      ctx.strokeStyle = 'rgba(180,210,255,.45)'; ctx.lineWidth = 1;
      for (let i = 0; i < 60; i++) {
