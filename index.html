<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>グランプリ物語 - F1チーム運営シミュレーション</title>

<!-- ホーム画面に追加してアプリとして遊べるようにする -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4a2f1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GP物語">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="stylesheet" href="assets/style.css">
<!--
  ドット絵フォントは表示完了後に読み込む。
  ネットに繋がらない環境でも起動が一切遅れないようにするため、
  <link> ではなく load イベント後に差し込む。取得できなくてもフォールバック書体で遊べる。
-->
<script>
  window.addEventListener('load', function () {
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=DotGothic16&display=swap';
    document.head.appendChild(l);
  });

  // assets/ や src/ が読み込めていない場合は、素のHTMLが表示されてしまう。
  // 何が起きているのか分かるように案内を出す（このスクリプトは外部ファイルに依存しない）
  window.addEventListener('load', function () {
    if (window.GP && window.GP.state) return;
    var d = document.createElement('div');
    d.setAttribute('style',
      'position:fixed;top:0;right:0;bottom:0;left:0;z-index:9999;background:#fff8e3;' +
      'color:#4a2f1a;padding:24px;font:14px/1.8 sans-serif;overflow:auto');
    d.innerHTML =
      '<h2 style="margin:0 0 12px">ゲームのファイルが読み込めませんでした</h2>' +
      '<p><b>index.html だけでは動きません。</b>同じ場所に <code>assets/</code> と ' +
      '<code>src/</code> のフォルダが必要です。</p>' +
      '<p style="margin-top:14px"><b>いちばん簡単な遊びかた</b><br>' +
      'リポジトリの <code>grandprix.html</code>（1ファイルで完結する版）を' +
      'ダウンロードして開いてください。フォルダごと保存する必要がありません。</p>' +
      '<p style="margin-top:14px">リポジトリ全体を保存した場合は、' +
      'フォルダを丸ごと置いたうえで <code>index.html</code> を開いてください。</p>';
    document.body.appendChild(d);
  });
</script>
</head>
<body>

<div id="app">

  <!-- ================= トップバー ================= -->
  <header class="topbar">
    <div class="tb-team"><span id="tTeamDot" class="dot"></span><span id="tTeam">-</span>
      <span id="tRank" class="rank">-</span><span id="tMode" class="mode">-</span></div>
    <div class="tb-stats">
      <div class="stat"><span class="ic">💰</span><b id="tFunds">0</b><small>万</small></div>
      <div class="stat"><span class="ic">👥</span><b id="tFans">0</b></div>
      <div class="stat hype" id="tHypeBox" title="メディアでの扱い。高いほどスポンサー収入が増える">
        <span class="ic" id="tHypeIc">🫥</span><i class="hypebar"><b id="tHypeBar"></b></i><b id="tHypeVal">0</b></div>
      <div class="stat"><span class="ic">🔬</span><b id="tRp">0</b></div>
      <div class="stat ticket" id="tTicketBox"><span class="ic">🎫</span><b id="tTicket">0</b></div>
      <div class="stat"><span class="ic">📅</span>S<b id="tSeason">1</b> W<b id="tWeek">1</b></div>
      <button class="stat sound" id="tSkin" title="見た目の切り替え（HD-2D／カイロ風）">🎨</button>
      <button class="stat sound" id="tSound" title="効果音の切り替え">🔊</button>
    </div>
    <div class="tb-next" id="tNext">-</div>
  </header>

  <!-- ================= メイン ================= -->
  <main class="main">
    <section id="viewPanel" class="col-left"></section>
    <aside id="sidePanel" class="col-right"></aside>
  </main>

  <!-- ================= コマンドバー ================= -->
  <nav class="cmdbar">
    <div id="cmdNormal" class="cmdset">
      <button class="cmd" id="cDevelop" title="いま積んでいるものを煮詰める。格（レアリティ）が上がる"><span>🔧</span>改良</button>
      <button class="cmd" id="cDesign" title="新しい技術とパーツを作る。技術（タグ）のレベルが上がる"><span>📐</span>開発</button>
      <button class="cmd" id="cResearch"><span>🔬</span>研究</button>
      <button class="cmd" id="cMaintain"><span>🛠️</span>整備</button>
      <button class="cmd" id="cTrain"><span>💪</span>練習</button>
      <button class="cmd" id="cSponsor"><span>📣</span>営業</button>
      <button class="cmd" id="cRest"><span>☕</span>休養</button>
      <button class="cmd" id="cCrunch" title="次の1コマンドが2回ぶんになるが、疲れが残る"><span>🌙</span>徹夜</button>
      <button class="cmd" id="cKart" title="自前のカート場でレースを開く。若手が伸び、街の子が見つかる"><span>🏁</span>カート</button>
      <span class="cmd-sep"></span>
      <button class="cmd sub" id="cGarage"><span>🏎️</span>マシン</button>
      <button class="cmd sub" id="cFacility"><span>🏗️</span>施設</button>
      <button class="cmd sub" id="cStaff"><span>👥</span>人事</button>
      <button class="cmd sub" id="cLogi"><span>🚚</span>輸送</button>
      <button class="cmd sub" id="cInfo"><span>📖</span>情報</button>
      <button class="cmd sub" id="cOwner"><span>🎩</span>オーナー</button>
    </div>
    <div id="cmdRace" class="cmdset" style="display:none">
      <button class="cmd big" id="cRaceGo"><span>🏁</span>レースへ向かう！</button>
      <span class="cmd-sep"></span>
      <button class="cmd sub" id="cGarageR"><span>🏎️</span>マシン</button>
      <button class="cmd sub" id="cFacilityR"><span>🏗️</span>施設</button>
      <button class="cmd sub" id="cStaffR"><span>👥</span>人事</button>
      <button class="cmd sub" id="cLogiR"><span>🚚</span>輸送</button>
      <button class="cmd sub" id="cOwnerR"><span>🎩</span>オーナー</button>
    </div>
    <div id="cmdOff" class="cmdset" style="display:none">
      <button class="cmd big" id="cOffGo"><span>🌱</span>来季を始める</button>
      <span class="cmd-sep"></span>
      <button class="cmd sub" id="cGarageO"><span>🏎️</span>マシン</button>
      <button class="cmd sub" id="cFacilityO"><span>🏗️</span>施設</button>
      <button class="cmd sub" id="cStaffO"><span>👥</span>人事</button>
      <button class="cmd sub" id="cLogiO"><span>🚚</span>輸送</button>
      <button class="cmd sub" id="cInfoO"><span>📖</span>情報</button>
      <button class="cmd sub" id="cOwnerO"><span>🎩</span>オーナー</button>
    </div>
  </nav>
</div>

<!-- ================= レース画面 ================= -->
<div id="raceScreen">
  <div class="rv-wrap">
    <div class="rv-head">
      <b id="rvTrack">-</b>
      <span id="rvWeather">-</span>
      <span id="rvLap">LAP 1 / 1</span>
      <span id="rvWet" class="rv-wet"></span>
      <span id="rvOrders" class="rv-orders"></span>
    </div>
    <div class="rv-body">
      <div class="rv-canvaswrap">
        <canvas id="raceCanvas" width="560" height="400"></canvas>
        <div id="rvFlash" class="rv-flash"></div>
        <div id="rvBadge" class="rv-badge"></div>
        <div id="rvRadio" class="rv-radio"></div>
        <div id="rvCam" class="rv-cam">
          <button data-cam="auto" class="on">🎬 おまかせ</button>
          <button data-cam="mine">🚩 自チーム</button>
          <button data-cam="wide">🗺️ 全体</button>
        </div>
      </div>
      <div class="rv-side">
        <div class="rv-order-h">順位</div>
        <div id="rvOrder" class="rv-order"></div>
      </div>
    </div>
    <div id="rvSectors" class="rv-sectors"></div>
    <div id="rvLog" class="rv-loglist"></div>
    <div class="rv-ctrl">
      <button class="btn" id="rvSpeed0"><i>🐢</i><span>とてもゆっくり</span></button>
      <button class="btn primary" id="rvSpeed1"><i>▶</i><span>ゆっくり</span></button>
      <button class="btn" id="rvSpeed2"><i>▶▶</i><span>ふつう</span></button>
      <button class="btn" id="rvSpeed3"><i>▶▶▶</i><span>はやい</span></button>
      <button class="btn" id="rvSpeedReal" title="実際のレースと同じ速さで進みます"><i>⏱</i><span>実時間</span></button>
      <button class="btn" id="rvTiming" title="全車のセクタータイム・ラップ・ベスト・前車とのギャップ"><i>📋</i><span>タイミングモニター</span></button>
      <button class="btn primary" id="rvSkip"><i>⏭</i><span>結果へ</span></button>
    </div>
  </div>
</div>

<!-- ================= モーダル ================= -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-h"><span id="modalTitle"></span><span id="modalFunds" class="mfunds"></span><button id="modalClose" class="modal-x">✕</button></div>
    <div id="modalBody" class="modal-body"></div>
    <div id="modalBtns" class="modal-btns"></div>
  </div>
</div>

<div id="toastLayer"></div>

<script src="src/sound.js"></script>
    <script src="src/fx.js"></script>
<script src="src/data.js"></script>
<script src="src/geom.js"></script>
<script src="src/state.js"></script>
<script src="src/race.js"></script>
<script src="src/raceview.js"></script>
<script src="src/base.js"></script>
<script src="src/paddock.js"></script>
<script src="src/grid.js"></script>
<script src="src/interior.js"></script>
<script src="src/ui.js"></script>
<script src="src/main.js"></script>
</body>
</html>
